# Registro delle voci di F0 (letto dal servizio voce, services/voce).
#
# Ogni voce è un clone ICL di Qwen3-TTS 0.6B Base: serve la clip di riferimento
# (circa 8 s, mono) e la sua trascrizione ESATTA in `testo_rif`. Se il testo non
# corrisponde all'audio, il clone si degrada (parole inventate, timbro instabile).
#
# - id: quello che il server manda in POST /tts {"voce": ...}
# - file: percorso relativo a questa cartella
# - testo_rif: trascrizione esatta della clip
# - descrizione: a cosa serve la voce (per il preparatore e per chi ascolta)
#
# - simile_a: voci che a orecchio si confondono con questa (simmetrico: basta
#   scriverlo da una parte). Il validatore delle campagne vieta due voci simili
#   nella stessa scena, come due voci uguali.
#
# Le clip sono voci sintetiche HeyGen (non persone reali), prese dalle prove
# del 1° novembre 2026 (research/). Nadine e Tabitha sono vicine di tono
# (0,66 semitoni sui cloni): vanno sostituite prima del gioco vero.
#
# Voce del gioco dal 9 novembre 2026: fish-audio/drama-3 via OpenRouter (docs/ricerca-voce-drama3.md).
# - fish: reference_id di una voce pubblica di Fish Audio (api.fish.audio/model/<id>), letto dal server
#   (apps/server/src/voce/registro-voci.ts); i campi sopra restano per Qwen, che è la riserva.
# - fish_titolo, fish_perche: com'è intitolata su Fish e perché è stata scelta.
# Criteri di scelta: voce in italiano; titolo e campione generici, cioè nessun clone dichiarato di una
# persona reale (attori, doppiatori, youtuber, politici) né di un personaggio di film o cartoni; voci
# distinte tra loro a orecchio. Misure del 9/11 su una battuta di prova per voce: f0 mediana e
# baricentro spettrale (timbro), e la trascrizione Whisper, che le ha capite tutte parola per parola.
# simile_a vale per i cloni Qwen. Con drama-3 nadine (210 Hz) e tabitha (296 Hz) sono lontane sei
# semitoni. Se si cambia una voce fish, va svuotata cache/audio-fish.

voci:
  - id: narratore
    file: narratore.wav
    testo_rif: "Benvenuti, avventurieri, nella taverna del Cervo Azzurro, dove il fuoco non si spegne mai e ogni storia ha un prezzo."
    descrizione: "Voce fissa del narratore (clip «bram» delle prove HeyGen), sempre la stessa per tutta la campagna."
    fish: 130bd00e5d89470bb0352d20b8c4bf8b
    fish_titolo: "Narratore Calmo"
    fish_perche: "Maschile, calda e misurata, la voce italiana per il racconto più usata su Fish (6.657 usi, 27 like). Chiara alla trascrizione, primo audio in circa 0,45 s. f0 135 Hz: sta in mezzo tra le voci dei PNG e non si confonde con nessuna."

  - id: vincent
    file: vincent.wav
    testo_rif: "Siete arrivati tardi, stranieri. La strada per Vallestorta è chiusa da settimane, e chi la percorre di notte non fa più ritorno."
    descrizione: "Nano burbero, maschile, voce grave e ruvida."
    fish: 9b0dc46209e0464483dcc0015a032111
    fish_titolo: "Voce bassa"
    fish_perche: "Maschile anziana, profonda e autorevole (tag: deep, low, dark). È la più grave delle voci maschili provate: f0 111 Hz, quattro semitoni sotto il narratore. Va bene per i vecchi burberi delle campagne: Ettore, Baldrin, Tullio. Scartate «Voce Maschile Scontroso» e «Voce Ironica Anziana», che a un tono neutro rispondevano gridando (circa 200 Hz)."

  - id: nadine
    file: nadine.wav
    testo_rif: "Siete arrivati tardi, stranieri. La strada per Vallestorta è chiusa da settimane, e chi la percorre di notte non fa più ritorno."
    descrizione: "Locandiera anziana, femminile, voce matura."
    simile_a: [tabitha]
    fish: e63400ae1f9d4e5a994b87095f6a9dbb
    fish_titolo: "Nonna barbara"
    fish_perche: "Femminile anziana, calma ed espressiva, da racconto (tag: old, warm, storytelling). Va bene per le donne mature delle campagne: Adelina, Ottavia, Rosa. f0 210 Hz. Scartate «Iadda» e «Annammorrria», più piatte e da conversazione quotidiana."

  - id: lucian
    file: lucian.wav
    testo_rif: "Siete arrivati tardi, stranieri. La strada per Vallestorta è chiusa da settimane, e chi la percorre di notte non fa più ritorno."
    descrizione: "Straniero incappucciato, maschile, voce bassa e misteriosa."
    fish: 60b51b6e9e654e06b54871895b1c9a71
    fish_titolo: "ITAL"
    fish_perche: "Maschile di mezza età, bassa, scura e raccolta (tag: mysterious, deep, intimate). Il campione è un generico racconto di nebbia. È il timbro più scuro tra le voci provate (baricentro 860 Hz contro 1014 di vincent e 1358 del narratore), f0 96 Hz: va bene per i «quasi un sussurro» come Gaspare e Vischi. Scartate «Scanner» e «Narratore Solenne», perché i loro campioni sembrano battute di film doppiati (Transformers per il secondo)."

  - id: tabitha
    file: tabitha.wav
    testo_rif: "Siete arrivati tardi, stranieri. La strada per Vallestorta è chiusa da settimane, e chi la percorre di notte non fa più ritorno."
    descrizione: "Giovane ladra, femminile, voce giovane e sfacciata."
    simile_a: [nadine]
    fish: 367577d036bb49e4a7799169ed5ec0fc
    fish_titolo: "Voce Vivace Italiana"
    fish_perche: "Femminile giovane, energica ed espressiva (tag: young, playful). È la più alta delle voci provate (f0 296 Hz), lontana da nadine. Va bene per le ragazze svelte: Zelia, Bice. Scartata «Ragazza Vivace» (219 Hz), che si sarebbe confusa con nadine."
