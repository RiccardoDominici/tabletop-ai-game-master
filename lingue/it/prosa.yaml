  - sospira
  - risata
  - ride
  - risatina
  - respiro
  - respira
  - pausa
  - tosse
  - tossisce

# Forme dello `stile` di una voce che dicono quante parole per frase: «di 3-8 parole», «da tre a otto parole»,
# «al massimo sei parole». Tre gruppi per forma: il massimo è nel secondo, quarto o quinto (vedi testo.py).
stile_frasi: '(\w+)\s*[-–]\s*(\w+) parole|da (\w+) a (\w+) parole|al massimo (\w+) parole'

# Il registro di una voce dice con quale pronome si dà del tu, del voi o del lei (regole_png.py).
registro_pronomi: '\b(tu|voi|lei)\b'

# Lunghezze della scrittura per l'ascolto (N1, N2, D3, prompt del narratore). Vedi docs/manuale-master.md §5.
lunghezze:
  frase_max: 20                 # N1: parole per frase nei testi da leggere delle schede
  narratore_battuta: 16         # prompt §2: parole per frase delle battute del narratore
  png_battuta: 16               # parole per frase delle battute di un PNG, se lo stile non dice altro
  media_narratore: [8, 14]      # N1: media parole per frase del narratore
  frasi_narratore_battuta: 4    # N2: frasi di narratore in una battuta
  parole_battuta: 70            # tetto di parole di una battuta intera
  frasi_png: 2                  # D3: frasi di un PNG in una battuta
  frasi_png_rivelazione: 4      # D3, eccezione per confessione, momento e finale

# Soprannomi che valgono per mezzo paese: un PNG con uno di questi `alias` entra nella pertinenza di ogni azione
# su un vecchio, una ragazza, un uomo (nota 11 della prova cieca).
alias_generici: [uomo, donna, vecchio, vecchia, vecchi, vecchie, ragazzo, ragazza, ragazzi, bambino, bambina, signore,
  signora, tizio, tizia, tipo, amico, amica, gente, persona, lui, lei, giovane, anziano, anziana, uno, una, qualcuno]

# Parole che in un id di battuta, letto come una frase nel catalogo del selettore, dicono chi mente o che cosa è vero
# (note 10 e 19 di nozze-neve: `ott_segale_versione`, `ade_verita`). Si confrontano con le parole dell'id divise sui
# trattini bassi.
id_rivelatori: [versione, vero, vera, veri, verita, bugia, bugie, mente, mentire, menzogna, confessa, confessione,
  segreto, segreta, falso, falsa, colpa, colpevole, ladro, ladra, nasconde, nascosto, nascosta, ammette, cede, rivela,
  smaschera]

# Parole che nel `quando` direbbero al selettore chi mente, nasconde o confessa (espressioni regolari, minuscole).
quando_vietate:
  - '\bment(e|o|ire|isce|ito|iva|ono)\b'
  - '\bbugi'
  - 'menzogn'
  - 'confess'
  - 'segret'
  - 'nascond'
  - '\bverità\b'

# Indizi di privatezza o di un PG preciso dentro `cede_se`: la confessione deve avere il cancello strutturale.
cede_privato: 'privat|non (può|puo) sentire|non sente|da solo a solo|sottovoce|lontano da(lle orecchie)?|senza testimoni'

# Nomi di mostri e di razze di gioco (manuale Basic Fantasy e simili): nei prompt delle immagini il generatore
# non li conosce e disegna altro (un hobgoblin diventa un orso). Un prompt descrive l'aspetto, non il nome.
# Avviso, non errore: «goblin» può comparire in un testo che non va al generatore.
mostri_di_gioco:
  - goblin
  - hobgoblin
  - bugbear
  - owlbear
  - kobold
  - gnoll
  - orc
  - ogre
  - troll
  - ghoul
  - wight
  - wraith
  - gargoyle
  - basilisk
  - manticora
  - medusa
