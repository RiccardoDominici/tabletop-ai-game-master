# Regole di prosa del validatore in italiano (strumenti/valida/): la lingua di riferimento (docs/lingue.md).
# Il controllo sta nel codice e non cambia con la lingua; qui stanno i dati che dipendono dalla lingua.
# Ogni altra lingua (lingue/<codice>/prosa.yaml) ha esattamente queste chiavi.
# I messaggi per chi scrive la campagna restano in italiano, nel codice.

# N5 (manuale §5): cliché e aggettivi che nominano l'emozione. Si cercano come sottostringhe, in minuscolo.
cliche:
  - brivido lungo la schiena
  - sangue gelato
  - gelato nelle vene
  - l'aria è densa
  - l'aria è carica
  - silenzio assordante
  - come se il tempo si fosse fermato
  - non potete fare a meno di
  - sentite che qualcosa non va
  - aura di mistero
  - danza di ombre
  - inquietante
  - misterios
  - terrificante
  - mozzafiato
  - epic

