  - guardo
  - guardare
  - vedo
  - dico
  - dire
  - parlo
  - parlare
  - chiedo
  - chiedere
  - voglio
  - prendo
  - apro
  - dentro
  - fuori
  - sotto
  - sopra
  - dietro
  - davanti
  - subito
  - adesso
  - ora
  - bene
  - male
  - cosa
  - nome
  - detto

# Parole che non fanno radice (le radici sono le prime quattro lettere delle parole di almeno quattro lettere,
# senza queste): segnali delle menzogne, versioni, prezzi delle scelte.
parole_vuote:
  - della
  - delle
  - degli
  - dello
  - nella
  - nelle
  - negli
  - sulla
  - sulle
  - sugli
  - anche
  - sono
  - come
  - quando
  - dove
  - perché
  - mentre
  - sempre
  - ogni
  - poi

# Numeri in lettere: quelli che il registro di una voce può dire («Frasi di due-sei parole»).
numeri:
  uno: 1
  una: 1
  due: 2
  tre: 3
  quattro: 4
  cinque: 5
  sei: 6
  sette: 7
  otto: 8
  nove: 9
  dieci: 10
  undici: 11
  dodici: 12
  tredici: 13
  quattordici: 14
  quindici: 15
  sedici: 16
  diciassette: 17
  diciotto: 18
  diciannove: 19
  venti: 20

# Suoni e parole di drama-3 da non prendere per direzioni (sigh, risata, sospiro…). Ammessi anche in italiano.
suoni:
  - sigh
  - sighs
  - laugh
  - laughs
  - laughing
  - chuckle
  - chuckles
  - breath
  - breathes
  - deep breath
  - shaky breath
  - pause
