# Forme dello `stile` di una voce che dicono quante parole per frase: «di 3-8 parole», «da tre a otto parole»,
# «al massimo sei parole». Tre gruppi per forma: il massimo è nel secondo, quarto o quinto (vedi testo.py).
stile_frasi: '(\w+)\s*[-–]\s*(\w+) parole|da (\w+) a (\w+) parole|al massimo (\w+) parole'

# Il registro di una voce dice con quale pronome si dà del tu, del voi o del lei (regole_png.py).
registro_pronomi: '\b(tu|voi|lei)\b'

# Lunghezze della scrittura per l'ascolto (N1, N2, D3, prompt del narratore). Vedi docs/manuale-master.md §5.
lunghezze:
  frase_max: 20                 # N1: parole per frase nei testi da leggere delle schede
  narratore_battuta: 16         # prompt §2: parole per frase delle battute del narratore
  png_battuta: 16               # parole per frase delle battute di un PNG, se lo stile non dice altro
  media_narratore: [8, 14]      # N1: media parole per frase del narratore
  frasi_narratore_battuta: 4    # N2: frasi di narratore in una battuta
  parole_battuta: 70            # tetto di parole di una battuta intera
  frasi_png: 2                  # D3: frasi di un PNG in una battuta
  frasi_png_rivelazione: 4      # D3, eccezione per confessione, momento e finale
