# Coherence ledger (apps/server/src/coerenza/, docs/coerenza.md): the «Cosa è vero adesso» section of the narrator's and
# the selector's message (coerenza/blocco.ts). States are the ledger's (bands, never hit points).
coerenza:
  titolo: "## Cosa è vero adesso (lo tiene il Motore: la narrazione non lo contraddice; chi non parla né agisce, tace)"
  in_scena: "In scena: {elenco}."
  usciti: "Usciti dalla scena: {elenco}. Qui non parlano né agiscono."
  uscito: "{nome} (al turno {turno}{verso})"
  verso: ", verso {luogo}"
  pg: "PG: {elenco}."
  esiti: "In questo turno: {elenco}."
  esito_colpito: "{chi} colpisce {bersaglio}"
  esito_mancato: "{chi} manca {bersaglio}"
  esito_a_terra: "{chi} manda a terra {bersaglio}"
  prova_riuscita: "{chi}: {etichetta} riuscita"
  prova_fallita: "{chi}: {etichetta} fallita"
  negati: "Hanno rifiutato in questo turno: {elenco}."
  negato: "{png} a {pg}"
  stato:
    in_piedi: "{nome} in piedi"
    ferito: "{nome} ferito"
    grave: "{nome} ferito gravemente"
    a_terra: "{nome} a terra senza sensi: non parla né agisce"
    morente: "{nome} a terra, morente: non agisce"
    morto: "{nome} non è più in vita: non parla né agisce, il corpo è lì"
    fuggito: "{nome} fuggito"
    nascosto: "{nome} nascosto"
  improvvisato: " (improvvisato: nessuna statistica, non sa nessun segreto)"
  # A name the players invent (coerenza/nomi-nuovi.ts): in mode B and with the local reader the Engine answers it.
  nome_nuovo: "{nome}? Qui nessuno conosce questo nome."
  # An action goes somewhere the campaign does not have (coerenza/destinazioni.ts): the roads that really leave the scene.
  strade: "Da qui le strade che conoscete portano soltanto verso: {luoghi}."
  strade_nessuna: "Da qui non parte nessuna strada per quel posto."
  # The places the players invented in this visit, for «Cosa è vero adesso» (the narrator and the scriptwriter).
  luogo_nuovo_riga: "Qui non c'è nessun luogo come {luoghi}: nessuna battuta lo dà per vero (al più un PNG presente dice di non conoscerlo)."
  nome_nuovo_riga: "Nessuno in scena si chiama {nomi}: nessun PNG risponde a quel nome, non dargli voce."
  # The Engine's answer to an action whose sentences the checker dropped (coerenza/risposta.ts): who tried, how it went.
  risposta:
    riuscita: "{chi} ci riesce."
    fallita: "{chi} ci prova, ma non ci riesce."
    bersaglio_a_terra: "{chi} ci prova, ma {bersaglio} non si muove più."
    bersaglio_via: "{chi} ci prova, ma {bersaglio} non è più qui."
    impossibile: "{chi} ci prova, ma così non si può."
    tentativo: "{chi} ci prova."
    # A private action nothing answered (A20): the Engine's discreet answer, only on that phone (no card to tell).
    privata: "Lo fai in disparte. Per ora non succede altro."
  # R-inesistente (coerenza/inesistenti.ts): who is really there, when the players name a creature the scene does not have.
  inesistente:
    e: "e"
    presenti_uno: "Oltre a voi, in piedi qui si vede soltanto {elenco}."
    presenti: "Oltre a voi, in piedi qui si vedono soltanto {elenco}."
    nessuno: "Oltre a voi, qui non si vede nessuno in piedi."
    riga: "Nessuno in scena è {parole}: chi i giocatori chiamano così non c'è; non farlo agire, parlare né colpire, e non inventarlo."
  riparazione:
    messaggio: "## Correggi una frase\nLa frase «{frase}» non si può dire: {errore}.\n\n{vero}\n\nRiscrivi soltanto quella frase: una sola riga [narratore], al massimo venti parole, coerente con ciò che è vero adesso. Niente altro."
    errore:
      fuori_gioco_agisce: "fa agire o parlare chi è a terra, morto, fuggito o uscito ({sostituto})"
      caduta_senza_fatto: "fa cadere chi per il Motore è ancora in piedi ({sostituto})"
      colpo_contrario: "racconta un colpo al contrario della carta ({sostituto})"
  # The yes/no question of the candidate checker (coerenza/domanda.ts, docs/coerenza.md «Frozen replay set»): one call
  # of a small fast model per sentence the mention filter flags.
  domanda:
    sistema: "Controlli una frase del narratore di una partita di ruolo contro lo stato del gioco, che è sempre vero. Rispondi soltanto con il JSON richiesto."
    messaggio: "Stato del gioco adesso:\n{vero}\n\nFrase precedente: «{prima}»\nFrase da controllare: «{frase}»\n\nDomanda: {domanda}\nRispondi «si» se la frase da controllare lo fa, anche con un pronome o senza nominarlo; «no» se descrive soltanto un corpo, uno stato, un'assenza, un ricordo o un luogo, o se parla di qualcun altro."
    chi: "nella frase da controllare, {nome} ({stato}) agisce, parla, percepisce o viene detto presente adesso?"
    assente: "non è in questa scena"
    nome: "nella frase da controllare, un «{parola}» agisce, parla, viene colpito o viene detto presente adesso? Nessuno in scena e in gioco è «{parola}»{caduti}."
    caduti: " ({elenco})"
    colpo: "il Motore dice che {chi} colpisce {bersaglio} e lo ferisce. La frase da controllare racconta quel colpo come mancato, parato o senza effetto?"
    oppure: " Oppure: "
    esce: "nella frase da controllare, {nome} lascia la scena adesso (se ne va, si allontana fuori dalla vista, torna altrove)?"
