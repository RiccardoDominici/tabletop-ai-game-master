# Frasi fisse dei dadi e delle regole in italiano (docs/lingue.md, docs/prove.md): la lingua di riferimento.
# Carte (proiettore, telefono), righe di fatto e regole per il narratore, messaggi agli arbitri, risposte di
# «Chiedi una regola». Chiavi «prove.…» (prove/*) e «regole.…» (regole/*), segnaposto {nome}.
# Ogni altra lingua (lingue/<codice>/testi-prove.yaml) ha esattamente queste chiavi, con gli stessi segnaposto.
# I nomi (abilità, condizioni, armature…) e le parole chiave stanno in prove.yaml.

prove:
  # Etichette delle carte.
  etichetta:
    abilita: "{abilita} ({caratteristica})"
    caratteristica: "Prova di {caratteristica}"
    salvezza: "Tiro salvezza su {caratteristica}"
  # Come sta un personaggio dopo un colpo (dei PNG il narratore sente solo le parole, mai i numeri).
  salute:
    a_terra: "è A TERRA (0 punti ferita): fuori combattimento"
    illeso: "non ha ferite"
    regge: "è ferito ma regge"
    grave: "è ferito gravemente"
    pg_a_terra: "è A TERRA (0 punti ferita): privo di sensi"
    pg: "ha {attuali} punti ferita su {massimi}"
    set_a_terra: "è A TERRA (0 {danni}): {a_zero}"
    set: "ha {attuali} {danni} su {massimi}"
  danno:
    uno: "{n} danno"
    molti: "{n} danni"
    uno_tipo: "{n} danno {tipo}"
    molti_tipo: "{n} danni {tipo}"
  vantaggio:
    con: " (con {vantaggio})"
    con_motivo: " (con {vantaggio}: {motivo})"
  # «17 contro CD 15».
  confronto: "{totale} contro {contro} {valore}"
  esito:
    riuscita: "RIUSCITA"
    fallita: "FALLITA"
    riuscito: "RIUSCITO"
    fallito: "FALLITO"
    colpito: "COLPITO"
    mancato: "MANCATO"
    vince: "VINCE"
    perde: "PERDE"
    pari: "PARI: nessuno prevale, la situazione resta com’era"
  # Righe di fatto per il narratore: l'esito è già deciso, ne racconta la conseguenza.
  fatto:
    tramortito: " {nome} è tramortito, non morto."
    # A missile that misses into a melee (Basic Fantasy p. 55): the Game Master rolls it at an engaged ally.
    nella_mischia: " Il colpo finisce nella mischia, verso {nome}: {dettagli}"
    attacco: "attacco con {arma}{verso}{vantaggio}: {confronto}{naturale} → {esito}{critico}{danno}{stato}."
    verso_attacco: " a {bersaglio}"
    uno_naturale: " (1 naturale)"
    critico: " (colpo critico)"
    danno: ", {danno}"
    stato: "; {bersaglio} {salute}"
    salvezza: "{etichetta}{vantaggio}: {confronto} → {esito}."
    contrapposta: "{etichetta} contro {etichetta_avversario} di {avversario}{vantaggio}: {totale} contro {totale_avversario} → {esito}."
    contrapposta_passiva: "{etichetta}{contro}{vantaggio}: {confronto} → {esito}."
    contro: " contro {descrizione}"
    prova: "{etichetta}{verso}{vantaggio}: {confronto} → {esito}."
    verso_prova: " verso {bersaglio}"
    nessun_tiro: "nessun tiro: l’azione riesce se è possibile."
    senza_scheda: "servirebbe un tiro, ma manca la scheda: nessun tiro, risolvi con un «sì, ma»."
    senza_arbitro: "nessun tiro deciso (arbitro non disponibile): un’azione possibile riesce, una rischiosa riesce con un prezzo."
    impossibile: "impossibile così, nessun tiro{motivo}: non riesce come scritta; dillo dentro la finzione, con un «sì, ma» se c'è una strada vicina."
    impossibile_motivo: " ({motivo})"
    aiuta: "aiuta {aiutato}: nessun tiro, l'altro ha vantaggio."
    aiuta_niente: "aiuta, ma non c’è un’azione da aiutare in questo turno: nessun tiro."
    gia_a_terra: "{nome} è già a terra, fuori combattimento: nessun tiro. Non parla e non agisce più: un colpo lo raggiunge senza resistenza, una domanda resta senza risposta."
    fuggito: "{nome} ha preso la fuga e non è più qui: nessun tiro, l’azione va a vuoto."
    png_manca: "{nome} manca {bersaglio} (raccontalo in una frase sua)."
    png_colpisce: "{nome} colpisce {bersaglio}: {danni}{a_terra} (raccontalo in una frase sua)."
    png_a_terra: ", e {bersaglio} va a terra"
    il_bersaglio: "il bersaglio"
    qualcuno: "qualcuno"
    privata: " (azione PRIVATA: l’esito solo in una riga [privato {autore}], mai nelle righe al tavolo, che non la nominano)"
    a_terra_autore: "è a terra, privo di sensi: non può agire finché qualcuno non lo cura."
    non_agisce: "(non agisce, {stato} Ciò che il giocatore ha scritto non succede: non raccontarlo.)"
    morto_autore: "è morto."
    a_terra_set: "è a terra: {a_zero}"
    perde_turno: "è {condizione}: perde il turno, nessun tiro."
    fallisce_da_solo: " Fallisce da solo: è {condizione}."
    prezzo: " Prezzo del fallimento: {prezzo}."
    non_ottiene: " Ciò che voleva NON succede («{cosa}»): non raccontarlo come riuscito, e nessuna battuta lo dà lo stesso."
    non_ottiene_privata: " Ciò che voleva NON succede: dillo SOLO nella riga [privato {autore}], senza ripetere al tavolo che cosa ha tentato."
    essenziale: " Ciò che cercava è essenziale: lo trova comunque, ma con un prezzo."
    trova_indizio: " Trova ciò che cercava (indizio {indizio})."
    non_trova: " Non trova ciò che cercava, per ora."
    attacco_senza_scheda: "attacca {bersaglio}, ma il bersaglio non ha una scheda: nessun tiro, risolvi con un «sì, ma»."
    attacco_senza_bersaglio: "attacca, ma qui non c'è una creatura con le sue statistiche da colpire: nessun tiro. Se mira a una creatura che la scena non ha, non inventarla: non c'è."
    reazione: "Poi {nome} reagisce. {frase} Dettagli: {dettagli}"
    scambio: " Scambio: {frase} Dettagli: {dettagli}"
    # Set di regole non SRD (prove/risolutore-regole.ts).
    prova_set: "{regola}{vantaggio}: {valore} → {esito}."
    aggiustamento: " (aggiustamento {n})."
    fallimento_grave: " Fallimento grave: {nome}."
    esito_mossa: " Esito della mossa «{mossa}»: {esito}"
    armatura: " (armatura −{armatura})"
    danno_set: "{danno}{armatura}; {nome} {stato}"
    solo_effetti: "nessun danno, conta l'effetto del colpo; {nome} {stato}"
    attacco_automatico: "attacco con {arma} a {bersaglio} ({regola}) → COLPISCE, {danno}."
    attacco_set: "attacco con {arma} a {bersaglio}: {regola} → {esito}."
    attacco_set_colpito: "attacco con {arma} a {bersaglio}: {regola} → {esito}, {danno}."
  # Typed effects (prove/effetti.ts): damage, healing, falls, traps, poison and binding outside an attack.
  effetti:
    dimezzato: " (dimezzati dal tiro salvezza)"
    danno: "{fonte}: {nome} prende {danno}{meta}; {nome} {stato}."
    svegliato: "Il colpo scuote {nome}: non è più {condizione}."
    cura: "{fonte}: {nome} recupera {n} {danni}; {nome} {stato}."
    cura_morto: "{nome} è morto: {fonte} non lo riporta in vita."
    caduta_lieve: "{nome} cade da {altezza}: troppo poco per farsi male."
    fonte_caduta: "{fonte} (caduta da {altezza})"
    regola_attacco: "d20 {bonus} contro CA {ca}: {totale}"
    attacco_mancato: "{fonte} attacca {nome} ({regola}) → MANCA."
    attacco_colpito: "{fonte} attacca {nome} ({regola}) → COLPISCE."
    morte: "{nome} muore: {fonte}."
    stabilizzato: "{fonte}: le ferite di {nome} sono fasciate, è stabile a zero punti ferita; non combatte né lancia incantesimi finché non torna sopra zero."
    non_serve_stabilizzare: "{fonte}: {nome} non sta morendo, non serve."
  # Powers of the set (prove/poteri.ts): spells, items, class actions.
  poteri:
    usa: "{nome} usa {potere}{costo}."
    costo_incantesimo: " (incantesimo di {livello}° livello: gliene restano {restanti} di quel livello per oggi)"
    costo_incantesimo_senza_slot: " (incantesimo di {livello}° livello)"
    costo_oggetto: " (ne restano {restanti})"
    rifiuto_classe: "{nome} non può lanciare {potere}: non è un incantesimo della sua classe. Nessun incantesimo parte, e ciò che voleva non succede."
    rifiuto_non_preparato: "{nome} non ha {potere} tra gli incantesimi preparati per oggi: nessun incantesimo parte, e ciò che voleva non succede."
    rifiuto_senza_slot: "{nome} ha già lanciato tutti gli incantesimi di {livello}° livello di oggi: {potere} non parte, e ciò che voleva non succede. Tornano col riposo."
    rifiuto_oggetto: "{nome} non ha più {potere}: non succede niente."
    pericolo: "{potere} non è una cosa che {nome} può usare: nessun effetto."
    immune: "{potere} non ha effetto su {bersaglio}."
    troppo_forte: "{bersaglio} è troppo potente per {potere}: nessun effetto."
    nessun_bersaglio: "{potere} non trova un bersaglio adatto: non succede niente."
    resiste: "{bersaglio} resiste a {potere} (tiro salvezza riuscito): nessun effetto."
    descrittivo: "Effetto di {potere} su {bersagli}: raccontalo come lo descrive il manuale, il Motore non lo misura."
    senza_munizioni: "{nome} non ha più {risorsa} per {arma}: nessun attacco."
    una_volta: " ({abilita} già usato contro {bersaglio} in questo scontro: attacco normale)"
  # Energy drain (prove/drenaggio.ts, Basic Fantasy pp. 58–59): negative levels.
  drenaggio:
    fatto: "{nome} perde {n} livello di energia ({pf} punti ferita massimi in meno{slot}): ora ha {totale} livelli negativi, che pesano su ogni tiro."
    slot: "; perde un incantesimo al giorno di livello {livelli}"
    morto: "{nome} muore, svuotato della vita."
  # Monsters (regole/bestiario.ts, R4): a special in the monster's step, a weapon that cannot hurt, a resistance.
  mostri:
    usa: "{nome} usa {potere}."
    non_ferisce: "{arma} colpisce {nome} ma non lo ferisce: lo ferisce solo un'arma con una di queste proprietà: {solo}. "
    o: " o "
    resiste_meta: "{nome} resiste al danno da {tipo}: la metà. "
    resiste_immune: "{nome} è immune al danno da {tipo}. "
    esaurito: "{nome} non può più usare {potere} oggi."
    rigenera: "{nome} rigenera {n} punti ferita."
    rigenera_a_terra: "{nome} crolla, ma non è morto: si rigenera, e si rialzerà."
    rigenera_in_piedi: "{nome} si rialza con 1 punto ferita: si è rigenerato."
  # Timed effects (prove/attivi.ts): conditions, bonuses and immunities from powers and hazards.
  attivi:
    per_round: "per {n} round"
    fino_scena: "fino alla fine della scena"
    fino_riposo: "fino al prossimo riposo"
    fino_permanente: "finché il master non lo toglie"
    fino_round: "per un round"
    immune: "Nessun effetto su {nome}: è immune a {cosa}."
    condizione: "{nome} è {condizione} {quanto}."
    bonus: "{nome} ha {valore} {a}{contro} {quanto}."
    a_difesa: "alla Classe d'Armatura"
    a_attacchi: "ai tiri per colpire"
    a_salvezze: "ai tiri salvezza"
    a_danni: "ai danni"
    contro_mischia: " contro la mischia"
    contro_distanza: " contro i tiri a distanza"
    immunita: "{fonte} protegge {nome} {quanto}."
    finiti: "Finiscono: {elenco}."
    finito: "{cosa} di {nome}"
    sempre_colpito: " (colpito comunque: {condizione})"
  # The dying window of a death rule (prove/morte.ts).
  morte:
    inizia: "{nome} ha {n} round: se in quel tempo le sue ferite non vengono fasciate o curate, muore."
    ancora: "{nome} sta morendo: restano {n} round per fasciare o curare le sue ferite."
    morto: "{nome} muore: nessuno ha fasciato le sue ferite in tempo."
    senza_soccorso: "Nessuno è in piedi per fasciare le ferite: chi stava morendo muore."
    incantesimi_persi: "{nome} perde gli incantesimi preparati (è andato a zero punti ferita)."
    subito: "{nome} è a terra fuori da uno scontro: tiro salvezza contro la morte {dado} contro {cd} → {esito}."
  # Saving throws pinned to their own number (regole/salvezze.ts).
  salvezze:
    tiro_salvezza: "tiro salvezza"
  # A power rolled against the author's class table (prove/scacciare.ts): Turn Undead.
  scacciare:
    non_sa: "{nome} non sa usare {potere}: la sua classe non ha la tabella."
    bloccato: "{nome} ha appena fallito {potere}: deve aspettare prima di riprovare."
    tiro: "{nome} usa {potere}: tira {dado} sulla tabella del suo livello e {esito}."
    riesce: "riesce su {n} di loro, dal più debole"
    fallisce: "non riesce su nessuno"
    colpiti: "Dadi vita colpiti: {dadi}; ne subiscono l'effetto {nomi}."
    distrutto: "{nome} si sgretola in polvere."
    attesa: "{potere} è fallito almeno in parte: {nome} non può riprovarci per un po'."
    cella_no: "impossibile al suo livello"
    cella_auto: "riesce da sé"
    etichetta_colpiti: "{potere}: dadi vita colpiti"
    etichetta_danno: "{potere}: danno ai non morti"
  # The Game Master's secret rolls (M9: abilita[].segreta): the card stays on the panel; the narrator tells it as the
  # character perceives it.
  # Reaction rolls of the set's tables (Basic Fantasy pp. 46, 50; prove/motore.ts reazioneDelMaster): the Game Master's.
  reazione:
    chi: "Il master"
    regola: "{dadi}{bonus} = {totale}: {fascia}"
    fatto: "Tiro di reazione del master ({tabella}) per {pg}: {fascia} ({regola}). Racconta la reazione di chi incontrano così."
    fatto_png: "Tiro di reazione del master ({tabella}): {png} verso {pg}, {fascia} ({regola}). Racconta così la sua reazione."
  segreta:
    tiro: "Tiro segreto del master (il giocatore non vede il dado né l'esito): "
    fallita_niente: " {nome} non nota niente: raccontalo come se non ci fosse niente da notare, senza dire che il tiro è fallito."
    fallita_riuscita: " {nome} pensa che sia andata bene: raccontalo così, senza dire che il tiro è fallito; chi doveva non accorgersene se ne accorge, e si vedrà dai fatti."
  # A level gained between sessions (prove/livelli.ts): the hit points rolled at the session's first window.
  livelli:
    etichetta: "Punti ferita del {livello}° livello"
    dado: "{livello}° livello: {dado} {valore}{bonus} = {guadagno}"
    fissi: "{livello}° livello: {guadagno} fissi"
    sale: "{nome} passa al {livello}° livello ({dettagli}): {guadagno} punti ferita in più, {massimi} in tutto."
  # Experience points counted by the Engine (prove/esperienza.ts): the panel's lines, never the narrator's.
  esperienza:
    tesoro: "tesoro portato al sicuro"
    premio_master: "premio del master"
    nessun_tesoro: "Nessun tesoro in attesa di tornare al sicuro."
    quota: "{nome} {px}"
    premio: "PX per {motivo}: {px} in tutto ({quote})."
  # A rest from the Game Master panel (prove/riposo.ts).
  riposo:
    fatto: "Riposo ({riposo}): {elenco}."
    pg: "{nome} recupera {n} {danni} ({attuali} su {massimi})"
    nessuno: "nessuno recupera punti ferita"
    ricarica: "Gli incantesimi e le risorse del riposo tornano."
  # Il perché di un vantaggio o di uno svantaggio, sulla carta.
  motivo:
    annullati: "vantaggio e svantaggio si annullano"
    aiuta: "{nome} aiuta"
    ben_disposto: "{nome} è ben disposto"
    ostile: "{nome} è ostile"
    attaccante: "chi attacca è {condizione}"
    bersaglio: "il bersaglio è {condizione}"
  # Contro che cosa si tira, sulla carta.
  cd:
    influenzare: "influenzare {nome}"
    tiro_di: "tiro di {nome}"
    passiva_di: "{abilita} passiva di {nome}"
    passiva: "{abilita} passiva"
    ca_di: "CA di {nome}"
    difesa_di: "difesa di {nome}"
    colpisce_sempre: "colpisce sempre"
  regola:
    automatico: "Attacco automatico: {arma} {dadi}{armatura}"
    meno_armatura: " meno l’armatura"
    # The set's situational modifiers that apply to an attack (regole.yaml → modificatori), after the roll's rule.
    situazioni: " (compresi: {elenco})"
    condizioni: " (condizioni: {elenco})"
    non_letale: " (per tramortire{malus}, metà danno)"
    a_mani_nude: " (a mani nude, per tramortire)"
    colpisce: "Colpisce"
  # La sezione «Esiti dei tiri» del messaggio del narratore e del selettore.
  esiti:
    titolo: "## Esiti dei tiri (li ha tirati il Motore: sono fatti, raccontali così)"
    titolo_privati: "### Esiti delle azioni PRIVATE (solo nella riga [privato pg_x] di chi l’ha fatta: al tavolo né l’azione né il suo esito)"
    regola: "Ogni esito è già deciso: riuscita, l’azione riesce; fallita o mancato, non riesce, ma la scena cambia (un prezzo, una complicazione, un’informazione). Non cambiare mai un esito, non dire numeri, dadi o CD a voce, non chiedere altri tiri."
  # Il messaggio per l'arbitro (prove/arbitro-haiku.ts, prove/motore.ts).
  arbitro:
    scena: "Scena (parte pubblica):\n{scena}"
    a_distanza: " (a distanza)"
    pg_al_tavolo: "PG al tavolo:"
    armi: " · armi: {armi}"
    mani_nude: "nessuna (mani nude)"
    nessuna_arma: "nessuna"
    gregario: " · gregario, nemico della scena"
    senza_scheda: " · senza scheda"
    a_terra: " · A TERRA"
    morto: " · MORTO"
    png_in_scena: "PNG in scena:"
    verso_i_pg: " · verso i PG: {atteggiamenti}"
    altri_png: "Altri PNG (non in scena): {png}"
    salvezza_su: "tiro salvezza su {caratteristica}"
    nessuno: "(nessuno)"
    nessuna: "(nessuna)"
    riga: "- id {id} · {nome} ({autore}){privata}: «{testo}»"
    privata: " · PRIVATA"
    narrazione: "Ultima narrazione:\n{narrazione}"
    personaggi: "Personaggi:\n{personaggi}"
    prove_scena: "Prove della scena (id · quando · prova):\n{prove}"
    altre: "Altre azioni dei PG in questo turno:\n{azioni}"
    da_giudicare: "Azioni da giudicare:\n{azioni}"
    domanda: "Per ogni azione da giudicare: serve un tiro, e quale?"
  # L'arbitro minimo (prove/arbitro-minimo.ts): il prompt di sistema è prompts/<lingua>/arbitro-minimo.md.
  minimo:
    messaggio: "Azione di {nome}: «{testo}»\nAbilità possibili: {abilita}"
  # L'arbitro di un set di regole non SRD (prove/arbitro-regole.ts): il prompt di sistema, a pezzi.
  arbitro_regole:
    intro: "Sei l'arbitro delle prove di una partita di gioco di ruolo dal vivo, in italiano, con le regole del manuale «{nome}». I giocatori scrivono cosa fanno i loro personaggi (PG). Per ogni azione decidi se serve un tiro e quale, con il vocabolario di questo manuale. Non narri e non tiri i dadi: lo fa il programma. Rispondi solo con il JSON richiesto."
    regola_oro: "Regola d'oro: si tira solo quando l'esito è incerto E il fallimento conta. Azioni banali o sicure (parlare, chiedere, guardarsi intorno, camminare): «nessuna». Ciò che non può riuscire come scritto: «impossibile», con il motivo in una frase. Un PG che aiuta l'azione di un altro: «aiuto», con l'id di quell'azione in «aiuta». Colpire una creatura: «attacco», con bersaglio e arma della scheda. Tutto il resto che è incerto e rischioso: «prova»."
    mosse: "Mosse del manuale: se l'azione è una di queste, metti il suo id in «mossa» (la statistica la sa il programma):\n{mosse}"
    poteri: "Poteri del manuale (incantesimi, oggetti, azioni di classe): se l'azione ne usa uno, «potere» con il suo id in «potere» e il bersaglio se l'azione lo nomina (quanti ne restano e che cosa fanno lo sa il programma):\n{poteri}"
    prova: "Per una «prova» senza mossa scegli l'abilità o, se nessuna va bene, la caratteristica.\n- Caratteristiche: {caratteristiche}\n- Abilità: {abilita}\n- Difficoltà: {difficolta} (nel dubbio {predefinita})"
    sociale: "Prove sociali nel manuale: {nota}"
    vantaggio: "Vantaggio o svantaggio: solo per una circostanza chiara scritta nell'azione o nella narrazione; «motivo» in poche parole, senza segreti. Altrimenti «nessuno» e motivo vuoto."
    senza_vantaggio: "Il manuale non ha vantaggio o svantaggio: «nessuno»."
    reazione: "Reazione: se l'azione scatena l'attacco di un PNG ostile contro chi la fa, il PNG in reazione_png e «sempre» o «se_fallisce» in reazione_quando; altrimenti vuoto e «nessuna»."
    riassunto: "Riassunto delle regole:\n{riassunto}"
    finale: "Usa solo id degli elenchi. Un campo che non serve è una stringa vuota."
    passi: "Passi del manuale pertinenti:\n{passi}\n\n"
  # Lo scontro (prove/combattimento.ts): righe di fatto e situazione per il narratore.
  combattimento:
    inizia: "Inizia il combattimento. {ordine}"
    iniziativa: "Iniziativa: {ordine}."
    # Said at the table by the Engine when the order is rolled (start of the fight, a new round): names only.
    ordine_tavolo: "Ordine del round: {ordine}."
    iniziativa_schieramento: "Iniziativa per schieramento: PG {pg}, PNG {png}; {primo}."
    agiscono_prima_pg: "agiscono prima i PG"
    agiscono_prima_png: "agiscono prima i PNG"
    senza_iniziativa: "Senza iniziativa: si agisce seguendo la storia."
    finisce: "{nome}: {condizioni} finisce."
    round: "Round {round}: iniziativa PG {pg}, PNG {png}; {primo}."
    round_individuale: "Round {round}, iniziativa ritirata: {ordine}."
    prima_pg: "prima i PG"
    prima_png: "prima i PNG"
    png_non_agisce: "Turno di {nome}: è {condizione}, non agisce."
    turno_png: "Turno di {nome}: {frase} Dettagli: {dettagli}"
    # A monster with several attacks a round (per_round, regole/bestiario.ts): one fact per attack, numbered.
    turno_png_piu: "Turno di {nome}, attacco {n} di {di}: {frase} Dettagli: {dettagli}"
