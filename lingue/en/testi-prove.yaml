# Fixed phrases of the dice and of the rules in English (docs/lingue.md, docs/prove.md). Same keys and the same
# {placeholders} as lingue/it/testi-prove.yaml (the reference). Cards (projector, phone), fact lines and rules for
# the narrator, messages to the arbiters, answers of «Ask a rule». The names (skills, conditions, armor…) and the
# keywords are in prove.yaml. The outcome words in capitals (SUCCESS, HIT…) are the ones the narrator prompt uses.

prove:
  etichetta:
    abilita: "{abilita} ({caratteristica})"
    caratteristica: "{caratteristica} check"
    salvezza: "{caratteristica} saving throw"
  salute:
    a_terra: "is DOWN (0 hit points): out of the fight"
    regge: "is wounded but holding on"
    grave: "is badly wounded"
    pg_a_terra: "is DOWN (0 hit points): unconscious"
    pg: "has {attuali} of {massimi} hit points"
    set_a_terra: "is DOWN (0 {danni}): {a_zero}"
    set: "has {attuali} of {massimi} {danni}"
  danno:
    uno: "{n} damage"
    molti: "{n} damage"
    uno_tipo: "{n} {tipo} damage"
    molti_tipo: "{n} {tipo} damage"
  vantaggio:
    con: " (with {vantaggio})"
    con_motivo: " (with {vantaggio}: {motivo})"
  confronto: "{totale} against {contro} {valore}"
  esito:
    riuscita: "SUCCESS"
    fallita: "FAILURE"
    riuscito: "SUCCESS"
    fallito: "FAILURE"
    colpito: "HIT"
    mancato: "MISS"
    vince: "WINS"
    perde: "LOSES"
    pari: "TIE: nobody prevails, the situation stays as it was"
  fatto:
    attacco: "attack with {arma}{verso}{vantaggio}: {confronto}{naturale} → {esito}{critico}{danno}{stato}."
    verso_attacco: " on {bersaglio}"
    uno_naturale: " (natural 1)"
    critico: " (critical hit)"
    danno: ", {danno}"
    stato: "; {bersaglio} {salute}"
    salvezza: "{etichetta}{vantaggio}: {confronto} → {esito}."
    contrapposta: "{etichetta} against {avversario}'s {etichetta_avversario}{vantaggio}: {totale} against {totale_avversario} → {esito}."
    contrapposta_passiva: "{etichetta}{contro}{vantaggio}: {confronto} → {esito}."
    contro: " against {descrizione}"
    prova: "{etichetta}{verso}{vantaggio}: {confronto} → {esito}."
    verso_prova: " toward {bersaglio}"
    nessun_tiro: "no roll: the action succeeds if it is possible."
    senza_scheda: "a roll would be needed, but the sheet is missing: no roll, resolve it with a “yes, but”."
    senza_arbitro: "no roll decided (arbiter unavailable): a possible action succeeds, a risky one succeeds at a price."
    impossibile: "impossible like this, no roll{motivo}: it does not succeed as written; say so within the fiction, with a “yes, but” if there is a nearby path."
    impossibile_motivo: " ({motivo})"
    aiuta: "helps {aiutato}: no roll, the other has advantage."
    aiuta_niente: "helps, but there is no action to help this turn: no roll."
    gia_a_terra: "{nome} is already down, out of the fight: no roll. They no longer speak or act: a blow lands unopposed, a question gets no answer."
    fuggito: "{nome} has fled and is no longer here: no roll, the action finds nobody."
    png_manca: "{nome} misses {bersaglio} (tell it in a sentence of its own)."
    png_colpisce: "{nome} hits {bersaglio}: {danni}{a_terra} (tell it in a sentence of its own)."
    png_a_terra: ", and {bersaglio} goes down"
    il_bersaglio: "the target"
    qualcuno: "someone"
    privata: " (PRIVATE action: the outcome only in a [privato {autore}] line, never in the lines at the table, which do not mention it)"
    a_terra_autore: "is down, unconscious: cannot act until someone heals them."
    non_agisce: "(does not act, {stato} What the player wrote does not happen: do not narrate it.)"
    morto_autore: "is dead."
    a_terra_set: "is down: {a_zero}"
    perde_turno: "is {condizione}: loses the turn, no roll."
    fallisce_da_solo: " It fails automatically: the character is {condizione}."
    prezzo: " Price of failure: {prezzo}."
    non_ottiene: " What they wanted does NOT happen («{cosa}»): do not tell it as a success, and no line grants it anyway."
    non_ottiene_privata: " What they wanted does NOT happen: say it ONLY in the [privato {autore}] line, without repeating at the table what they tried."
    essenziale: " What they were looking for is essential: they find it anyway, but at a price."
    trova_indizio: " They find what they were looking for (clue {indizio})."
    non_trova: " They do not find what they were looking for, for now."
    attacco_senza_scheda: "attacks {bersaglio}, but the target has no sheet: no roll, resolve it with a “yes, but”."
    attacco_senza_bersaglio: "attacks, but there is no creature with stats here to hit: no roll. If it aims at a creature the scene does not have, do not invent one: it is not there."
    reazione: "Then {nome} reacts. {frase} Details: {dettagli}"
    scambio: " Exchange: {frase} Details: {dettagli}"
    prova_set: "{regola}{vantaggio}: {valore} → {esito}."
    aggiustamento: " (adjustment {n})."
    fallimento_grave: " A bad failure: {nome}."
    esito_mossa: " Outcome of the move “{mossa}”: {esito}"
    armatura: " (armor −{armatura})"
    danno_set: "{danno}{armatura}; {nome} {stato}"
    attacco_automatico: "attack with {arma} on {bersaglio} ({regola}) → HITS, {danno}."
    attacco_set: "attack with {arma} on {bersaglio}: {regola} → {esito}."
    attacco_set_colpito: "attack with {arma} on {bersaglio}: {regola} → {esito}, {danno}."
  # Typed effects (prove/effetti.ts): damage, healing, falls, traps, poison and binding outside an attack.
  effetti:
    dimezzato: " (halved by the saving throw)"
    danno: "{fonte}: {nome} takes {danno}{meta}; {nome} {stato}."
    svegliato: "The blow jolts {nome}: no longer {condizione}."
    cura: "{fonte}: {nome} recovers {n} {danni}; {nome} {stato}."
    cura_morto: "{nome} is dead: {fonte} does not bring them back."
    caduta_lieve: "{nome} falls {altezza}: too little to get hurt."
    fonte_caduta: "{fonte} (a fall of {altezza})"
    regola_attacco: "d20 {bonus} against AC {ca}: {totale}"
    attacco_mancato: "{fonte} attacks {nome} ({regola}) → MISSES."
    attacco_colpito: "{fonte} attacks {nome} ({regola}) → HITS."
    morte: "{nome} dies: {fonte}."
    stabilizzato: "{fonte}: {nome} is bandaged and stable at zero hit points; no fighting or spellcasting until above zero."
    non_serve_stabilizzare: "{fonte}: {nome} is not dying, there is no need."
  # Powers of the set (prove/poteri.ts): spells, items, class actions.
  poteri:
    usa: "{nome} uses {potere}{costo}."
    costo_incantesimo: " (a level {livello} spell: {restanti} of that level left for today)"
    costo_incantesimo_senza_slot: " (a level {livello} spell)"
    costo_oggetto: " ({restanti} left)"
    rifiuto_classe: "{nome} cannot cast {potere}: it is not a spell of their class. No spell goes off, and what they wanted does not happen."
    rifiuto_non_preparato: "{nome} does not have {potere} among today's prepared spells: no spell goes off, and what they wanted does not happen."
    rifiuto_senza_slot: "{nome} has already cast every level {livello} spell of today: {potere} does not go off, and what they wanted does not happen. They come back with rest."
    rifiuto_oggetto: "{nome} has no {potere} left: nothing happens."
    pericolo: "{potere} is not something {nome} can use: no effect."
    immune: "{potere} has no effect on {bersaglio}."
    troppo_forte: "{bersaglio} is too powerful for {potere}: not affected."
    nessun_bersaglio: "{potere} finds no fitting target: nothing happens."
    resiste: "{bersaglio} resists {potere} (saving throw made): no effect."
    descrittivo: "Effect of {potere} on {bersagli}: tell it as the manual describes it, the Engine does not measure it."
    senza_munizioni: "{nome} has no {risorsa} left for {arma}: no attack."
    una_volta: " ({abilita} already used against {bersaglio} in this fight: an ordinary attack)"
  # Timed effects (prove/attivi.ts): conditions, bonuses and immunities from powers and hazards.
  attivi:
    per_round: "for {n} rounds"
    fino_scena: "until the end of the scene"
    fino_riposo: "until the next rest"
    fino_permanente: "until the Game Master removes it"
    fino_round: "for one round"
    immune: "{nome} is not affected: immune to {cosa}."
    condizione: "{nome} is {condizione} {quanto}."
    bonus: "{nome} has {valore} {a}{contro} {quanto}."
    a_difesa: "to Armor Class"
    a_attacchi: "to attack rolls"
    a_salvezze: "to saving throws"
    a_danni: "to damage"
    contro_mischia: " against melee"
    contro_distanza: " against missiles"
    immunita: "{nome} is protected by {fonte} {quanto}."
    finiti: "Ending: {elenco}."
    finito: "{cosa} of {nome}"
    sempre_colpito: " (hit anyway: {condizione})"
  # The dying window of a death rule (prove/morte.ts).
  morte:
    inizia: "{nome} has {n} rounds: unless their wounds are bound or healed in that time, they die."
    ancora: "{nome} is dying: {n} rounds left to bind or heal their wounds."
    morto: "{nome} dies: nobody bound their wounds in time."
    senza_soccorso: "Nobody is standing to bind the wounds: whoever was dying dies."
    incantesimi_persi: "{nome} loses their prepared spells (they went down to zero hit points)."
    subito: "{nome} is down outside a fight: saving throw against death {dado} against {cd} → {esito}."
  # Saving throws pinned to their own number (regole/salvezze.ts).
  salvezze:
    tiro_salvezza: "saving throw"
  # A power rolled against the author's class table (prove/scacciare.ts): Turn Undead.
  scacciare:
    non_sa: "{nome} cannot use {potere}: their class has no table for it."
    bloccato: "{nome} has just failed {potere}: they must wait before trying again."
    tiro: "{nome} uses {potere}: rolls {dado} on their level's table and {esito}."
    riesce: "it works on {n} of them, weakest first"
    fallisce: "it works on none"
    colpiti: "Hit dice affected: {dadi}; affected: {nomi}."
    distrutto: "{nome} crumbles to dust."
    attesa: "{potere} failed at least in part: {nome} cannot try again for a while."
    cella_no: "impossible at their level"
    cella_auto: "works by itself"
    etichetta_colpiti: "{potere}: hit dice affected"
    etichetta_danno: "{potere}: damage to the undead"
  # The Game Master's secret rolls (M9: abilita[].segreta): the card stays on the panel; the narrator tells it as the
  # character perceives it.
  segreta:
    tiro: "The Game Master's secret roll (the player sees neither the die nor the outcome): "
    fallita_niente: " {nome} notices nothing: tell it as if there were nothing to notice, without saying the roll failed."
    fallita_riuscita: " {nome} believes it went well: tell it that way, without saying the roll failed; whoever should not have noticed did, and it will show in what happens."
  # A level gained between sessions (prove/livelli.ts): the hit points rolled at the session's first window.
  livelli:
    etichetta: "Hit points of level {livello}"
    dado: "level {livello}: {dado} {valore}{bonus} = {guadagno}"
    fissi: "level {livello}: {guadagno} fixed"
    sale: "{nome} reaches level {livello} ({dettagli}): {guadagno} more hit points, {massimi} in all."
  # Experience points counted by the Engine (prove/esperienza.ts): the panel's lines, never the narrator's.
  esperienza:
    tesoro: "treasure brought back to safety"
    premio_master: "the Game Master's award"
    nessun_tesoro: "No treasure is waiting to be brought back to safety."
    quota: "{nome} {px}"
    premio: "XP for {motivo}: {px} in all ({quote})."
  # A rest from the Game Master panel (prove/riposo.ts).
  riposo:
    fatto: "Rest ({riposo}): {elenco}."
    pg: "{nome} recovers {n} {danni} ({attuali} of {massimi})"
    nessuno: "nobody recovers hit points"
    ricarica: "Spells and the resources rest gives back return."
  motivo:
    annullati: "advantage and disadvantage cancel out"
    aiuta: "{nome} helps"
    ben_disposto: "{nome} is well disposed"
    ostile: "{nome} is hostile"
    attaccante: "the attacker is {condizione}"
    bersaglio: "the target is {condizione}"
  cd:
    influenzare: "influence {nome}"
    tiro_di: "{nome}'s roll"
    passiva_di: "{nome}'s passive {abilita}"
    passiva: "passive {abilita}"
    ca_di: "{nome}'s AC"
    difesa_di: "{nome}'s defense"
    colpisce_sempre: "always hits"
  regola:
    automatico: "Automatic attack: {arma} {dadi}{armatura}"
    # The set's situational modifiers that apply to an attack (regole.yaml → modificatori), after the roll's rule.
    situazioni: " (including: {elenco})"
    meno_armatura: " minus armor"
    colpisce: "Hits"
  esiti:
    titolo: "## Roll outcomes (the Engine rolled them: they are facts, tell them as they are)"
    titolo_privati: "### Outcomes of PRIVATE actions (only in the [privato pg_x] line of whoever made it: neither the action nor its outcome at the table)"
    regola: "Every outcome is already decided: success, the action succeeds; failure or miss, it does not succeed, but the scene changes (a price, a complication, a piece of information). Never change an outcome, never say numbers, dice or DC aloud, never ask for other rolls."
  arbitro:
    scena: "Scene (public part):\n{scena}"
    a_distanza: " (ranged)"
    pg_al_tavolo: "PCs at the table:"
    armi: " · weapons: {armi}"
    mani_nude: "none (bare hands)"
    nessuna_arma: "none"
    gregario: " · minion, an enemy of the scene"
    senza_scheda: " · no sheet"
    a_terra: " · DOWN"
    morto: " · DEAD"
    png_in_scena: "NPCs on stage:"
    verso_i_pg: " · toward the PCs: {atteggiamenti}"
    altri_png: "Other NPCs (not on stage): {png}"
    salvezza_su: "{caratteristica} saving throw"
    nessuno: "(none)"
    nessuna: "(none)"
    riga: "- id {id} · {nome} ({autore}){privata}: “{testo}”"
    privata: " · PRIVATE"
    narrazione: "Last narration:\n{narrazione}"
    personaggi: "Characters:\n{personaggi}"
    prove_scena: "Scene checks (id · when · check):\n{prove}"
    altre: "Other PC actions in this turn:\n{azioni}"
    da_giudicare: "Actions to judge:\n{azioni}"
    domanda: "For each action to judge: is a roll needed, and which one?"
  minimo:
    messaggio: "Action by {nome}: “{testo}”\nPossible skills: {abilita}"
  arbitro_regole:
    intro: "You are the check arbiter of a live tabletop role-playing game, in English, with the rules of the rulebook “{nome}”. The players write what their characters (PCs) do. For each action decide whether a roll is needed and which one, with the vocabulary of this rulebook. You do not narrate and you do not roll the dice: the program does. Reply only with the requested JSON."
    regola_oro: "Golden rule: roll only when the outcome is uncertain AND failure matters. Trivial or safe actions (talking, asking, looking around, walking): \"nessuna\". What cannot succeed as written: \"impossibile\", with the reason in one sentence. A PC helping another's action: \"aiuto\", with the id of that action in \"aiuta\". Striking a creature: \"attacco\", with target and weapon from the sheet. Everything else that is uncertain and risky: \"prova\"."
    mosse: "Rulebook moves: if the action is one of these, put its id in \"mossa\" (the program knows the stat):\n{mosse}"
    poteri: "Powers of the rulebook (spells, items, class actions): if the action uses one, \"potere\" with its id in \"potere\" and the target if the action names one (the program knows how many are left and what they do):\n{poteri}"
    prova: "For a \"prova\" without a move choose the skill or, if none fits, the ability.\n- Abilities: {caratteristiche}\n- Skills: {abilita}\n- Difficulties: {difficolta} (when in doubt {predefinita})"
    sociale: "Social checks in the rulebook: {nota}"
    vantaggio: "Advantage or disadvantage: only for a clear circumstance written in the action or in the narration; \"motivo\" in a few words, in English, no secrets. Otherwise \"nessuno\" and an empty motivo."
    senza_vantaggio: "The rulebook has no advantage or disadvantage: \"nessuno\"."
    reazione: "Reaction: if the action triggers the attack of a hostile NPC against whoever does it, the NPC in reazione_png and \"sempre\" (always) or \"se_fallisce\" (if it fails) in reazione_quando; otherwise empty and \"nessuna\"."
    riassunto: "Summary of the rules:\n{riassunto}"
    finale: "Use only ids from the lists. A field that is not needed is an empty string."
    passi: "Relevant rulebook passages:\n{passi}\n\n"
  combattimento:
    inizia: "The fight begins. {ordine}"
    iniziativa: "Initiative: {ordine}."
    # Said at the table by the Engine when the order is rolled (start of the fight, a new round): names only.
    ordine_tavolo: "Turn order this round: {ordine}."
    iniziativa_schieramento: "Initiative by side: PCs {pg}, NPCs {png}; {primo}."
    agiscono_prima_pg: "the PCs act first"
    agiscono_prima_png: "the NPCs act first"
    senza_iniziativa: "No initiative: everyone acts following the story."
    finisce: "{nome}: {condizioni} ends."
    round: "Round {round}: initiative PCs {pg}, NPCs {png}; {primo}."
    round_individuale: "Round {round}, initiative rolled again: {ordine}."
    prima_pg: "PCs first"
    prima_png: "NPCs first"
    png_non_agisce: "{nome}'s turn: is {condizione}, does not act."
    turno_png: "{nome}'s turn: {frase} Details: {dettagli}"
    # Simultaneous ties (combattimento.iniziativa.pari: simultanei): the NPC strikes at the same moment it is dropped.
    turno_png_insieme: "{nome}'s turn, at the same moment they fall (tied initiative): {frase} Details: {dettagli}"
    morte_venti: "natural twenty: regains consciousness with 1 hit point"
    morte_senza_soccorso: "Nobody is standing to help them: the death saves decide now."
    morte_morto: "failures {n} of {n}: DEAD"
    morte_stabile: "successes {n} of {n}: stable, still unconscious"
    morte_finestra: "made: alive, unconscious, and dying"
    morte_parziale: "{esito} (successes {successi}, failures {fallimenti})"
    morte_riuscito: "success"
    morte_fallito: "failure"
    tiro_morte: "{nome} is down: death saving throw {dado} against DC {cd} → {esito}."
    salta_turno: "{nome} is {condizione}: skips the turn."
    etichetta_morte: "Death saving throw"
    sorpresi: "Surprise: {chi} roll {valore} on 1d{dado} and are surprised ({condizione}): they lose the first round."
    non_sorpresi: "Surprise: {chi} roll {valore} on 1d{dado}: they are not surprised."
    sorpresi_alcuni: "Surprise: {chi} roll {valore} on 1d{dado}: {nomi} surprised ({condizione}), losing the first round; the others are not."
    lato_pg: "the characters"
    lato_png: "the enemies"
    morale_cedono: "Enemy morale: {tiro} against {morale} → they BREAK and flee ({nomi})."
    morale_tengono: "Enemy morale: {tiro} against {morale} → they hold."
    fine_fuggiti: "the enemies fled or are out of the fight"
    fine_nemici: "the enemies are down"
    fine_pg: "the PCs are all down"
    finito: "The fight is over: {motivo}."
    fine: "end"
    motivo_master: "the Game Master ends it"
    intestazione: "Fight, round {round}{fase}.{ordine}{tocca} Tell the facts in order; do not invent attacks, damage or deaths that are not in the facts."
    intestazione_senza: "Fight in progress (no initiative: everyone acts following the story). NPCs hit only as the facts say."
    intestazione_fase: ", phase “{fase}”"
    intestazione_ordine: " Order: {ordine}."
    intestazione_tocca: " Now it is the turn of: {chi}: close by inviting only {pronome}, it is their turn."
    loro: "them"
    lui_o_lei: "him or her"
  # Manual rolls (docs/prove.md §8, scena/tiri-giocatori.ts): what the narrator says when a player must roll real dice.
  # Never the DC. {nome} is the PC's first name.
  richiesta:
    abilita: "{nome}, make a {abilita} check{vantaggio}."
    attacco: "{nome}, roll to hit: {cosa}{vantaggio}."
    altro: "{nome}, roll: {cosa}{vantaggio}."
    con_vantaggio: ", with advantage"
    con_svantaggio: ", with disadvantage"
    # Follow-ups (docs/prove.md §8): the damage of a hit, initiative, a death save. Labels on the phone's roll card.
    danno: "{nome}, roll damage."
    iniziativa: "{nome}, roll initiative."
    morte: "{nome}, roll your death saving throw."
    etichetta_danno: "Damage: {arma}"
    etichetta_iniziativa: "Initiative"
  # A check the Game Master asked from the panel (scena/tiri-giocatori.ts): the pseudo-action's text, read by the
  # narrator in the fact.
  master:
    nome: "The Game Master"
    voce: "The Game Master rolls the dice."
    azione: "check asked by the Game Master: {cosa}{motivo}"
    motivo: ", to {motivo}"
  # NPCs in the scene out of play (scena/regia.ts, righeFuoriGioco): in the narrator's and selector's message.
  fuori:
    titolo: "## NPCs out of play (the Engine says so: they do not speak or act, no lines or [png_…] lines for them)"
    a_terra: "{nome} lies unconscious on the ground: does not speak or act."
    morto: "{nome} is no longer alive: does not speak or act."
    fuggito: "{nome} has fled and is no longer here: does not speak or act."
  # Short Engine lines for a combat fact the narration left out (prove/fatti-dovuti.ts).
  dovuti:
    colpito: "{nome} takes the blow."
    a_terra: "{nome} falls to the ground."
    morente: "{nome} lies on the ground, between life and death."
    stabile: "{nome} is still breathing, but does not move."
    rialzato: "{nome}'s eyes open again."
    morto: "{nome} dies."
    fuggito: "{nome} flees."
    buio: "{nome}'s light gutters out."
  # Engine lines that replace a narrator sentence contradicting the cards (narrazione/guardia-esiti.ts).
  guardia:
    manca: "{chi} misses {bersaglio}."
    colpisce: "{chi} hits {bersaglio}."
    regge: "{nome} takes the blow but stays on their feet."
    in_piedi: "{nome} is still on their feet."
    nessuno_cade: "Nobody falls: the fight goes on."
    # A character out of play since before the turn does something in the narration (narrazione/guardia-fuori.ts).
    fuori_a_terra: "{nome} lies on the ground, unconscious."
    fuori_morto: "{nome} lies on the ground, lifeless."
    fuori_fuggito: "{nome} is no longer here."
    # In play but losing the round (surprise…): the line instead of a sentence where it acts (narrazione/guardia-fuori.ts).
    fermo: "{nome} loses this round ({condizione}): no action."
  # Gear from the set's catalog (regole/equipaggiamento.ts, prove/inventario.ts; docs/regole.md §2, «Catalogo»).
  equipaggiamento:
    senza_armatura: "no armor"
    a_due_mani: "{nome}, two-handed"
    lanciato: "{nome} (thrown)"
    gittata: " ({fascia}{bonus}{distanza})"
    gittata_predefinita: " ({fascia}{bonus}: no distance said)"
    fuori_gittata: "{nome} cannot shoot {arma} at {distanza} {unita}: it reaches {massimo} {unita}."
    ricarica: "{nome} is still reloading {arma} (one shot every {n} rounds): no attack."
    abilita_bloccata: "{nome} cannot use {abilita} wearing {cosa}: no roll."
    speciale_bloccato: " ({abilita} blocked by {cosa}: an ordinary attack)"
    penalita_arma: " (with the {valore} penalty: {arma} is not a weapon for that class or race)"
    perde_incantesimi: " {nome} used a weapon their faith forbids ({arma}): today's spells are lost."
    incantesimo_vietato: "{nome} cannot cast {potere} wearing {cosa}: nothing is spent."
    incantesimo_perso: "{nome} tries to cast {potere} wearing {cosa}: the spell fails and is lost."
