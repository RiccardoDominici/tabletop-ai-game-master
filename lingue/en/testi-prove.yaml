# Fixed phrases of the dice and of the rules in English (docs/lingue.md, docs/prove.md). Same keys and the same
# {placeholders} as lingue/it/testi-prove.yaml (the reference). Cards (projector, phone), fact lines and rules for
# the narrator, messages to the arbiters, answers of «Ask a rule». The names (skills, conditions, armor…) and the
# keywords are in prove.yaml. The outcome words in capitals (SUCCESS, HIT…) are the ones the narrator prompt uses.

prove:
  etichetta:
    abilita: "{abilita} ({caratteristica})"
    caratteristica: "{caratteristica} check"
    salvezza: "{caratteristica} saving throw"
  salute:
    a_terra: "is DOWN (0 hit points): out of the fight"
    regge: "is wounded but holding on"
    grave: "is badly wounded"
    pg_a_terra: "is DOWN (0 hit points): unconscious"
    pg: "has {attuali} of {massimi} hit points"
    set_a_terra: "is DOWN (0 {danni}): {a_zero}"
    set: "has {attuali} of {massimi} {danni}"
  danno:
    uno: "{n} damage"
    molti: "{n} damage"
    uno_tipo: "{n} {tipo} damage"
    molti_tipo: "{n} {tipo} damage"
  vantaggio:
    con: " (with {vantaggio})"
    con_motivo: " (with {vantaggio}: {motivo})"
  confronto: "{totale} against {contro} {valore}"
  esito:
    riuscita: "SUCCESS"
    fallita: "FAILURE"
    riuscito: "SUCCESS"
    fallito: "FAILURE"
    colpito: "HIT"
    mancato: "MISS"
    vince: "WINS"
    perde: "LOSES"
    pari: "TIE: nobody prevails, the situation stays as it was"
  fatto:
    attacco: "attack with {arma}{verso}{vantaggio}: {confronto}{naturale} → {esito}{critico}{danno}{stato}."
    verso_attacco: " on {bersaglio}"
    uno_naturale: " (natural 1)"
    critico: " (critical hit)"
    danno: ", {danno}"
    stato: "; {bersaglio} {salute}"
    salvezza: "{etichetta}{vantaggio}: {confronto} → {esito}."
    contrapposta: "{etichetta} against {avversario}'s {etichetta_avversario}{vantaggio}: {totale} against {totale_avversario} → {esito}."
    contrapposta_passiva: "{etichetta}{contro}{vantaggio}: {confronto} → {esito}."
    contro: " against {descrizione}"
    prova: "{etichetta}{verso}{vantaggio}: {confronto} → {esito}."
    verso_prova: " toward {bersaglio}"
    nessun_tiro: "no roll: the action succeeds if it is possible."
    senza_scheda: "a roll would be needed, but the sheet is missing: no roll, resolve it with a “yes, but”."
    senza_arbitro: "no roll decided (arbiter unavailable): a possible action succeeds, a risky one succeeds at a price."
    impossibile: "impossible like this, no roll{motivo}: it does not succeed as written; say so within the fiction, with a “yes, but” if there is a nearby path."
    impossibile_motivo: " ({motivo})"
    aiuta: "helps {aiutato}: no roll, the other has advantage."
    aiuta_niente: "helps, but there is no action to help this turn: no roll."
    gia_a_terra: "{nome} is already down: no roll, the action succeeds."
    fuggito: "{nome} has fled and is no longer here: no roll, the action finds nobody."
    png_manca: "{nome} misses {bersaglio} (tell it in a sentence of its own)."
    png_colpisce: "{nome} hits {bersaglio}: {danni}{a_terra} (tell it in a sentence of its own)."
    png_a_terra: ", and {bersaglio} goes down"
    il_bersaglio: "the target"
    qualcuno: "someone"
    privata: " (PRIVATE action: the outcome only in a [privato {autore}] line, never in the lines at the table, which do not mention it)"
    a_terra_autore: "is down, unconscious: cannot act until someone heals them."
    a_terra_set: "is down: {a_zero}"
    perde_turno: "is {condizione}: loses the turn, no roll."
    fallisce_da_solo: " It fails automatically: the character is {condizione}."
    prezzo: " Price of failure: {prezzo}."
    non_ottiene: " What they wanted does NOT happen («{cosa}»): do not tell it as a success, and no line grants it anyway."
    non_ottiene_privata: " What they wanted does NOT happen: say it ONLY in the [privato {autore}] line, without repeating at the table what they tried."
    essenziale: " What they were looking for is essential: they find it anyway, but at a price."
    trova_indizio: " They find what they were looking for (clue {indizio})."
    non_trova: " They do not find what they were looking for, for now."
    attacco_senza_scheda: "attacks {bersaglio}, but the target has no sheet: no roll, resolve it with a “yes, but”."
    reazione: "Then {nome} reacts. {frase} Details: {dettagli}"
    scambio: " Exchange: {frase} Details: {dettagli}"
    prova_set: "{regola}{vantaggio}: {valore} → {esito}."
    esito_mossa: " Outcome of the move “{mossa}”: {esito}"
    armatura: " (armor −{armatura})"
    danno_set: "{danno}{armatura}; {nome} {stato}"
    attacco_automatico: "attack with {arma} on {bersaglio} ({regola}) → HITS, {danno}."
    attacco_set: "attack with {arma} on {bersaglio}: {regola} → {esito}."
    attacco_set_colpito: "attack with {arma} on {bersaglio}: {regola} → {esito}, {danno}."
  motivo:
    annullati: "advantage and disadvantage cancel out"
    aiuta: "{nome} helps"
    ben_disposto: "{nome} is well disposed"
    ostile: "{nome} is hostile"
    attaccante: "the attacker is {condizione}"
    bersaglio: "the target is {condizione}"
  cd:
    influenzare: "influence {nome}"
    tiro_di: "{nome}'s roll"
    passiva_di: "{nome}'s passive {abilita}"
    passiva: "passive {abilita}"
    ca_di: "{nome}'s AC"
    difesa_di: "{nome}'s defense"
    colpisce_sempre: "always hits"
  regola:
    automatico: "Automatic attack: {arma} {dadi}{armatura}"
    meno_armatura: " minus armor"
    colpisce: "Hits"
  esiti:
    titolo: "## Roll outcomes (the Engine rolled them: they are facts, tell them as they are)"
    titolo_privati: "### Outcomes of PRIVATE actions (only in the [privato pg_x] line of whoever made it: neither the action nor its outcome at the table)"
    regola: "Every outcome is already decided: success, the action succeeds; failure or miss, it does not succeed, but the scene changes (a price, a complication, a piece of information). Never change an outcome, never say numbers, dice or DC aloud, never ask for other rolls."
  arbitro:
    scena: "Scene (public part):\n{scena}"
    a_distanza: " (ranged)"
    pg_al_tavolo: "PCs at the table:"
    armi: " · weapons: {armi}"
    mani_nude: "none (bare hands)"
    nessuna_arma: "none"
    senza_scheda: " · no sheet"
    a_terra: " · DOWN"
    morto: " · DEAD"
    png_in_scena: "NPCs on stage:"
    verso_i_pg: " · toward the PCs: {atteggiamenti}"
    altri_png: "Other NPCs (not on stage): {png}"
    salvezza_su: "{caratteristica} saving throw"
    nessuno: "(none)"
    nessuna: "(none)"
    riga: "- id {id} · {nome} ({autore}){privata}: “{testo}”"
    privata: " · PRIVATE"
    narrazione: "Last narration:\n{narrazione}"
    personaggi: "Characters:\n{personaggi}"
    prove_scena: "Scene checks (id · when · check):\n{prove}"
    altre: "Other PC actions in this turn:\n{azioni}"
    da_giudicare: "Actions to judge:\n{azioni}"
    domanda: "For each action to judge: is a roll needed, and which one?"
  minimo:
    messaggio: "Action by {nome}: “{testo}”\nPossible skills: {abilita}"
  arbitro_regole:
    intro: "You are the check arbiter of a live tabletop role-playing game, in English, with the rules of the rulebook “{nome}”. The players write what their characters (PCs) do. For each action decide whether a roll is needed and which one, with the vocabulary of this rulebook. You do not narrate and you do not roll the dice: the program does. Reply only with the requested JSON."
    regola_oro: "Golden rule: roll only when the outcome is uncertain AND failure matters. Trivial or safe actions (talking, asking, looking around, walking): \"nessuna\". What cannot succeed as written: \"impossibile\", with the reason in one sentence. A PC helping another's action: \"aiuto\", with the id of that action in \"aiuta\". Striking a creature: \"attacco\", with target and weapon from the sheet. Everything else that is uncertain and risky: \"prova\"."
    mosse: "Rulebook moves: if the action is one of these, put its id in \"mossa\" (the program knows the stat):\n{mosse}"
    prova: "For a \"prova\" without a move choose the skill or, if none fits, the ability.\n- Abilities: {caratteristiche}\n- Skills: {abilita}\n- Difficulties: {difficolta} (when in doubt {predefinita})"
    sociale: "Social checks in the rulebook: {nota}"
    vantaggio: "Advantage or disadvantage: only for a clear circumstance written in the action or in the narration; \"motivo\" in a few words, in English, no secrets. Otherwise \"nessuno\" and an empty motivo."
    senza_vantaggio: "The rulebook has no advantage or disadvantage: \"nessuno\"."
    reazione: "Reaction: if the action triggers the attack of a hostile NPC against whoever does it, the NPC in reazione_png and \"sempre\" (always) or \"se_fallisce\" (if it fails) in reazione_quando; otherwise empty and \"nessuna\"."
    riassunto: "Summary of the rules:\n{riassunto}"
    finale: "Use only ids from the lists. A field that is not needed is an empty string."
    passi: "Relevant rulebook passages:\n{passi}\n\n"
  combattimento:
    inizia: "The fight begins. {ordine}"
    iniziativa: "Initiative: {ordine}."
    iniziativa_schieramento: "Initiative by side: PCs {pg}, NPCs {png}; {primo}."
    agiscono_prima_pg: "the PCs act first"
    agiscono_prima_png: "the NPCs act first"
    senza_iniziativa: "No initiative: everyone acts following the story."
    finisce: "{nome}: {condizioni} ends."
    round: "Round {round}: initiative PCs {pg}, NPCs {png}; {primo}."
    round_individuale: "Round {round}, initiative rolled again: {ordine}."
    prima_pg: "PCs first"
    prima_png: "NPCs first"
    png_non_agisce: "{nome}'s turn: is {condizione}, does not act."
    turno_png: "{nome}'s turn: {frase} Details: {dettagli}"
    morte_venti: "natural twenty: regains consciousness with 1 hit point"
    morte_morto: "third failure: DEAD"
    morte_stabile: "third success: stable, still unconscious"
    morte_parziale: "{esito} (successes {successi}, failures {fallimenti})"
    morte_riuscito: "success"
    morte_fallito: "failure"
    tiro_morte: "{nome} is down: death saving throw {dado} against DC {cd} → {esito}."
    salta_turno: "{nome} is {condizione}: skips the turn."
    etichetta_morte: "Death saving throw"
    morale_cedono: "Enemy morale: {tiro} against {morale} → they BREAK and flee ({nomi})."
    morale_tengono: "Enemy morale: {tiro} against {morale} → they hold."
    fine_fuggiti: "the enemies fled or are out of the fight"
    fine_nemici: "the enemies are down"
    fine_pg: "the PCs are all down"
    finito: "The fight is over: {motivo}."
    fine: "end"
    motivo_master: "the Game Master ends it"
    intestazione: "Fight, round {round}{fase}.{ordine}{tocca} Tell the facts in order; do not invent attacks, damage or deaths that are not in the facts."
    intestazione_senza: "Fight in progress (no initiative: everyone acts following the story). NPCs hit only as the facts say."
    intestazione_fase: ", phase “{fase}”"
    intestazione_ordine: " Order: {ordine}."
    intestazione_tocca: " Now it is the turn of: {chi}: close by inviting only {pronome}, it is their turn."
    loro: "them"
    lui_o_lei: "him or her"
  # NPCs in the scene out of play (scena/regia.ts, righeFuoriGioco): in the narrator's and selector's message.
  fuori:
    titolo: "## NPCs out of play (the Engine says so: they do not speak or act, no lines or [png_…] lines for them)"
    a_terra: "{nome} lies unconscious on the ground: does not speak or act."
    morto: "{nome} is no longer alive: does not speak or act."
    fuggito: "{nome} has fled and is no longer here: does not speak or act."
  # Short Engine lines for a combat fact the narration left out (prove/fatti-dovuti.ts).
  dovuti:
    colpito: "{nome} takes the blow."
    a_terra: "{nome} falls to the ground."
    morente: "{nome} lies on the ground, between life and death."
    stabile: "{nome} is still breathing, but does not move."
    rialzato: "{nome}'s eyes open again."
    morto: "{nome} dies."
    fuggito: "{nome} flees."
  # Engine lines that replace a narrator sentence contradicting the cards (narrazione/guardia-esiti.ts).
  guardia:
    manca: "{chi} misses {bersaglio}."
    colpisce: "{chi} hits {bersaglio}."
    regge: "{nome} takes the blow but stays on their feet."
    in_piedi: "{nome} is still on their feet."
    nessuno_cade: "Nobody falls: the fight goes on."

regole:
  domanda:
    vuota: "Write your question."
    lunga: "At most {max} characters."
    spente: "Questions about the rules are not active for this campaign."
    una_alla_volta: "One moment: I answer one question at a time."
    nessuna_risposta: "No answer: try again."
    errore: "I can't answer right now: try again shortly."
    passi: "Rulebook passages:\n{passi}\n\n"
    nessun_passo: "No rulebook passage found for this question.\n\n"
    domanda: "Question: {domanda}"
  significato:
    successo: "the action succeeds as the player wanted."
    parziale: "it succeeds, but you must give a cost, a hard choice or a complication: tell them together with the success, never as a full success."
    fallimento: "it does not succeed, and the situation gets worse: make something hard happen, never “nothing happens”."
    critico: "it succeeds beyond expectations."
    disastro: "it goes wrong in the worst way."
    grado: "it succeeds particularly well."
  narratore:
    d20: "Roll a d20 plus the modifier against the DC."
    dued6: "Roll {n}d6 plus the stat; what counts is the band of the total."
    soglia: "Roll a d{facce}: it succeeds on the threshold or less."
    intro: "Rules of the rulebook “{nome}”: {come} What each outcome means:"
    fascia: "- {intervallo} “{nome}”: {significato}"
    grado: "- “{nome}”: {significato}"
    riuscita: "- success: {significato}"
    fallita: "- failure: {significato}"
    mosse: "- With a move, the fact also carries the outcome written in the rulebook: tell it that way."
    scambio: "- In an attack with a partial success the opponent hits too: it is already in the facts."
  esito:
    successo: "Success"
    fallimento: "Failure"
    critico: "Critical success"
    disastro: "Disaster"
  # The names the loader uses when regole.yaml does not give them (regole/caricatore.ts).
  predefiniti:
    successo_pieno: "Full success"
    successo_costo: "Success at a cost"
    normale: "Normal"
    nome: "Rules"
    fonte: "untitled rulebook"
    danni: "Hit points"
    a_zero: "Out of the fight."
  fascia:
    sempre: "always"
  regola:
    d20: "{etichetta}: d20{mod} against DC {cd} ({difficolta})"
    dued6: "{n}d6{mod} ({etichetta}){difficolta}: {intervallo}, {fascia}"
    dued6_difficolta: ", {difficolta} {mod}"
    soglia: "{etichetta} {soglia}: d{facce} {difficolta}needs {serve} or less"
    soglia_difficolta: "{difficolta}, "
