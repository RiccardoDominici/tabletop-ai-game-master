# Coherence ledger (apps/server/src/coerenza/, docs/coerenza.md): the «What is true now» section of the narrator's and
# the selector's message (coerenza/blocco.ts). States are the ledger's (bands, never hit points).
coerenza:
  titolo: "## What is true now (the Engine keeps it: the narration never contradicts it; whoever neither speaks nor acts stays silent)"
  in_scena: "In the scene: {elenco}."
  usciti: "Gone from the scene: {elenco}. Here they neither speak nor act."
  uscito: "{nome} (at turn {turno}{verso})"
  verso: ", towards {luogo}"
  pg: "PCs: {elenco}."
  esiti: "This turn: {elenco}."
  esito_colpito: "{chi} hits {bersaglio}"
  esito_mancato: "{chi} misses {bersaglio}"
  esito_a_terra: "{chi} takes down {bersaglio}"
  prova_riuscita: "{chi}: {etichetta} succeeded"
  prova_fallita: "{chi}: {etichetta} failed"
  negati: "Refused this turn: {elenco}."
  negato: "{png} to {pg}"
  stato:
    in_piedi: "{nome} standing"
    ferito: "{nome} wounded"
    grave: "{nome} badly wounded"
    a_terra: "{nome} down and unconscious: neither speaks nor acts"
    morente: "{nome} down and dying: does not act"
    morto: "{nome} is no longer alive: neither speaks nor acts, the body is there"
    fuggito: "{nome} fled"
    nascosto: "{nome} hidden"
  improvvisato: " (improvised: no stats, knows no secret)"
  # A name the players invent (coerenza/nomi-nuovi.ts): in mode B and with the local reader the Engine answers it.
  nome_nuovo: "{nome}? Nobody here knows that name."
  # An action goes somewhere the campaign does not have (coerenza/destinazioni.ts): the roads that really leave the scene.
  strade: "From here the roads you know lead only towards: {luoghi}."
  strade_nessuna: "No road leads from here to that place."
  nome_nuovo_riga: "Nobody in the scene is called {nomi}: no NPC answers to that name, do not voice one."
  # The Engine's answer to an action whose sentences the checker dropped (coerenza/risposta.ts): who tried, how it went.
  risposta:
    riuscita: "{chi} manages it."
    fallita: "{chi} tries, but fails."
    bersaglio_a_terra: "{chi} tries, but {bersaglio} no longer moves."
    bersaglio_via: "{chi} tries, but {bersaglio} is no longer here."
    impossibile: "{chi} tries, but it cannot be done that way."
    tentativo: "{chi} tries."
  # R-inesistente (coerenza/inesistenti.ts): who is really there, when the players name a creature the scene does not have.
  inesistente:
    e: "and"
    presenti_uno: "Besides you, the only one standing in sight here is {elenco}."
    presenti: "Besides you, the only ones standing in sight here are {elenco}."
    nessuno: "Besides you, nobody is standing in sight here."
    riga: "Nobody in the scene is {parole}: whoever the players call that is not here; do not make one act, speak or be hit, and do not invent one."
  riparazione:
    messaggio: "## Fix one sentence\nThe sentence «{frase}» cannot be said: {errore}.\n\n{vero}\n\nRewrite only that sentence: one [narratore] line, at most twenty words, consistent with what is true now. Nothing else."
    errore:
      fuori_gioco_agisce: "it has someone down, dead, fled or gone act or speak ({sostituto})"
      caduta_senza_fatto: "it has someone fall who is still standing for the Engine ({sostituto})"
      colpo_contrario: "it tells a blow against its card ({sostituto})"
  # The yes/no question of the candidate checker (coerenza/domanda.ts, docs/coerenza.md «Frozen replay set»): one call
  # of a small fast model per sentence the mention filter flags.
  domanda:
    sistema: "You check one sentence of a role-playing game's narrator against the game state, which is always true. Answer only with the requested JSON."
    messaggio: "Game state now:\n{vero}\n\nPrevious sentence: «{prima}»\nSentence to check: «{frase}»\n\nQuestion: {domanda}\nAnswer «si» if the sentence to check does it, also through a pronoun or without naming them; «no» if it only describes a body, a state, an absence, a memory or a place, or if it is about someone else."
    chi: "in the sentence to check, does {nome} ({stato}) act, speak, perceive or get said to be present now?"
    assente: "is not in this scene"
    nome: "in the sentence to check, does a «{parola}» act, speak, get hit or get said to be present now? Nobody in the scene and in play is «{parola}»{caduti}."
    caduti: " ({elenco})"
    colpo: "the Engine says that {chi} hits {bersaglio} and wounds them. Does the sentence to check tell that blow as missed, parried or harmless?"
    oppure: " Or: "
    esce: "in the sentence to check, does {nome} leave the scene now (goes away, walks out of sight, goes back elsewhere)?"
