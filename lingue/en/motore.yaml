# Language rules of the Engine in English (docs/lingue.md). Same keys as lingue/it/motore.yaml (the reference);
# lists are leaves, their content is per language. Regular expressions are single-quoted strings: a backslash is
# literal, an apostrophe is written twice (''). An empty string means «this rule does not exist in this
# language». Each section names the server file that reads it; the code sets the regex flags.

# Deterministic announcement of the minimal reader (apps/server/src/llm/minimo.ts, annuncioBreve): the PC name and
# the first short sentence of what the player wrote. English turns the first person into the third
# («I open the door» → «Ginestra opens the door.»); when it cannot do it safely it quotes the player.
annuncio:
  # The player's words quoted ({nome}, {frase}): always valid, used whenever the third person is unsure. Attributed
  # («says»): the narrator's voice reports what the player wrote, it does not assert it (docs/coerenza.md).
  citazione: '{nome} says: “{frase}.”'
  # The neutral frame: the PC's act in the first person («I ask Berta…», «I go to the well»), or anything that is not
  # speech, with no «says». The citation with «says» stays for speech: quoted words, a vocative, words addressed to
  # someone (`parlato`).
  neutra: '{nome}: “{frase}.”'
  # A question opening with an interrogative is words to someone (flag i).
  domanda: '^(who|whom|what|where|when|why|how|which|whose)\b'
  # Words addressed to someone, in the announced sentence (flag i): the second person, a thanks or an apology.
  parlato: '\b(you|your|yours|yourself|yourselves|you''re|you''ve|you''ll|you''d|thanks|thank|sorry|please)\b'
  # A PC out of play when the window closed (0 HP, dead): it does not act, and what it wrote is not said.
  fuori: '{nome} does not act.'
  # A clause that states the world or the PC's state instead of saying what the PC does: not announced (flag i).
  # «I am / I'm» followed by an -ing verb is an act («I'm going down»); anything else is a claim («I'm the fastest»).
  # Also, anywhere in the clause, an encounter or a find that would make something exist («I meet a traveller»), and the
  # PC's own state («I can't stand any more»; final round).
  affermazione: '^(i\s+(have|feel|see|hear|think|believe|guess)|i\s+am\s+(?!\w+ing\b)|i''m\s+(?!\w+ing\b)|there\s+(is|are|was|were)|it\s+is|it''s)\b|i\s+(meet|find|spot|notice|discover|run\s+into|come\s+across)\b|^i\s+(can''t|cannot)\s+stand\b|^i''m\s+(bleeding|dying|fainting)\b'
  # A clause whose subject is someone else («The goblin throws its spear at me»): not announced (flag i).
  # And someone else's arrival («Another one arrives»; final round, PR T13).
  terza_parte: '^(the|a|an|this|that|these|those|he|she|they|it|his|her|their|its|everyone|someone|somebody)\b|^(another\s+(one\s+)?)?(arrives|comes in|enters|appears|shows up)\b'
  # A clause where the PC looks or listens, before a colon («I look through the door: three or four goblins»): what
  # follows the colon is what the PC says it perceives, a claim (final round, PR T12). Flag i, at the clause's head.
  percezione: '^(i\s+)?(look|peek|peer|check|watch|listen|glance|scan)\b'
  # A clause that is the PC's own act in the first person («I block it»): after someone else's clause, the
  # announcement starts again here (flag i).
  atto_del_pg: '^(i|i''ll|i''d)\b'
  # Inside a clause that opens with someone else, the PC's own verb («the door, I kick it open»): then it is the PC's.
  atto_interno: '\b(i|i''ll|i''d)\b'
  # Third person: {nome} and the turned sentence. Empty: the announcement always attributes the player's words
  # («Ginestra says: "I open the door."»): «Ginestra opens the door.» told the act as done before any roll, in the
  # narrator's voice (docs/coerenza.md, «After round 4»).
  terza_persona: ''
  # Chat laughter removed everywhere (flags gi).
  risate: '\b(h?a(h|ha)+h?|lol|lmao|xd)\b'
  # Opening fillers removed, up to three in a row (flag i).
  intercalari: '^(ok(ay)?|ah+|oh+|uh+|um+|hm+|haha\w*|ahah\w*|eh|hey|so|well|alright|yeah|yep|yes|no(?! one)|nope)\b[\s,!.]*'
  # Quotes at both ends of the text, removed (flag g).
  virgolette: '^["«“]|["»”]$'
  # Words at most, name included (at least three words of the sentence always stay).
  max_parole: 12
  # Announcement when nothing is left to quote (only fillers, laughter, one empty word): never empty.
  vuoto: '{nome} acts.'
  # Content words a sentence needs at least (if the first clause has fewer, the next one is joined).
  min_contenuto: 3
  # Words that don't count as content: articles, prepositions, pronouns, conjunctions (flag i, whole word).
  # Proper names in the middle of a clause don't count either: they say to whom, not what.
  non_contenuto: '^(the|a|an|to|at|in|on|of|for|with|from|by|into|onto|over|under|up|down|off|out|about|and|or|but|so|then|that|which|who|if|when|while|as|because|i|me|my|myself|you|your|he|him|his|she|her|it|its|we|us|our|they|them|their|this|these|those|there|here|not|too|also|just|very|me|others|other|towards|toward|through|across|around|near|behind|beside|before|after|against|without)$'
  # Words the announcement never ends on: articles, prepositions, conjunctions, relatives, object pronouns
  # and adverbs that take a complement ("towards", "with", "before the") (flag i, whole word).
  non_finali: '^(the|a|an|to|at|in|on|of|for|with|from|by|into|onto|over|under|towards|toward|across|against|without|and|or|but|so|then|that|which|who|whom|what|where|how|why|whose|if|when|while|as|because|my|your|his|her|its|our|their|this|these|those|very|more|less)$'
  # Conjunctions: removed at the start; if the sentence is cut, it stops before one of the last three words (flag i).
  congiunzioni: '^(and|or|but|so|then|because|while)$'
  # Abbreviations with a full stop that don't end the sentence (lowercase, no stop).
  abbreviazioni: [mr, mrs, ms, dr, st, mt, sr, jr]
  # First person → third person. Every rule ignores case and works on whole words.
  prima_persona:
    # Subject and verb fused at the start, replaced by the third-person form ([from, to]).
    contrazioni: [["i'm", is], ["i've", has], ["i'll", will], ["i'd", would]]
    # The first-person subject at the start (removed; the verb after it goes to the third person).
    soggetto: '^i\s+'
    # One word between subject and verb that does not change (adverbs).
    avverbi: '^(also|then|just|still|now|first|really|immediately|instead|again|simply|only|never|always|already|actually|\w{2,}[^p]ly)$'
    # Words that cannot be the verb: if found there, the announcement quotes the player instead.
    non_verbi: '^(the|a|an|my|your|his|her|their|our|its|this|that|these|those|to|at|in|on|of|for|with|from|by|and|or|but|not|no|it|him|them|you|we|they|she|he|me|i|there|here|too|as|so|very)$'
    # Verbs that stay the same in the third person (modals, irregular pasts, negated auxiliaries).
    invariabili: [can, could, will, would, shall, should, may, might, must, did, was, had, "can't", cannot, "won't", "wouldn't", "couldn't", "shouldn't", "didn't", "wasn't", "hadn't", "mustn't", went, took, saw, came, got, made, said, told, gave, found, ran, threw, left, kept, held, sat, stood, put, let, hit, cut, set]
    # Verbs that do not follow the endings ([from, to]).
    irregolari: [[am, is], [have, has], [do, does], ["don't", "doesn't"], ["haven't", "hasn't"], [go, goes]]
    # Regular past: stays as it is.
    passato: '[^e]ed$'
    # Third-person endings, the first that matches ([regex, replacement with $1, $&]).
    desinenze: [['(?:s|x|z|ch|sh|o)$', '$&es'], ['([^aeiou])y$', '$1ies'], ['$', 's']]
    # A conjunction followed by a new first-person subject («and I look»): group 1 stays, the rest is turned.
    coordinata: '(\s(?:and|then|but|or|so)(?:\s+then)?)\s+(?=i\b)'
    # A conjunction followed by a verb without subject («and look»): cut from there (it cannot be conjugated).
    coordinata_senza_soggetto: '\s+(?:and|then|or)\s+(?!(?:the|a|an|my|his|her|their|its|this|that|these|those|some|i)\b)\S.*$'
    # First-person pronouns in the rest of the sentence ([regex, replacement]).
    pronomi: [['\bmyself\b', themselves], ['\bmy\b', their], ['\bmine\b', theirs], ['\bme\b', them], ["\\bi'm\\b", "they're"], ['\bi am\b', they are], ['\bi was\b', they were], ["\\bi've\\b", "they've"], ["\\bi'll\\b", "they'll"], ["\\bi'd\\b", "they'd"], ['\bi\b', they]]

# Links between actions (apps/server/src/azioni/regole.ts): explicit dependency formulas, on normalized text
# (lowercase, no accents, straight apostrophe).
collegamenti:
  # Formulas that, alone, refer to someone else's action. `nome` is the formula id (the same in every language:
  # logs and tests read it).
  formule_senza_nome:
    - nome: anch_io
      regex: '\b(me,? too|me as well|same here|same for me|same thing|ditto|likewise|so do i|as do i|i do the same( thing)?|i''ll do the same( thing)?|i''m doing the same|i do (it|that) too|i''ll do (it|that) too|i join (him|her|them)|i do what (he|she|they) (does|do|did)|i do as (he|she|they) (does|do))\b'
    - nome: seguo_pronome
      regex: '\b(follow|accompany|cover|help|back|protect|guard) (him|her|them)\b|\b(go|stay|stick|come|stand|walk) with (him|her|them)\b|\b(behind|beside|next to) (him|her|them)\b|\b(give|lend) (him|her|them) a hand\b'
  # Verbs that bind to a named PC: «I follow X», «together with X», «I help X», «I cover X»… (one group).
  legame_con_nome: '(follow|go with|going with|come with|coming with|stay with|staying with|stick with|stick close to|stay close to|keep close to|stand with|stand by|together with|along with|alongside|accompany|help|assist|give a hand to|lend a hand to|back up|cover|protect|guard|shield|support|go behind|stay behind|stand behind|behind|do as|do what|same as|copy)'
  # Between the binding verb and the name (optional): nothing in English.
  prima_del_nome: ''

# Sentence splitter for the voice (apps/server/src/narrazione/frasi.ts).
frasi:
  # Abbreviations after which a full stop does not end the sentence (lowercase, without the final dot). Not «no»,
  # «etc», «a.m», «p.m»: they end sentences too often.
  abbreviazioni: [mr, mrs, ms, dr, prof, st, sr, jr, mt, ft, vs, e.g, i.e, cf, capt, col, gen, lt, sgt, cpl, maj, rev, hon, gov, sen, rep, pres, fr, br, ave, rd, blvd, approx, dept, inc, ltd, vol, ch, fig, pp, p]

# Fiction guard for the moves against a stall (apps/server/src/narrazione/finzione.ts): phrases about the table
# instead of the world. `nome` is for the log. A deliberately narrow list.
finzione:
  espressioni:
    - { nome: 'PC', regex: '\bPCs?\b', flags: '' }
    - { nome: 'players', regex: '\b(players|player characters?)\b', flags: i }
    - { nome: 'none of you', regex: '\b(none|neither|not one) of you\b', flags: i }
    - { nome: 'none of the PCs/characters', regex: '\b(none|neither|nobody|no one|not one) of the (pcs|characters|players|heroes|party)\b', flags: i }
    - { nome: 'nobody has yet…', regex: '\b(nobody|no one|none of you) (has|have) (yet )?(chosen|decided|spoken|acted|written|answered|replied|done|moved|said)\b', flags: i }
    - { nome: 'you have not yet…', regex: '\byou (have not|haven''t|still haven''t|have yet to|still have to) (yet )?(chosen|decided|spoken|acted|written|answered|replied|done|choose|decide|speak|act|write|answer|reply)\b', flags: i }
    - { nome: 'decides for you', regex: '\bdecid\w* for you\b', flags: i }
    - { nome: 'nobody speaks?', regex: '\b(nobody|no one) (speaks|answers|decides|chooses|moves|says anything)\s*\?', flags: i }
    - { nome: 'we are waiting for you', regex: '\b(i am|i''m|we are|we''re|they are|they''re) (still )?waiting (for|on) you\b', flags: i }
    - { nome: 'silence of the table', regex: '\bsilence (at|around|of|from) the (table|group|players)\b|\bthe table''s silence\b', flags: i }

# Guard for rule numbers spoken aloud (apps/server/src/narrazione/numeri-regole.ts): hit points, AC and DC lose
# their number. Rules apply in order; in `regex`, {N} is a number (digits or `numero`). Named groups: `n` = the
# number (one of `zero` → `sostituto_zero`), `maiuscola` = if it starts with a capital, so does the replacement;
# any other group `x` can be used in the replacement as {x} (lowercase).
numeri_regole:
  numero: 'zero|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty[- ](?:one|two|three|four|five|six|seven|eight|nine)|twenty|thirty'
  zero: ['0', zero]
  regole:
    # «is at 0 hit points» → «is down», «drops to zero HP» → «drops down».
    - nome: a_zero
      regex: '\b(?:at|to)\s+(?:0|zero)\s+(?:hit\s+points?|HP)\b'
      flags: gi
      sostituto: down
      sostituto_zero: ''
    # «7 hit points (out of 12)», «four hit points», «0 hit points».
    - nome: punti_ferita
      regex: '\b(?<n>{N})\s+(?<maiuscola>hit)\s+points?(?:\s+(?:out\s+of|of)\s+{N})?'
      flags: gi
      sostituto: some hit points
      sostituto_zero: no hit points
    # «7/12 HP», «7 HP».
    - nome: sigla_pf
      regex: '\b(?<n>{N})(?:\s*/\s*{N})?\s*HP\b'
      flags: g
      sostituto: some hit points
      sostituto_zero: no hit points
    # «Ruggero's AC 15» → «Ruggero's armor».
    - nome: classe_armatura_di
      regex: '(?<=\w''s\s+)(?:AC|[Aa]rmou?r\s+[Cc]lass)(?:\s+(?:of|is))?\s+{N}\b'
      flags: g
      sostituto: armor
      sostituto_zero: ''
    # «the AC 15», «an AC of 15», «her armor class is 15».
    - nome: classe_armatura
      regex: '\b(?:(?:an?|the|its|his|her|their)\s+)?(?:AC|[Aa]rmou?r\s+[Cc]lass)(?:\s+(?:of|is))?\s+{N}\b'
      flags: g
      sostituto: the armor
      sostituto_zero: ''
    # «a DC 15 Dexterity saving throw» → «a Dexterity saving throw».
    - nome: classe_difficolta_davanti
      regex: '\b(?:DC|[Dd]ifficulty\s+[Cc]lass)\s+{N}\s+(?=\p{Lu})'
      flags: gu
      sostituto: ''
      sostituto_zero: ''
    # «the DC 15», «a DC of 15», «difficulty class 15».
    - nome: classe_difficolta
      regex: '\b(?:(?:an?|the)\s+)?(?:DC|[Dd]ifficulty\s+[Cc]lass)(?:\s+(?:of|is))?\s+{N}\b'
      flags: g
      sostituto: the difficulty
      sostituto_zero: ''

# Guard for private actions (apps/server/src/narrazione/privato.ts): frequent words (≥ 4 letters, already without
# accents, apostrophes split) that do not say what an action is about and do not count as shared roots.
privato:
  parole_vuote: [while, when, then, than, this, that, these, those, there, here, with, without, from, into, onto, upon, over, under, after, before, inside, outside, through, also, still, very, much, more, most, less, little, every, each, some, many, what, which, where, their, them, they, have, been, were, your, yours, ours, just, only, even, again, toward, towards, around, about, other, another, nothing, something, anything, because, though, although, myself, himself, herself, themselves, does, doing, will, would, could, should, might, must, quietly, slowly, quickly, carefully, softly, gently, really, away, down, back, being, both, such, like]

# Words that point back at what a PC asked or whispered (apps/server/src/narrazione/privato.ts, haRichiamo): a public line
# with one of them and the PC's name needs only one root in common with their private action (or private outcome) to go
# to their phone. Stems: a word counts if it starts like this; entries of several words are phrases.
privato_richiami:
  richiami: [your question, you asked, asked, had asked, in a low voice, under his breath, under her breath, under their breath, whisper, in private, privately, aside]

# Short names of PCs and NPCs (apps/server/src/campagna/nomi.ts): titles skipped («Sister Teodora» → «Teodora»).
nomi:
  titoli: [sister, brother, father, mother, sir, lady, lord, dame, master, mistress, friar, mr, mrs, ms, miss, dr, doctor, captain, sergeant, uncle, aunt, old, young, saint, st]
  # The trade in the name («Hale the Innkeeper», «Wren the Guard»): the word after one of these counts as a name of the
  # NPC (apps/server/src/repertorio/pertinenza.ts, nomiDeiPng); and the first word of the sheet's `ruolo`, without article.
  connettori: [the, called]
  articoli: [the, a, an]

# Scriptwriter guard (apps/server/src/sceneggiatore/valida.ts, pgCheAgisce): a narrator line whose subject is a PC
# («Gunda opens her fist», «Then Remo stands up», «Remo and Vanda laugh») or a part of their body («Gunda's fist stays
# closed», «The fist of Gunda stays closed») decides for a player. The subject is the name at the start of a sentence,
# after a comma or after a conjunction, followed by a lowercase word (the verb); the vocative («Gunda, …») is not.
sceneggiatore:
  congiunzioni: [and, then, so, but, when, while, as]
  coordinanti: [and]
  negazioni: [does not, "doesn't", did not, "didn't", never, will not, "won't", cannot, "can't"]
  clitici: []
  articoli: [the]
  genitivo: [of]
  possessivo: "'s"
  parti_del_corpo: [hand, hands, fist, fists, finger, fingers, arm, arms, shoulder, shoulders, back, head, face, eye, eyes, gaze, mouth, lips, voice, smile, breath, breathing, heart, leg, legs, foot, feet, step, steps, knee, knees, forehead, cheeks, chin, neck, skin, body, jaw, brow]
  # Words that tell someone's wound or fall (prefixes of words, or phrases): a scriptwriter's line with one during a
  # fight, or naming a PC, says whose state it takes as true (richiede.stati or richiede.esito), so the Engine can check
  # it (final round, attempt 4, CM T19: «a dark trail on the frozen stones…» for a PC no card had hurt).
  stato_pg: [blood, bleed, bloodied, wound, hurt, on the ground, unconscious, limp, dark trail, dark stain, bruise]
  # An attack's outcome told in a fight (final round, attempt 5, PR T15: «Nessun dardo parte…» after a dart that hit):
  # a weapon or a spell (`attacco_armi`, word prefixes) in a sentence with a hit or miss word (guardia_esiti), a launch
  # verb (`attacco_lancio`), or right after a «no» (`attacco_nessun`). Such a line carries richiede.esito.
  attacco_armi: [blow, blows, strike, thrust, spear, blade, arrow, arrows, bolt, bolts, dart, darts, dagger, sword, axe, mace, club, javelin, stone, sling, spell, magic]
  attacco_lancio: [flies, fly, leaves, shoots, whistles, sinks in, explodes]
  attacco_nessun: [no, none, nothing]

# Combat facts the table must hear (apps/server/src/prove/fatti-dovuti.ts): a spoken line tells one if it names the
# creature and has a word starting with one of these stems (lowercase, no accents). Without one, the Engine adds the
# short line of testi-prove.yaml («prove.dovuti.<type>»).
fatti_dovuti:
  colpito: [hit, strik, struck, blow, wound, slash, stab, pierc, bleed, blood, bit, smash, crush, slam, punch, gash, graz, burn, sear, stagger, reel, cut, impal, lacerat, batter, bruis]
  a_terra: [fall, fell, ground, floor, collaps, drop, crumpl, slump, faint, unconscious, senseless, down, knock, toppl]
  morente: [ground, floor, death, dying, die, life, breath, unconscious, motionless, bleed, blood]
  stabile: [breath, stabl, aliv, pulse, unconscious, motionless]
  rialzato: [eye, wak, rise, rose, stir, conscious, gasp, reviv]
  morto: [dead, die, death, lifeless, kill, corpse, perish]
  fuggito: [flee, fled, run, ran, bolt, escap, retreat, scatter, vanish, away]
  buio: [dark, gutter, extinguish, snuff, sputter]
  incontro: [arriv, approach, appear, emerg, come, comes, came, coming, show, loom, step]

# Hidden elements of the scene sheets (apps/server/src/campagna/nascosto.ts, strumenti/valida/lingua.py,
# strumenti/audio/campagna_audio.py): an interactive element with one of these markers (start of a word, any case)
# never goes into the public contexts. The markers of ALL languages hold in every campaign.
nascosto:
  marcatori: [HIDDEN]

# Combat outcome guard (apps/server/src/narrazione/guardia-esiti.ts): a narrator sentence that names a standing NPC with
# a defeat word, or tells a hit/miss against the turn's card, is replaced by the Engine's line. Stems: a word counts if it
# starts like this; entries of several words are phrases. Hit words are those of `fatti_dovuti.colpito`.
guardia_esiti:
  sconfitta: [die, dead, killed, slain, lifeless, corpse, collaps, crumpl, slump, falls dead, drops dead, goes down, falls to the ground, does not get up, out cold, unconscious, defeated, lies still]
  mancato: [miss, goes wide, dodg, parr, block, deflect, glanc, falls short, whiff, sidestep, comes up empty]
  negazioni: [not, no, never, without, doesn, didn, fails]
  # Verbs that tell a hit landed (not weapon nouns: «throws the dagger» announces an attack, it does not tell it).
  colpito: [hits, hit, strikes, struck, wounds, stabs, slashes, cuts, pierces, connects, lands, finds its mark, catches, bites, smashes, impales, takes a blow, takes the blow, takes a hit]
  # Verbs of receiving: their subject is the target («Fulco takes Zirrà's blow»).
  subisce: [takes, is hit, is struck, gets hit, hit by, struck by, suffers]
  # A near-hit the armour absorbs: it fits a miss and a hit with no damage, so it is never a contradiction.
  assorbito: [glancing, grazes, graze, armor holds, armour holds, glances off, bounces off, without wounding, harmlessly, no harm, absorb, slides off]
  # Not a creature falling: idioms and other subjects («her gaze falls», «silence falls», «lets the club drop»).
  figurati: [throws herself, throws himself, throws themselves, drops flat, ducks, crouches, lies flat, gaze, eyes, eye, voice, silence, night, dusk, darkness, snow, rain, lets fall, lets the, drops the, drops her, drops his, from her hand, from his hand, shield, sword, blade, weapon, club, hood, key, cloak, head, shoulders, arms, sees you fall, see you fall, watches you fall, watch you fall]
  # Subject and relative pronouns: «… and he collapses», «…, who collapses» have the creature named before as subject.
  pronomi: [he, she, it, they, who, which, that]
  # Place phrases of `sconfitta`: for a PC they tell a fall only right after one of `verbi_stato`.
  luoghi: [on the ground, to the ground]
  verbi_stato: [is, stays, lies, remains, falls, collapses, goes, drops, stay, lie, fall]
  # A subordinate clause with its own subject («… sees that the boy is down»): one of these, then an article.
  subordinate: [that, because, when, while, where, if, as, until]
  articoli: [the, a, an, his, her, its, their, this, that]

# Out-of-play guard (apps/server/src/narrazione/guardia-fuori.ts): a narrator sentence whose subject is a character
# out of play since before the turn (down, dead, fled) and that does not describe its state becomes the Engine's line.
# `apertura`: words that may come before the subject; `articoli`: a clause opening with one of them and then a noun has
# another subject; `preposizioni`: a sentence opening with one of them does not carry the previous subject; `stato`:
# stems that describe the state.
guardia_fuori:
  apertura: [and, but, then, so, meanwhile, still, only, even, while, when, the, a, an]
  articoli: [the, a, an, this, that, these, those, his, her, its, their, someone, somebody, something, nobody, everyone, everybody]
  preposizioni: [from, in, on, at, behind, outside, inside, above, below, beyond, near, with, by, through, over, under, across, toward, towards, around, against, along, up, down, there, here]
  # «The gaze of Zirrà slides…»: a part of a character, then one of `di_parte`, then the name: that character acts.
  parti: [gaze, eyes, eye, hand, hands, voice, face, head, mouth, laugh, smile, lips, arm, arms, fingers, step, steps, shadow]
  di_parte: [of]
  stato: [lies, lying, dead, motionless, unconscious, on the ground, lifeless, corpse, body, bleed, does not move, doesn't move, not breathing, gone, fled, no longer here, out cold, still on the floor, collapsed, fallen, slumped]
  # A clause opening with an impersonal perception («one hears…», «there is…») has no subject: it carries nobody.
  impersonali: [one hears, one sees, there is, there are, you can hear]

# The carried subject when the yes/no judge is late (apps/server/src/coerenza/portato.ts): a sentence right after one
# judged a violation, naming nobody, that refers back to a third person. `clitici`: object pronouns that are also
# articles (none in English); `oggetti`: object pronouns that are never articles («the blow knocks him down»; not «her»,
# also a possessive); `pronomi`: third-person subject pronouns; `non_soggetti`: first words that open a sentence about
# someone else.
portato:
  clitici: []
  oggetti: [him, them]
  pronomi: [he, she, they]
  non_soggetti: [i, you, we, what, who, where, when, why, how, here]

# Unnamed actors (apps/server/src/coerenza/attori.ts): a flight or an attack on a PC told with no name for who does it.
# `fuga`: a flight by someone unnamed: after `chiunque`, after one of `relativi` with a `tracce` word before it, or with a
# `tracce` word as the clause's subject (a trace of a person: a figure, steps); `difesa` followed by
# one of `colpi` (with its article), or `difesa` and later one of `colpi` with an `in_arrivo` verb: a blow coming at the
# PC named. Exact words, no stems («parry» is not «parrying»). Weapons and blows of the language, not of a campaign.
attori_impliciti:
  fuga: [flees, flee, runs away, run away, runs off, run off, moves away, move away, slips away, hurries away]
  relativi: [who, that, which]
  chiunque: [whoever]
  tracce: [figure, figures, shape, shapes, shadow, shadows, steps, footsteps, someone, somebody]
  difesa: [parries, parry, raises the shield, raises her shield, raises his shield, raises their shield, lifts the shield, blocks, dodges, dodge, ducks]
  colpi: [blow, blows, strike, spear, blade, arrow, arrows, bolt, dagger, sword, axe, mace, club, javelin]
  in_arrivo: [comes, come, arrives, arrive, bounces, bounce, glances off, slams, thuds, lands, breaks]

# Absent creature (apps/server/src/coerenza/inesistenti.ts, R-inesistente): the nouns are the campaign's (NPC aliases,
# minion types); these are only the grammar around them. English puts «of» after the body part («the chest of the
# goblin») and more often a possessive («the goblin's chest»): the noun as subject or after a blow word covers most.
inesistenti:
  relativi: [which, that, who, whom]
  negazioni: [no, not, none, without, nobody]
  verso: [toward, towards, at, against]
  corpo: [chest, shoulder, shoulders, side, back, leg, legs, neck, belly, throat, heart, arm, elbow, knee, thigh, skull, helmet, shield, armour, armor]

# Refusal guard (apps/server/src/narrazione/guardia-rifiuti.ts): after a failed social check toward an NPC, its line
# without a refusal word, or a narrator sentence where it does a giving verb, is replaced by its refusal line.
guardia_rifiuti:
  rifiuto: [no, not, never, nothing, nobody, none, cannot, refuse, refuses, leave]
  cede: [points, shows, hands, gives, reveals, explains, leads, guides, confesses, admits, yields, tells him, tells her, tells them]
  negazioni: [not, no, never, without, doesn, didn]

# Dictation from the phones (apps/server/src/dettato/, docs/ascolto.md). `prompt`: the sentence that tells Whisper how
# the campaign's names are spelled ({personaggi} and {nomi} are comma lists; a part with an empty list is left out).
# `parole_comuni`: ordinary words a name must never replace (the server adds every word written in lowercase in the
# language pack and in the campaign texts). `allucinazioni`: what Whisper writes on silence or noise; a transcript that
# is only one of these counts as empty.
dettato:
  prompt_inizio: "A player's action in a tabletop role-playing game."
  prompt_personaggi: "Characters: {personaggi}."
  prompt_nomi: "Names: {nomi}."
  parole_comuni: [a, an, the, and, or, but, if, then, so, of, to, in, on, at, by, for, from, with, without, into, onto, over, under, up, down, out, off, about, after, before, behind, near, far, here, there, where, when, why, how, what, who, whom, which, that, this, these, those, i, me, my, mine, you, your, yours, he, him, his, she, her, hers, it, its, we, us, our, they, them, their, is, are, was, were, be, been, being, am, have, has, had, do, does, did, not, no, yes, can, could, will, would, shall, should, may, might, must, all, any, some, every, each, other, another, same, more, most, less, very, too, also, just, only, again, still, now, then, soon, quickly, slowly, quietly, loudly, together, ask, asks, say, says, tell, tells, look, looks, search, searches, take, takes, open, opens, close, closes, go, goes, run, runs, enter, enters, leave, leaves, climb, climbs, attack, attacks, hit, hits, shoot, shoots, throw, throws, try, tries, help, helps, follow, follows, talk, talks, speak, speaks, listen, listens, make, makes, give, gives, show, shows, hide, hides, wait, waits, check, checks, push, pushes, pull, pulls, touch, touches, bring, brings, put, puts, hold, holds, hear, hears, see, sees, want, wants, man, woman, boy, girl, child, old, young, house, door, window, road, path, wood, woods, forest, fire, water, bread, wine, sword, bow, shield, hand, hands, eyes, head, voice, name, key, letter, night, day, evening, morning, tower, bridge, river, mountain, field, dog, dogs, wolf, horse, mule, sheep, big, small, little, great, new, good, bad, first, last, next, mark, rose, will, grace, hope, may, june, august, bill, frank, sky, stone, ash, wolfe]
  allucinazioni: ["thank you for watching", "thanks for watching", "thank you", "subtitles by the amara.org community", "please subscribe", "music", "applause"]

# Actions that bring no new decision (apps/server/src/mondo/stallo.ts, manual E12): two turns in a row where every
# action is one of these, or repeats the same action as the turn before, count as a stall. The whole action must be
# one of these (with at most the PC's name in front): «Anna waits, then opens the door» is a decision.
# A deliberately narrow list.
stallo:
  # The PC's own committing verbs (mondo/stallo.ts, `impegna`; docs/mondo.md §5): an action that moves, goes somewhere,
  # gives or takes, uses an object or attacks is a real decision and starts the stall's count again; naming or asking
  # an NPC is not. Whole words, in a sentence that is not a question (flags iu).
  impegno: '\b(i|we|i''ll|we''ll)\s+(go|walk|run|enter|leave|climb|follow|head|move|come|give|hand|take|grab|pick up|steal|drop|put|use|open|close|light|tie|cut|break|force|push|pull|lift|throw|drink|attack|hit|strike|charge|shoot|block|bless|bandage|drag)\b'
  # A movement and its destination (named group `dove`; coerenza/destinazioni.ts): a destination none of whose words the
  # campaign or the language knows («I go to the mill» with no mill) is not a commitment (flags giu).
  moto: '\b(?:i|we|i''ll|we''ll)\s+(?:go|walk|run|head|ride|return|come|climb)\s+(?:to|into|towards|toward|up to|down to|back to|over to|through)\s(?<dove>[^,;:.!?]*)'
  # A movement toward «there» with no named place (`deittico`, flags iu) and a place the action mentions (`menzione`,
  # named group `dove`, flags giu): «…there is a cave… I go there.» (coerenza/destinazioni.ts).
  deittico: '\b(?:i|we|i''ll|we''ll)\s+(?:go|head|run|walk|climb)\s+(?:there|over there)\b'
  menzione: '(?:there\s+is\s+(?:an|a)|there\s+are\s+some|on\s+the|in\s+the|in\s+an|in\s+a)\s+(?<dove>[^\s,;:.!?]+)'
  senza_decisione:
    - { nome: waiting, regex: '^(?:\p{L}+\s+)?(?:i\s+|we\s+)?(?:wait\w*|keep\s+waiting)(?:\s+(?:here|again|a bit|a little|and see|in silence))*\s*[.!…]*$', flags: iu }
    - { nome: staying put, regex: '^(?:\p{L}+\s+)?(?:i\s+|we\s+)?(?:stay\w*|remain\w*|stand\w*)\s+(?:still|put|here|and watch)\s*[.!…]*$', flags: iu }
    - { nome: nothing, regex: '^(?:\p{L}+\s+)?(?:i\s+|we\s+)?(?:do(?:es)?\s+nothing|nothing|pass\w*)\s*[.!…]*$', flags: iu }
    - { nome: looking around, regex: '^(?:\p{L}+\s+)?(?:i\s+|we\s+)?look\w*\s+around\s*[.!…]*$', flags: iu }
