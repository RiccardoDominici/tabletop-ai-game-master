# Fixed phrases the Engine sends to the MODELS outside the turn message: action referee, minimal reader, evening
# summary, structured output (JSON), cache warm-up, script of the fake narrator. Same keys and placeholders as
# lingue/it/testi-modelli.yaml (the reference). JSON field names (dipende_da, giudizio, risposte, battuta…), their
# fixed values (valida, dubbia, impossibile, nessuna) and the protocol labels ([narratore], [invito], pg_…, FILO:)
# stay as they are.
modelli:
  # Structured output on providers without a native schema (apps/server/src/llm/strutturato.ts).
  json:
    istruzione: "Answer ONLY with a JSON object valid for this schema, with no text before or after, no comments:\n{schema}"
    correzione: "The previous answer was not valid ({motivo}). {istruzione}"
  # Zero-token call that writes the system blocks into the cache (apps/server/src/llm/narratore.ts).
  preriscaldamento: "Cache warm-up: do not answer."
  # Action referee (apps/server/src/azioni/arbitro-haiku.ts); the prompt is prompts/<code>/arbitro-azioni.md.
  arbitro:
    scena: "Scene (public part):\n{scena}"
    riga: "- id {id} · {nome} ({autore}){privata}: “{testo}”"
    privata: " · PRIVATE"
    nessuna: "(none)"
    ultima_narrazione: "Latest narration:\n{narrazione}"
    in_coda: "Actions already queued:\n{azioni}"
    nuova: "New action:\n{azione}"
    domanda_relazioni: "Which queued actions does the new action depend on, and which does it conflict with? Use only ids from the «queued» list."
    narrazione_arrivata: "Narration that just arrived (after these actions were written):\n{narrazione}"
    scritte_prima: "Actions written before:\n{azioni}"
    domanda_vecchie: "Judge each action: valida, dubbia or impossibile, with the reason for the player."
    prima_del_cambio: "Action before the change:\n{azione}"
    dopo_il_cambio: "Action after the change:\n{azione}"
    dipendenti: "Actions that depended on it:\n{azioni}"
    domanda_cambio: "For each action that depended on it: does the change affect it?"
  # Minimal reader (apps/server/src/llm/minimo.ts); the prompt is prompts/<code>/lettore-minimo.md.
  lettore:
    azioni: "Actions of the turn:\n{elenco}"
    riga: "{numero}. {nome} ({id_pg}){privata}: {testo}\n   Candidates (id: when):\n{candidati}"
    privata: " [PRIVATE]"
    nessun_candidato: "   (no candidate: line \"nessuna\")"
  # Evening summary (apps/server/src/sessione/riassunto.ts); the prompt is prompts/<code>/riassunto.md.
  riassunto:
    messaggio: "## Public transcript of the evening\n{materiale}\n\n## The summary"
    azione: "{nome} (action)"
  # Scriptwriter (apps/server/src/sceneggiatore/prompt.ts); the prompt is prompts/<code>/sceneggiatore.md.
  sceneggiatore:
    contesto: "## Campaign and scene (what the narrator knows)\n{contesto}"
    scena: "## Current scene: {titolo} ({id}); NPCs present: {presenti}"
    stato: "## State\nclues revealed: {indizi}\nfacts known to the PCs: {fatti}\nclocks: {orologi}"
    segrete: "## Secret words (NEVER in your lines)\n{elenco}"
    trascrizione: "## Last lines heard at the table\n{righe}"
    gia_usati: "## Already used in the last turns (do NOT repeat them)\nopenings: {attacchi}\nimages: {immagini}\ntics heard recently: {tic}"
    esempi: "## Example lines from this campaign\n{esempi}"
    pronunce: "## Names without a pronunciation\nThese words heard at the table are not in the pronunciation lexicon: {nomi}. For each one that is a proper noun (person, place, object, faction, god) add an entry to «pronunce»; ignore ordinary words."
    compito: "## Task\n{compito}\nId prefix: {prefisso}. Answer only with the YAML block."
    subito: "Write ONE line that answers this action, now (the player is waiting): {nome} ({id_pg}): «{testo}». If the action is aimed at an NPC who is present, that NPC answers; otherwise the narrator tells the effect.{privata}"
    privata: " It is a PRIVATE action: only that player hears the answer, on their phone. The NPC speaks under their breath, or the narrator tells what only that PC sees or hears; nobody else at the table notices."
    prossime: "Write {quante} lines for the most likely actions of the next turn, different from each other: who talks to whom, what they touch, what they ask. At least one for every NPC present."
    chiusura: "The Game Master is closing the evening. Write ONE line with `tipo: chiusura` and `chi: narratore`, two to four [narratore] rows: the moment where the table stops, a closing image, and a hook for next time on a thread left open in the transcript (a question with no answer yet, a clock that is running). Only what the table has seen and heard: no new mysteries, no secret words, and the PCs do nothing their players have not said."
    nessuno: "none"
    nessuna: "(none)"
    trattino: "—"
  # Generic script of the fake narrator (apps/server/src/llm/finto.ts), for trials without a model.
  finto:
    apertura: "[narratore] The oven crackles at the back of the hall. Someone knocks twice at the door."
    png: "[{png}] Who is it at this hour? Answer, or I won't open."
    chiusura: "[narratore] The wind carries the smell of snow. What do you do?"
