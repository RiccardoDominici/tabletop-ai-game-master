  # ─────────────────────────── CAMBI ───────────────────────────
  # `prima` e `dopo` sono due versioni della stessa azione; `dipendente` dipende da lei.

  - id: m01
    tipo: cambio
    insieme: sviluppo
    nota: "cambia solo il modo (senza fare rumore), non la meta: chi va anche lui alla grata non è toccato → nessun avviso."
    narrazione: "Dietro la porta del ripostiglio il forestiero tossisce ancora, una tosse secca, lunga."
    prima: {id: a1, autore: pg_ginestra, testo: "vado alla grata del ripostiglio"}
    dopo: {id: a1, autore: pg_ginestra, testo: "vado alla grata del ripostiglio, senza fare rumore"}
    dipendente: {id: a2, autore: pg_corrado, testo: "anch'io"}
    atteso:
      toccata: false

  - id: m02
    tipo: cambio
    insieme: sviluppo
    nota: "Ginestra precisa la domanda sullo stesso argomento (i malati): Teodora voleva saperlo anche lei e resta così → non toccata."
    narrazione: "Ottavia si siede un momento sullo sgabello dietro il bancone e si massaggia le mani."
    prima: {id: a1, autore: pg_ginestra, testo: "chiedo a ottavia dei malati"}
    dopo: {id: a1, autore: pg_ginestra, testo: "chiedo a ottavia dei malati: quanti sono e da quanti giorni hanno la febbre"}
    dipendente: {id: a2, autore: pg_teodora, testo: "anche io voglio saperlo, mi siedo al bancone con ginestra"}
    atteso:
      toccata: false

  - id: m03
    tipo: cambio
    insieme: sviluppo
    nota: "Assenzio cambia meta (dal retro alla finestra): chi lo seguiva nel retro ora andrebbe altrove → toccata."
    narrazione: "Ottavia scosta la tenda del retro e ci sparisce dietro con una cesta vuota."
    prima: {id: a1, autore: pg_assenzio, testo: "vado nel retro dietro la tenda a vedere cosa fa ottavia"}
    dopo: {id: a1, autore: pg_assenzio, testo: "no lascia stare, vado alla finestra a guardare la piazza"}
    dipendente: {id: a2, autore: pg_corrado, testo: "lo seguo"}
    atteso:
      toccata: true

  - id: m04
    tipo: cambio
    insieme: riserva
    nota: "Teodora aiutava a convincere Baldrin con le buone; Corrado passa a strappargli la chiave: l'aiuto a «convincerlo» non ha più senso → toccata."
    narrazione: "Baldrin stringe la chiave nel pugno e non risponde. Guarda Corrado dal basso in alto, senza paura."
    prima: {id: a1, autore: pg_corrado, testo: "parlo con baldrin con calma, gli chiedo di farci vedere il forestiero"}
    dopo: {id: a1, autore: pg_corrado, testo: "basta parlare. gli strappo la chiave dal collo"}
    dipendente: {id: a2, autore: pg_teodora, testo: "aiuto corrado a convincerlo, gli dico che anche il forestiero ha diritto a una preghiera"}
    atteso:
      toccata: true

  # ─────────────────────────── FALSI ALLARMI ───────────────────────────
  # Nomi di PG o parole-spia («anche», «come», «aiuto») senza un legame reale: tutto vuoto.

  - id: f01
    tipo: relazioni
    insieme: sviluppo
    nota: "salutare Corrado non dipende da quello che fa Corrado (a1); Assenzio (a2) non c'entra → nessun legame."
    narrazione: "La sala si riempie del vapore della zuppa. Ottavia passa tra i tavoli col mestolo in mano."
    coda:
      - {id: a1, autore: pg_corrado, testo: "mi siedo al tavolo lungo e mangio la zuppa, finalmente", privata: false}
      - {id: a2, autore: pg_assenzio, testo: "mi siedo sul bancone e rubo una castagna", privata: false}
    nuova: {id: n1, autore: pg_ginestra, testo: "saluto corrado con la mano e vado a scaldarmi i piedi vicino al forno", privata: false}
    atteso:
      dipende_da: []
      conflitti: []

  - id: f02
    tipo: relazioni
    insieme: riserva
    nota: "«guardo cosa fa Teodora» è osservare, non seguire né aiutare: se Teodora cambia azione, Assenzio guarda comunque lei → nessuna dipendenza."
    narrazione: "Il fuoco del forno tinge la sala di rosso. Baldrin sbadiglia, la chiave che gli si alza e abbassa sul petto."
    coda:
      - {id: a1, autore: pg_teodora, testo: "vado alla finestra e guardo la cappella illuminata", privata: false}
    nuova: {id: n1, autore: pg_assenzio, testo: "guardo cosa fa teodora, poi mi appoggio al bancone con le mani in tasca", privata: false}
    atteso:
      dipende_da: []
      conflitti: []

  - id: f03
    tipo: relazioni
    insieme: sviluppo
    nota: "due domande diverse e compatibili alla stessa ostessa: nessuna dipendenza e nessun conflitto, Ottavia risponde a tutti e due. Il non esclusivo è per azioni che si intrecciano (c07, c08). Dubbio: la doc cita «due parlano allo stesso PNG»."
    narrazione: "Ottavia si appoggia al bancone e si asciuga la fronte col dorso della mano."
    coda:
      - {id: a1, autore: pg_ginestra, testo: "chiedo a ottavia da quanti giorni i malati hanno la febbre", privata: false}
      - {id: a2, autore: pg_assenzio, testo: "gioco con moro vicino al forno", privata: false}
    nuova: {id: n1, autore: pg_corrado, testo: "ottavia quanto vuoi per un letto vero? sopra la stalla si gela", privata: false}
    atteso:
      dipende_da: []
      conflitti: []

  - id: f04
    tipo: relazioni
    insieme: sviluppo
    nota: "«come ginestra ho fame anche io» è un paragone, non un «anch'io» sull'azione: Assenzio fa una cosa sua (va a servirsi da solo). Se Ginestra cambia, lui non cambia."
    narrazione: "Le scodelle sono vuote. Dal forno arriva odore di castagne arrostite."
    coda:
      - {id: a1, autore: pg_ginestra, testo: "chiedo a ottavia un'altra scodella di zuppa, ho una fame da lupi", privata: false}
    nuova: {id: n1, autore: pg_assenzio, testo: "come ginestra ho fame anche io, ma nn disturbo ottavia: vado nel retro e mi arrangio, so dove tiene le cose", privata: false}
    atteso:
      dipende_da: []
      conflitti: []

  - id: f05
    tipo: relazioni
    insieme: riserva
    nota: "Teodora parla a Corrado, ma d'altro (la partenza di domani): la battuta non si appoggia alla sua azione → nessun legame. Ginestra (a2) non c'entra."
    narrazione: "Fuori il vento ammucchia la neve contro le imposte. Ottavia aggiunge un ciocco nel forno."
    coda:
      - {id: a1, autore: pg_corrado, testo: "vado al bancone e chiedo a ottavia del vino caldo", privata: false}
      - {id: a2, autore: pg_ginestra, testo: "controllo le erbe nella borsa, ne ho ancora per un infuso?", privata: false}
    nuova: {id: n1, autore: pg_teodora, testo: "dico a corrado: «domattina all'alba ripartiamo, se la neve chiude il passo restiamo bloccati qui»", privata: false}
    atteso:
      dipende_da: []
      conflitti: []

  - id: f06
    tipo: relazioni
    insieme: sviluppo
    nota: "l'unica azione in coda è privata: Corrado non la vede, quindi «sto vicino ad assenzio» riguarda la persona, non quell'azione → nessuna dipendenza (e nessun conflitto: non è esclusivo)."
    narrazione: "Baldrin si alza e va alla finestra a guardare le torce in piazza, dando le spalle alla sala."
    coda:
      - {id: a1, autore: pg_assenzio, testo: "approfitto che il nano è alla finestra e mi infilo dietro la tenda senza farmi vedere", privata: true}
    nuova: {id: n1, autore: pg_corrado, testo: "sto vicino ad assenzio, non mi fido di questo posto", privata: false}
    atteso:
      dipende_da: []
      conflitti: []

  - id: f07
    tipo: relazioni
    insieme: riserva
    nota: "Corrado è nominato in una battuta a Ottavia («stasera paga corrado»), ma Ginestra non si appoggia a quello che fa lui (a1) → nessun legame. Teodora (a2) non c'entra."
    narrazione: "Ottavia accende le candele sul tavolo lungo. Fuori, la cappella brilla nella neve."
    coda:
      - {id: a1, autore: pg_corrado, testo: "mi siedo vicino alla porta e pulisco la balestra", privata: false}
      - {id: a2, autore: pg_teodora, testo: "mi siedo vicino al forno a scaldarmi le mani", privata: false}
    nuova: {id: n1, autore: pg_ginestra, testo: "dico a ottavia che stasera paga tutto corrado e le chiedo un'altra scodella", privata: false}
    atteso:
      dipende_da: []
      conflitti: []

  - id: f08
    tipo: relazioni
    insieme: sviluppo
    nota: "«aiuto» rivolto a un PNG (Ottavia), non a un PG: la regola «aiuto…» non deve scattare, e l'azione di Corrado (a1) non c'entra."
    narrazione: "Ottavia raccoglie le scodelle sporche, ne impila troppe e barcolla verso il retro."
    coda:
      - {id: a1, autore: pg_corrado, testo: "mi metto alla finestra a guardare la piazza", privata: false}
    nuova: {id: n1, autore: pg_assenzio, testo: "aiuto ottavia a portare le scodelle di là, come quando ero ragazzino", privata: false}
