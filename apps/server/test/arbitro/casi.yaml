# Casi di valutazione per l'arbitro delle azioni simultanee (docs/azioni-concorrenti.md, «Il classificatore»).
#
# Scena: prova F0, l'osteria del Forno Vecchio nella Notte dei Lumi (campagne/prova-f0).
# Confine delle informazioni: i casi usano SOLO il lato pubblico della scena — nome, descrizione, apertura ed
# elementi interattivi visibili di scena.yaml, il riassunto iniziale della sessione, e di ogni PG nome, specie,
# classe, aspetto e concetto. Niente conoscenze private, niente elementi nascosti, niente causa della febbre.
# PNG pubblici: Ottavia (ostessa), Baldrin (nano, guarda il ripostiglio con la chiave al collo), il forestiero
# chiuso nel ripostiglio, Moro il cane.
#
# Gruppi (prefisso dell'id):
#   d = dipendenza (10)   c = conflitto (8: 5 esclusivi, 3 non esclusivi)   v = azione vecchia (8: 3 valida,
#   3 dubbia, 2 impossibile)   m = cambio di un'azione da cui un'altra dipende (4: 2 toccata, 2 no)
#   f = falso allarme (8: nomi o parole-spia senza legame reale)
# Insiemi: `riserva` = 13 casi tenuti da parte per la misura finale (almeno uno per gruppo); il resto `sviluppo`.
#
# Regole adottate per la risposta giusta (quando il dubbio c'è, la nota del caso lo dice):
#   - `dipende_da` contiene solo i legami DIRETTI: la catena A → B → C la propaga il Motore (d05).
#   - Un giocatore non può dipendere da un'azione privata di un altro: non la vede (d02, f06).
#     Un'azione privata può invece dipendere da un'azione pubblica che il suo autore vede (d10).
#   - Le azioni private contano per i conflitti esclusivi (c04).
#   - Conflitto esclusivo: le due azioni non possono riuscire entrambe (stesso oggetto preso da due, stessa porta
#     aperta e sbarrata, stessa cosa portata in due posti). Vince chi ha scritto prima: in coda c'è sempre l'azione
#     più vecchia.
#   - Conflitto non esclusivo: stesso bersaglio e gli esiti si intrecciano (due colpi sullo stesso avversario,
#     approcci o richieste opposti allo stesso PNG); il narratore li risolve insieme, senza avvisi.
#     Domande diverse e compatibili allo stesso PNG NON sono conflitto (f03).
#   - Chi dipende da un'azione non è anche «in conflitto» con lei: fare la stessa cosa insieme è dipendenza.
#   - Azioni vecchie: `valida` se la narrazione non tocca il presupposto; `dubbia` se il presupposto è cambiato ma
#     l'azione si può ancora fare; `impossibile` se così com'è scritta non si può più fare (porta già richiusa,
#     PNG sparito, momento passato).

casi:

