# Invented lines for the world tests (mode B): a clue line without gates on the action, and a filler.
battute:
  - id: nar_impronte
    chi: narratore
    tipo: indizio
    quando: "qualcuno guarda i sacchi di farina"
    temi: [sacchi, farina]
    testo:
      - "[narratore] Sui sacchi di farina ci sono impronte piccole, di piedi scalzi."
    effetti:
      rivela_indizi: [i_farina]
    max_usi: 1
  - id: nar_ruota
    chi: narratore
    tipo: momento
    quando: "nessuno fa niente"
    temi: [ruota]
    riempitivo: true
    testo:
      - "[narratore] La ruota cigola e si ferma un istante."
    max_usi: 3
  - id: nar_macina
    chi: narratore
    tipo: indizio
    quando: "qualcuno esamina la macina"
    temi: [macina]
    testo:
      - "[narratore] La macina ha i bordi ancora vivi: è nuova."
    effetti:
      fatti_noti: [f_macina]
    max_usi: 1
  - id: nar_cantina_privata
    chi: narratore
    tipo: indizio
    quando: "qualcuno scende da solo in cantina"
    temi: [cantina]
    richiede: {privata: true}
    testo:
      - "[narratore] In cantina, dietro i sacchi, c'è un giaciglio caldo."
    effetti:
      fatti_noti: [f_ladra]
    max_usi: 1
  # Only for Bruno's action: the Engine cannot say it at a stall (mode B S2 picks a clue it can say).
  - id: nar_sacco
    chi: narratore
    tipo: indizio
    quando: "Bruno solleva il sacco rotto"
    temi: [sacco]
    richiede: {da_pg: [pg_bruno]}
    testo:
      - "[narratore] Sotto il sacco rotto c'è un nastro rosso."
    effetti:
      rivela_indizi: [i_sacco]
    max_usi: 1
  # Written for the consequence o_piena@2: no themes, so only the Engine says it (mode B).
  - id: nar_ruota_ferma
    chi: narratore
    tipo: momento
    quando: "il fiume ferma la ruota"
    temi: []
    testo:
      - "[narratore] La ruota si ferma di colpo. Il mugnaio afferra un sacco e corre fuori, verso il ponte."
    max_usi: 1
