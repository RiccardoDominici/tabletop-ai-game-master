  nome: Ida Ferraro
  pronomi: lei
  specie: umana
  classe: barda
  livello: 1
  aspetto: Umana con un liuto a tracolla e un cappello piumato.
  concetto: Cantastorie di piazza che vive di parole. Convincere la gente è il suo mestiere.
  aggancio: In città l'aspetta un ingaggio per il torneo.
  cosa_sai_fare:
