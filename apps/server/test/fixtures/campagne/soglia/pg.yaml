  pronomi: lui
  specie: umano
  classe: guerriero
  livello: 1
  aspetto: Umano dalle spalle larghe, una balestra a tracolla e un giaco di maglia.
  concetto: Ex balestriere di una compagnia di ventura. Non ama chi fa il prepotente.
  aggancio: Deve consegnare un messaggio in città entro domani.
  cosa_sai_fare:
