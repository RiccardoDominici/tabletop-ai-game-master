  aspetto: Halfling magro con un mantello grigio e le mani sempre in tasca.
  concetto: Ladruncolo di città che si è messo in viaggio per sparire un po'.
  aggancio: In città qualcuno gli deve dei soldi.
  cosa_sai_fare:
