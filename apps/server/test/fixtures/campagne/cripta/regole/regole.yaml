# Invented rule set of the R3 fixture (docs/regole.md §2): an old-school d20 game written for the tests, with the
# pieces of the rules-engine work R3 — progression tables by class and level (XP, hit dice, attack bonus, thief values,
# a Turn Undead table), XP by hit dice and for treasure, the Game Master's secret thief rolls, Turn Undead as a power.
# The numbers are invented (small, so a level comes in one session): a test against a manual uses that manual's set.
id: cripta-prova
nome: Vecchia scuola con i livelli (set di prova)
fonte:
  titolo: Set di prova di Tabletop AI Game Master, scritto per i test
  autore: Tabletop AI Game Master
licenza:
  nome: CC0
  libera: true
risoluzione:
  tipo: d20_cd
  dado: 20
  critico: 20
  disastro: 1
  critici: attacchi_e_salvezze
caratteristiche:
  - {id: forza, nome: Forza}
  - {id: destrezza, nome: Destrezza}
  - {id: costituzione, nome: Costituzione}
  - {id: intelligenza, nome: Intelligenza}
  - {id: saggezza, nome: Saggezza}
modificatore:
  tipo: tabella
  tabella:
    - {da: 3, mod: -2}
    - {da: 7, mod: -1}
    - {da: 9, mod: 0}
    - {da: 13, mod: 1}
    - {da: 17, mod: 2}
abilita:
  - {id: mischia, nome: Attacco in mischia, caratteristica: forza}
  - {id: distanza, nome: Attacco a distanza, caratteristica: destrezza}
  - {id: furtivo, nome: Colpo furtivo, caratteristica: forza, danno: doppio, una_volta_per_bersaglio: true, ripiego: mischia}
  - {id: ts_morte, nome: Salvezza contro la morte, caratteristica: null, salvezza: morte}
  - {id: ts_magia, nome: Salvezza contro la magia, caratteristica: null, salvezza: magia}
  # The thief's values by level come from the class table; the Game Master rolls some in secret (see below).
  - {id: origliare, nome: Origliare, caratteristica: null, soglia: {dado: 100}, segreta: niente}
  - {id: trappole, nome: Trovare trappole, caratteristica: null, soglia: {dado: 100}, segreta: niente}
  - {id: sgattaiolare, nome: Sgattaiolare, caratteristica: null, soglia: {dado: 100}, segreta: riuscita}
  - {id: borseggiare, nome: Borseggiare, caratteristica: null, soglia: {dado: 100, grave: {oltre_volte: 2, col_massimo: true, nome: "la vittima se ne accorge"}}}
difficolta:
  - {id: facile, nome: Facile, valore: 11, percentuale: 20}
  - {id: normale, nome: Normale, valore: 15}
  - {id: difficile, nome: Difficile, valore: 18, percentuale: -20}
difficolta_predefinita: normale
vantaggio:
  tipo: bonus
  valore: 2
attacchi:
  tipo: prova
  danno_critico: normale
  danno_minimo: 1
danni:
  nome: Punti ferita
  a_zero: a zero si rischia la morte
sociale:
  caratteristica: saggezza
  nota: Si tira Saggezza contro la diffidenza del PNG.

progressione:
  attacco: [mischia, distanza, {abilita: furtivo, piu: 4, classi: [ladro]}]
  punti_ferita: {caratteristica: costituzione, minimo: 1}
  un_livello_per_avventura: true
esperienza:
  per_dadi_vita:
    - {da: 0, px: 5, speciale: 1}
    - {da: 1, px: 20, speciale: 5}
    - {da: 2, px: 40, speciale: 10}
    - {da: 3, px: 80, speciale: 15}
  tesoro: {px: 1, per: mo, quando: al_sicuro}
monete:
  base: mo
  tagli:
    - {id: mo, nome: Monete d'oro, vale: 10}
    - {id: ma, nome: Monete d'argento, vale: 1}

tiri_salvezza:
  colonne:
    - {id: morte, nome: Morte o veleno}
    - {id: magia, nome: Magia}
classi:
  - id: guerriero
    nome: Guerriero
    px: [0, 200, 400, 800]
    dadi_vita: [{da: 1, dado: "1d8"}]
    attacco: [{da: 0, bonus: 0}, {da: 1, bonus: 1}, {da: 3, bonus: 2}]
    tiri_salvezza: [{da: 0, valori: [14, 17]}, {da: 1, valori: [12, 16]}, {da: 3, valori: [11, 15]}]
  - id: chierico
    nome: Chierico
    px: [0, 150, 300, 600]
    dadi_vita: [{da: 1, dado: "1d6"}]
    attacco: [{da: 1, bonus: 1}, {da: 3, bonus: 2}]
    tiri_salvezza: [{da: 1, valori: [11, 15]}, {da: 2, valori: [10, 14]}]
    incantesimi_al_giorno: [{da: 1, slot: []}, {da: 2, slot: [1]}, {da: 3, slot: [2]}]
    tabelle:
      scacciare: [{da: 1, valori: [10, 14, null]}, {da: 2, valori: [8, 12, 18]}, {da: 3, valori: [T, 10, 16]}, {da: 4, valori: [D, T, 14]}]
  - id: ladro
    nome: Ladro
    px: [0, 125, 250, 500]
    dadi_vita: [{da: 1, dado: "1d4"}]
    attacco: [{da: 1, bonus: 1}, {da: 3, bonus: 2}]
    tiri_salvezza: [{da: 1, valori: [13, 14]}, {da: 2, valori: [12, 13]}]
    abilita:
      colonne: [origliare, trappole, sgattaiolare, borseggiare]
      righe: [{da: 1, valori: [30, 20, 25, 30]}, {da: 2, valori: [35, 25, 30, 35]}, {da: 3, valori: [40, 30, 35, 40]}]
razze:
  - id: umano
    nome: Umano
    tratti:
      - {tiro: esperienza, bonus: 10}
  - id: folletto
    nome: Folletto
    tratti:
      - {tiro: iniziativa, bonus: 1}
      - {almeno: {sgattaiolare: 50}}
      - {dado_vita_massimo: 6}
magia: {preparazione: vanciana}
riposo:
  - {id: notte, nome: Una notte di sonno, cura: 1, durata: {ora: 8}}
tempo:
  unita:
    - {id: round, nome: Round, plurale: round, secondi: 10}
    - {id: turno, nome: Turno, plurale: turni, secondi: 600}
    - {id: ora, nome: Ora, plurale: ore, secondi: 3600}
  round: round
  per_finestra: {turno: 1}

poteri:
  - id: cura_ferite
    nome: Cura ferite
    tipo: incantesimo
    livello: {chierico: 1}
    bersaglio: uno
    parole: [cura ferite, curo]
    effetti: [{tipo: cura, dadi: "1d6+1"}]
  - id: fasciare
    nome: Fasciare le ferite
    tipo: azione
    bersaglio: uno
    parole: [fascio, fasciare, bendo]
    effetti: [{tipo: stabilizza}]
  # Turn Undead: the cleric's d20 against the class table (`classi.chierico.tabelle.scacciare`), by the target's column.
  - id: scacciare
    nome: Scacciare i morti
    tipo: azione
    bersaglio: nemici
    solo_tipi: [non_morto]
    ostile: true
    parole: [scaccio, scacciare, simbolo sacro]
    tabella:
      dado: "1d20"
      colonne:
        - {id: scheletro, nome: Scheletro, dadi_vita: 1}
        - {id: putrido, nome: Putrido, dadi_vita: 2}
        - {id: spettro, nome: Spettro, dadi_vita: 4}
      colpiti: "2d6"
      distrugge: {dadi: "1d8", per_livello: true}
      dopo_fallimento: {turni: 1}
    effetti: [{tipo: condizione, condizione: scacciato, durata: {turni: "2d4"}}]

combattimento:
  iniziativa: {tipo: individuale, dado: 6, caratteristica: destrezza, ogni_round: true, pari: simultanei}
  fasi:
    - {id: turno, nome: Turno, png: attacco}
  azioni:
    - {id: attacco, nome: Attacco, quante: "uno, oppure un incantesimo"}
  danni:
    modello: pf
    a_zero: {pg: tiri_morte, png: morte}
    tiri_morte: {cd: 10, successi: 1, fallimenti: 1, venti_rialza: false, uno_doppio: false, abilita: ts_morte, finestra: "2d10", perde_incantesimi: true}
  condizioni:
    - {id: sorpreso, nome: Sorpreso, icona: SO, effetti: [perde_turno, non_si_muove], testo: Perde il primo round.}
    - {id: scacciato, nome: Scacciato, icona: SC, effetti: [perde_turno, fuori_combattimento], testo: Fugge dal chierico e non torna per un po'.}
    - {id: svenuto, nome: Svenuto, icona: SV, effetti: [perde_turno, non_si_muove, attacchi_contro_vantaggio], testo: A terra senza sensi.}
  condizione_a_zero: svenuto
  sorpresa: {dado: 6, fino_a: 2, condizione: sorpreso}
  fine: {morale: true}

parole_chiave:
  origliare: [ascolto, origlio, orecchio]
  trappole: [trappola, trappole]
  sgattaiolare: [sgattaiolo, quatta, silenziosa]
  borseggiare: [borseggio, sfilo]
