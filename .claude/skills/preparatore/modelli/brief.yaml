# Brief di una campagna. Copialo in campagne/<id>/brief.yaml e riempilo.
# Ciò che Riccardo non dice lo decidi tu, e lo scrivi in `decisioni` con il motivo.

id: ""                 # ascii minuscolo con trattini, es. il-ponte-dei-sospiri
titolo: ""
richiesta: ""          # le parole di Riccardo, così come le ha scritte
manuale: ""            # facoltativo: manuali/<file>.pdf|.md|.txt (vedi manuali/README.md). Vuoto = SRD 5.2.
                       # Con un manuale si scrive il set di regole in campagne/<id>/regole/ (SKILL, passo 1b).

tono: ""               # es. «fiaba di paese, cupa ma calda»
sessioni: 1            # OBBLIGATORIO: quante sessioni dura, o "aperta" per una campagna senza fine.
                       # Decide il livello e quindi quanti strati si preparano (strumenti/strati.py):
                       # 1 one-shot, 2–6 arco, 7–20 campagna, 21+ o "aperta" saga. Oggi si gioca la one-shot.
ore_per_sessione: 2.5  # facoltativo, predefinito 2.5; sotto un'ora la one-shot ha una scena sola
# livello: arco        # facoltativo: forza un livello diverso da quello delle sessioni, solo col motivo in decisioni.altre
durata: ""             # nota a parole per Riccardo, es. «una serata, tre scene» (il numero sta in sessioni)
giocatori: 3           # quanti giocano (o «3-4»); i PG pregenerati sono uno più del massimo
dadi: true            # predefinito: schede e prove (docs/prove.md). false solo se Riccardo chiede una campagna
                       # senza dadi: allora in campagna.yaml → regole: {dadi: false}
temi: []               # es. [paura del forestiero, la verità che costa]
linee: []              # mai in gioco
veli: []               # solo fuori scena, con dissolvenza
ambientazione: ""      # facoltativo: luogo, epoca, sapore (fantasy compatibile SRD)
vincoli: []            # es. «niente combattimento»

decisioni:
  scene: []            # [id_scena, …]: la prima è scena.yaml
  pg: []               # [pg_id, …]
  png: []              # [png_id → voce_id, …]; voci uguali o simili (simile_a in voci.yaml) mai nella stessa scena
  situazione: ""       # quattro frasi: chi vuole cosa; cosa succede se i PG non fanno niente; la verità; la scelta che costa
  strade: []           # la scelta finale, strada per strada (la terza via compresa), col prezzo e su chi pesa:
                       # - {strada: "…", prezzo: "…", pesa_su: [png_…]}   il prezzo pesa su chi NON lo vuole (SCELTA)
  altre: []            # ogni altra scelta, con il motivo
