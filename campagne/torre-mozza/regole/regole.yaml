      - {da: 16, valori: [9, 8, 7, 12, 9]}
      - {da: 18, valori: [9, 7, 6, 11, 9]}
      - {da: 20, valori: [8, 6, 5, 11, 8]}
    # p. 8.
    incantesimi_al_giorno:
      - {da: 1, slot: [1]}
      - {da: 2, slot: [2]}
      - {da: 3, slot: [2, 1]}
      - {da: 4, slot: [2, 2]}
      - {da: 5, slot: [2, 2, 1]}
      - {da: 6, slot: [3, 2, 2]}
      - {da: 7, slot: [3, 2, 2, 1]}
      - {da: 8, slot: [3, 3, 2, 2]}
      - {da: 9, slot: [3, 3, 2, 2, 1]}
      - {da: 10, slot: [4, 3, 3, 2, 2]}
      - {da: 11, slot: [4, 4, 3, 2, 2, 1]}
      - {da: 12, slot: [4, 4, 3, 3, 2, 2]}
      - {da: 13, slot: [4, 4, 4, 3, 2, 2]}
      - {da: 14, slot: [4, 4, 4, 3, 3, 2]}
