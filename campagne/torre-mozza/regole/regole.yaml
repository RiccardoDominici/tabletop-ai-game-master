# Set di regole ricavato da Basic Fantasy Role-Playing Game, 4ª edizione, release 142 (CC BY-SA 4.0).
# Le pagine citate sono quelle stampate nel manuale (pagina del PDF = pagina stampata + 4).
#
# Come il set traduce il manuale nello schema del Motore (docs/regole.md §2):
# - Risoluzione d20_cd: il manuale tira quasi tutto con il d20 contro un numero (attacchi contro la Classe
#   d'Armatura, tiri salvezza contro la tabella della classe, prove di caratteristica contro il «Target» della
#   regola facoltativa Ability Rolls, p. 189). Il «Target» al primo livello è 17: è la difficoltà normale.
# - Modificatore «tabella»: il manuale non usa (punteggio − 10) / 2 ma una tabella (3: −3; 4–5: −2; 6–8: −1;
#   9–12: 0; 13–15: +1; 16–17: +2; 18: +3, p. 4). Le schede scrivono il punteggio da 3 a 18, il Motore ne ricava
#   il bonus.
# - Percentuali (abilità del ladro, p. 9) e possibilità «x su 1d6» (porte, porte segrete, pietra, p. 43–44): si
#   tirano a parte (`soglia` dell'abilità), d100 o d6 sotto il valore della scheda, come nel manuale.
# - Tiri salvezza (p. 60–61): d20 ≥ numero della tabella della classe e del livello (`tiri_salvezza`, `classi`); la
#   scheda dice classe e livello (i mostri `salva_come`), il bonus di razza è un tratto (`razze`), il veleno somma la
#   Costituzione, il charme la Saggezza, le illusioni l'Intelligenza (p. 60). Il 20 naturale che riesce sempre e l'1 che
#   fallisce sempre valgono negli attacchi (`critico`, `disastro`, p. 53), senza raddoppiare il danno, e nei tiri
#   salvezza, «as with attack rolls» (p. 60): `critici: attacchi_e_salvezze`, coi cinque salvezza segnati
#   `salvezza: true`. Non nelle prove di caratteristica.
# - Bonus d'attacco (p. 53): un'abilità «mischia» (con la Forza) e una «distanza» (con la Destrezza); nella
#   scheda vale il bonus della tabella (+1 per tutte le classi al primo livello; per i mostri i dadi vita).
#   Il bonus di Forza al danno in mischia (p. 55) è scritto nella formula del danno dell'arma («1d8+2»).
# - Attacco da dietro (+2, non col colpo furtivo del ladro, p. 53) e carica (+2 e danno doppio, solo con lancia o arma
#   in asta, p. 52) sono `modificatori` del set: valgono per le parole dell'azione del PG (il Motore non conosce le
#   posizioni). La gittata (+1 corta, −2 lunga, p. 11 e 54) viene dal catalogo: le fasce di ogni arma, in metri, per la
#   distanza che il giocatore dice («a 20 metri») o le parole della fascia; oltre la lunga non si tira. Il rateo di fuoco
#   delle balestre è nel catalogo (`ricarica`); il −5 a chi tira a un nemico che gli sta addosso è un modificatore a parole,
#   accecato, invisibile, riparo e occultamento sono condizioni coi loro numeri (combattimento.condizioni). Resta fuori il
#   −2 alla Classe d'Armatura di chi carica. La sorpresa con 1d6 sì (combattimento.sorpresa).
# - Equipaggiamento (p. 10–12): monete, armi, armature, scudi, munizioni e attrezzatura sono nel catalogo (`monete`,
#   `catalogo`); le schede elencano ciò che portano e il Motore ne ricava la Classe d'Armatura e gli attacchi.
# - Incantesimi (p. 15–16): sono `poteri` del set, con gli effetti tipati; quanti al giorno lo dice la tabella della
#   classe (`classi[].incantesimi_al_giorno`, p. 7–8). Il mago prepara un incantesimo per ogni posto del giorno
#   (`magia: vanciana`): lanciato, se ne va fino al riposo, e il Motore lo conta (docs/regole.md §2).
id: basic-fantasy-r142
nome: "Basic Fantasy (4ª edizione)"
per_il_narratore: "Si tira un d20 e si somma un bonus: gli attacchi contro la Classe d'Armatura, tutto il resto contro diciassette al primo livello; a zero punti ferita si rischia la morte."
fonte:
  titolo: "Basic Fantasy Role-Playing Game, 4th Edition, Release 142"
  autore: "Chris Gonnerman e i collaboratori del Basic Fantasy Project"
  file: "manuali/basic-fantasy-rpg-r142.pdf"
licenza:
  nome: "CC-BY-SA-4.0"
  libera: true
  attribuzione: "Regole ricavate da Chris Gonnerman, Basic Fantasy RPG 4th Ed. r142, CC BY-SA 4.0 (basicfantasy.org); questo set derivato è condiviso con la stessa licenza."

risoluzione:
  tipo: d20_cd
  dado: 20
  # Negli attacchi il 20 naturale colpisce sempre, l'1 manca sempre (p. 53); nei tiri salvezza lo stesso (p. 60).
  critico: 20
  disastro: 1
  critici: attacchi_e_salvezze

# Le sei caratteristiche del manuale (p. 4). Nelle schede il punteggio da 3 a 18; il bonus da −3 a +3 lo dà la tabella.
caratteristiche:
  - {id: forza, nome: "Forza"}
  - {id: intelligenza, nome: "Intelligenza"}
  - {id: saggezza, nome: "Saggezza"}
  - {id: destrezza, nome: "Destrezza"}
  - {id: costituzione, nome: "Costituzione"}
  - {id: carisma, nome: "Carisma"}

modificatore:
  tipo: tabella
  # Punteggio → bonus (p. 4): ogni riga vale dal suo «da» in su.
  tabella:
    - {da: 3, mod: -3}
    - {da: 4, mod: -2}
    - {da: 6, mod: -1}
    - {da: 9, mod: 0}
    - {da: 13, mod: 1}
    - {da: 16, mod: 2}
    - {da: 18, mod: 3}

abilita:
  # Bonus d'attacco della tabella (p. 53): Forza in mischia, Destrezza con le armi da lancio e da tiro.
  - {id: mischia, nome: "Attacco in mischia", caratteristica: forza}
  - {id: distanza, nome: "Attacco a distanza", caratteristica: destrezza}
  # Attacco furtivo del ladro (p. 9): +4 al tiro e danno doppio, non due volte contro lo stesso avversario nello stesso
  # scontro. Il +4 è nel bonus della scheda; il danno doppio è dell'abilità (il tiro dell'arma per due); dopo il primo,
  # contro quel bersaglio si attacca in mischia normale (`ripiego`).
  - {id: alle_spalle, nome: "Attacco furtivo", caratteristica: forza, danno: doppio, una_volta_per_bersaglio: true, ripiego: mischia}
  # I cinque tiri salvezza (p. 60–61): il numero da fare è quello della tabella della classe e del livello (colonna in
  # `salvezza`), il bonus di razza un tratto (`razze`).
  - {id: ts_morte, nome: "Tiro salvezza contro raggio della morte o veleno", caratteristica: null, salvezza: morte}
  # Lo stesso salvezza con la Destrezza, come il manuale lo chiede per fosse, cadute e inseguimenti (p. 43, 52).
  - {id: ts_morte_destrezza, nome: "Tiro salvezza contro raggio della morte, con la Destrezza", caratteristica: destrezza, salvezza: morte}
  - {id: ts_bacchette, nome: "Tiro salvezza contro bacchette magiche", caratteristica: null, salvezza: bacchette}
  - {id: ts_paralisi, nome: "Tiro salvezza contro paralisi o pietrificazione", caratteristica: null, salvezza: paralisi}
  - {id: ts_soffio, nome: "Tiro salvezza contro soffio del drago", caratteristica: null, salvezza: soffio}
  - {id: ts_incantesimi, nome: "Tiro salvezza contro incantesimi", caratteristica: null, salvezza: incantesimi}
  # Le eccezioni di p. 60: il veleno somma la Costituzione, il charme e il controllo della mente la Saggezza, le
  # illusioni (forza fantasmatica) l'Intelligenza.
  - {id: ts_veleno, nome: "Tiro salvezza contro veleno", caratteristica: costituzione, salvezza: morte}
  - {id: ts_charme, nome: "Tiro salvezza contro charme e controllo della mente", caratteristica: saggezza, salvezza: incantesimi}
  - {id: ts_illusioni, nome: "Tiro salvezza contro illusioni", caratteristica: intelligenza, salvezza: incantesimi}
  # Abilità del ladro (p. 9), in percentuale come nel manuale: d100 sotto il valore della tabella della classe. Chi non
  # ce l'ha tira come una prova qualunque (d20 contro la difficoltà). Il master tira in segreto (p. 8–9) trovare e togliere
  # trappole e ascoltare (se fallisce non nota niente), muoversi in silenzio e nascondersi (il ladro crede di esserci
  # riuscito): il Motore tira coi suoi dadi, la carta resta al pannello. Borseggiare: col tiro oltre il doppio della
  # soglia, o 00, la vittima se ne accorge (p. 9).
  - {id: scassinare, nome: "Scassinare serrature", caratteristica: null, soglia: {dado: 100}}
  - {id: trappole, nome: "Trovare e togliere trappole", caratteristica: null, soglia: {dado: 100}, segreta: niente}
  - {id: borseggiare, nome: "Borseggiare", caratteristica: null, soglia: {dado: 100, grave: {oltre_volte: 2, col_massimo: true, nome: "la vittima, o chi guarda, se ne accorge"}}}
  - {id: muoversi_in_silenzio, nome: "Muoversi in silenzio", caratteristica: null, soglia: {dado: 100}, segreta: riuscita}
  - {id: scalare, nome: "Scalare pareti", caratteristica: null, soglia: {dado: 100}}
  - {id: nascondersi, nome: "Nascondersi", caratteristica: null, soglia: {dado: 100}, segreta: riuscita}
  - {id: ascoltare, nome: "Ascoltare", caratteristica: null, soglia: {dado: 100}, segreta: niente}
  # Possibilità «x su 6» (p. 43–44): d6 sotto il valore della scheda. Porte segrete e porte bloccate valgono
  # «1 su 6» per chi non ha di più; l'occhio per la pietra è solo dei nani.
  - {id: cercare, nome: "Cercare porte segrete e trappole", caratteristica: null, soglia: {dado: 6, predefinita: 1}}
  - {id: forzare, nome: "Forzare una porta bloccata", caratteristica: null, soglia: {dado: 6, predefinita: 1}}
  - {id: pietra, nome: "Occhio per la pietra (nani)", caratteristica: null, soglia: {dado: 6}}

# Difficoltà: il «Target» delle prove di caratteristica al primo livello è 17 (p. 189); il master può dare un
# bonus o una penalità. Facile = +4, difficile = −2, ardua = −4 (gli aggiustamenti che il manuale usa più spesso:
# alle spalle +2, cieco −4, colpo furtivo +4). I tiri salvezza si tirano al loro numero. Le abilità del ladro prendono
# punti percentuali (p. 8: «−20% per la parete viscida»): facile +20, difficile −20, ardua −40 (scelta del set).
difficolta:
  - {id: facile, nome: "Facile", valore: 13, percentuale: 20}
  - {id: normale, nome: "Normale", valore: 17}
  - {id: difficile, nome: "Difficile", valore: 19, percentuale: -20}
  - {id: ardua, nome: "Ardua", valore: 21, percentuale: -40}
difficolta_predefinita: normale

# Il manuale non ha il vantaggio: ha bonus e penalità di situazione, il più comune è ±2. Da dietro, carica e gittata
# sono i `modificatori` qui sopra (non si sommano al vantaggio dell'arbitro per la stessa azione); il ±2 resta per il resto.
vantaggio:
  tipo: bonus
  valore: 2

# Modificatori di situazione degli attacchi (A17): parole dell'azione del PG, tipo d'attacco, arma.
modificatori:
  - {id: da_dietro, nome: "Attacco da dietro", bonus: 2, parole: [alle spalle, da dietro, di spalle], non_con: [alle_spalle]}
  - {id: carica, nome: "Carica", bonus: 2, attacchi: mischia, parole: [carico, carichiamo, alla carica], armi: [lancia, picca, alabarda, asta], danno: doppio}
  # Tirare a un nemico che ci sta addosso (p. 54): −5, per le parole dell'azione (il Motore non conosce le posizioni).
  - {id: nemico_addosso, nome: "Nemico addosso", bonus: -5, attacchi: distanza, parole: [a bruciapelo, mi sta addosso, ce l'ho addosso]}
  # La gittata (+1 corta, −2 lunga, p. 11 e 54) non è più un modificatore a parole: la danno le fasce del catalogo
  # (catalogo.gittate) per la distanza detta o le sue parole, con i limiti di ogni arma; oltre la lunga non si tira.

# Si colpisce con d20 + bonus contro la Classe d'Armatura (p. 53); l'armatura non riduce il danno.
attacchi:
  tipo: prova
  armatura_riduce: false
  # Il 20 naturale colpisce ma non raddoppia il danno; un colpo fa sempre almeno un punto (p. 55).
  danno_critico: normale
  danno_minimo: 1

# Tiri salvezza (p. 60–61): le cinque categorie del manuale, nell'ordine delle sue tabelle.
tiri_salvezza:
  colonne:
    - {id: morte, nome: "Raggio della morte o veleno"}
    - {id: bacchette, nome: "Bacchette magiche"}
    - {id: paralisi, nome: "Paralisi o pietrificazione"}
    - {id: soffio, nome: "Soffio del drago"}
    - {id: incantesimi, nome: "Incantesimi"}

# Progressione (p. 3–4, 49, 53): il bonus d'attacco della tabella della classe va all'attacco in mischia, a distanza e,
# per il ladro, a quello furtivo (+4 in più, p. 9); ogni dado vita somma la Costituzione e dà almeno un punto (p. 4); da un'avventura non
# si sale più di un livello: i PX si fermano uno prima del livello dopo il prossimo (p. 49).
progressione:
  attacco: [mischia, distanza, {abilita: alle_spalle, piu: 4, classi: [ladro]}]
  punti_ferita: {caratteristica: costituzione, minimo: 1}
  un_livello_per_avventura: true

# Classi (p. 7–8, 61): i tiri salvezza per livello (p. 61: una riga vale dal suo livello in su; NM, «normal man», è il
# livello 0 del guerriero, per la gente comune) e gli incantesimi al giorno per livello d'incantesimo (1°…6°, p. 7–8).
classi:
  - id: guerriero
    nome: "Guerriero"
    # PX per arrivare a ogni livello, dal 1° al 20° (p. 7).
    px: [0, 2000, 4000, 8000, 16000, 32000, 64000, 120000, 240000, 360000, 480000, 600000, 720000, 840000, 960000, 1080000, 1200000, 1320000, 1440000, 1560000]
    # Dadi vita (p. 7): un dado a livello fino al 9°, poi punti fissi senza Costituzione.
    dadi_vita:
      - {da: 1, dado: "1d8"}
      - {da: 10, fissi: 2}
    # Bonus d'attacco (p. 53).
    attacco:
      - {da: 0, bonus: 0}
      - {da: 1, bonus: 1}
      - {da: 2, bonus: 2}
      - {da: 4, bonus: 3}
      - {da: 5, bonus: 4}
      - {da: 7, bonus: 5}
      - {da: 8, bonus: 6}
      - {da: 11, bonus: 7}
      - {da: 13, bonus: 8}
      - {da: 16, bonus: 9}
      - {da: 18, bonus: 10}
    tiri_salvezza:
      - {da: 0, valori: [13, 14, 15, 16, 18]}
      - {da: 1, valori: [12, 13, 14, 15, 17]}
      - {da: 2, valori: [11, 12, 14, 15, 16]}
      - {da: 4, valori: [11, 11, 13, 14, 15]}
      - {da: 6, valori: [10, 11, 12, 14, 15]}
      - {da: 8, valori: [9, 10, 12, 13, 14]}
      - {da: 10, valori: [9, 9, 11, 12, 13]}
      - {da: 12, valori: [8, 9, 10, 12, 13]}
      - {da: 14, valori: [7, 8, 10, 11, 12]}
      - {da: 16, valori: [7, 7, 9, 10, 11]}
      - {da: 18, valori: [6, 7, 8, 10, 11]}
      - {da: 20, valori: [5, 6, 8, 9, 10]}
  - id: chierico
    nome: "Chierico"
    # PX per arrivare a ogni livello, dal 1° al 20° (p. 7).
    px: [0, 1500, 3000, 6000, 12000, 24000, 48000, 90000, 180000, 270000, 360000, 450000, 540000, 630000, 720000, 810000, 900000, 990000, 1080000, 1170000]
    # Dadi vita (p. 7): un dado a livello fino al 9°, poi punti fissi senza Costituzione.
    dadi_vita:
      - {da: 1, dado: "1d6"}
      - {da: 10, fissi: 1}
    # Bonus d'attacco (p. 53).
    attacco:
      - {da: 1, bonus: 1}
      - {da: 3, bonus: 2}
      - {da: 5, bonus: 3}
      - {da: 7, bonus: 4}
      - {da: 9, bonus: 5}
      - {da: 12, bonus: 6}
      - {da: 15, bonus: 7}
      - {da: 18, bonus: 8}
    # Chierici contro non morti (p. 57): il d20 da fare per livello e tipo, T scacciato senza tiro, D danneggiato,
    # null = impossibile («No»). Colonne: scheletro, zombi, ghoul, wight, wraith, mummia, spettro, vampiro, fantasma.
    tabelle:
      scacciare_non_morti:
        - {da: 1, valori: [13, 17, 19, null, null, null, null, null, null]}
        - {da: 2, valori: [11, 15, 18, 20, null, null, null, null, null]}
        - {da: 3, valori: [9, 13, 17, 19, null, null, null, null, null]}
        - {da: 4, valori: [7, 11, 15, 18, 20, null, null, null, null]}
        - {da: 5, valori: [5, 9, 13, 17, 19, null, null, null, null]}
        - {da: 6, valori: [3, 7, 11, 15, 18, 20, null, null, null]}
        - {da: 7, valori: [2, 5, 9, 13, 17, 19, null, null, null]}
        - {da: 8, valori: [T, 3, 7, 11, 15, 18, 20, null, null]}
        - {da: 9, valori: [T, 2, 5, 9, 13, 17, 19, null, null]}
        - {da: 10, valori: [T, T, 3, 7, 11, 15, 18, 20, null]}
        - {da: 11, valori: [D, T, 2, 5, 9, 13, 17, 19, null]}
        - {da: 12, valori: [D, T, T, 3, 7, 11, 15, 18, 20]}
        - {da: 13, valori: [D, D, T, 2, 5, 9, 13, 17, 19]}
        - {da: 14, valori: [D, D, T, T, 3, 7, 11, 15, 18]}
        - {da: 15, valori: [D, D, D, T, 2, 5, 9, 13, 17]}
        - {da: 16, valori: [D, D, D, T, T, 3, 7, 11, 15]}
        - {da: 17, valori: [D, D, D, D, T, 2, 5, 9, 13]}
        - {da: 18, valori: [D, D, D, D, T, T, 3, 7, 11]}
        - {da: 19, valori: [D, D, D, D, D, T, 2, 5, 9]}
        - {da: 20, valori: [D, D, D, D, D, T, T, 3, 7]}
    tiri_salvezza:
      - {da: 1, valori: [11, 12, 14, 16, 15]}
      - {da: 2, valori: [10, 11, 13, 15, 14]}
      - {da: 4, valori: [9, 10, 13, 15, 14]}
      - {da: 6, valori: [9, 10, 12, 14, 13]}
      - {da: 8, valori: [8, 9, 12, 14, 13]}
      - {da: 10, valori: [8, 9, 11, 13, 12]}
      - {da: 12, valori: [7, 8, 11, 13, 12]}
      - {da: 14, valori: [7, 8, 10, 12, 11]}
      - {da: 16, valori: [6, 7, 10, 12, 11]}
      - {da: 18, valori: [6, 7, 9, 11, 10]}
      - {da: 20, valori: [5, 6, 9, 11, 10]}
    # p. 7: niente al 1° livello.
    incantesimi_al_giorno:
      - {da: 1, slot: []}
      - {da: 2, slot: [1]}
      - {da: 3, slot: [2]}
      - {da: 4, slot: [2, 1]}
      - {da: 5, slot: [2, 2]}
      - {da: 6, slot: [2, 2, 1]}
      - {da: 7, slot: [3, 2, 2]}
      - {da: 8, slot: [3, 2, 2, 1]}
      - {da: 9, slot: [3, 3, 2, 2]}
      - {da: 10, slot: [3, 3, 2, 2, 1]}
      - {da: 11, slot: [4, 3, 3, 2, 2]}
      - {da: 12, slot: [4, 4, 3, 2, 2, 1]}
      - {da: 13, slot: [4, 4, 3, 3, 2, 2]}
      - {da: 14, slot: [4, 4, 4, 3, 2, 2]}
      - {da: 15, slot: [4, 4, 4, 3, 3, 2]}
      - {da: 16, slot: [5, 4, 4, 3, 3, 2]}
      - {da: 17, slot: [5, 5, 4, 3, 3, 2]}
      - {da: 18, slot: [5, 5, 4, 4, 3, 3]}
      - {da: 19, slot: [6, 5, 4, 4, 3, 3]}
      - {da: 20, slot: [6, 5, 5, 4, 3, 3]}
  - id: mago
    nome: "Mago"
    # PX per arrivare a ogni livello, dal 1° al 20° (p. 8).
    px: [0, 2500, 5000, 10000, 20000, 40000, 80000, 150000, 300000, 450000, 600000, 750000, 900000, 1050000, 1200000, 1350000, 1500000, 1650000, 1800000, 1950000]
    # Dadi vita (p. 8): un dado a livello fino al 9°, poi punti fissi senza Costituzione.
    dadi_vita:
      - {da: 1, dado: "1d4"}
      - {da: 10, fissi: 1}
    # Bonus d'attacco (p. 53).
    attacco:
      - {da: 1, bonus: 1}
      - {da: 4, bonus: 2}
      - {da: 6, bonus: 3}
      - {da: 9, bonus: 4}
      - {da: 13, bonus: 5}
      - {da: 16, bonus: 6}
      - {da: 19, bonus: 7}
    tiri_salvezza:
      - {da: 1, valori: [13, 14, 13, 16, 15]}
      - {da: 2, valori: [13, 14, 13, 15, 14]}
      - {da: 4, valori: [12, 13, 12, 15, 13]}
      - {da: 6, valori: [12, 12, 11, 14, 13]}
      - {da: 8, valori: [11, 11, 10, 14, 12]}
      - {da: 10, valori: [11, 10, 9, 13, 11]}
