combattimento:
  # Iniziativa (p. 51): ogni round 1d6 più la Destrezza, per ogni personaggio e mostro; chi fa di più agisce prima,
  # i pari agiscono insieme («act simultaneously»). Il Motore la ritira a ogni round (`ogni_round`); coi pari
  # simultanei (`pari: simultanei`) i PG pari hanno una finestra sola, i PNG pari agiscono subito dopo, e uno che i PG
  # hanno abbattuto in quel momento colpisce lo stesso.
  iniziativa: {tipo: individuale, dado: 6, caratteristica: destrezza, ogni_round: true, pari: simultanei}
  # Il round del manuale non ha fasi: al suo numero d'iniziativa ognuno si muove e poi attacca (p. 51).
  fasi:
    - {id: turno, nome: "Turno: movimento e attacco", png: attacco}
  azioni:
    - {id: movimento, nome: "Movimento", quante: "fino al movimento d'incontro, prima di attaccare"}
    - {id: attacco, nome: "Attacco", quante: "uno, oppure un incantesimo, una pozione, una corsa"}
  danni:
    modello: pf
    # Regola base: a zero punti ferita si muore (p. 55). Per i PG la regola facoltativa «Save vs. Death» (p. 188):
    # un tiro salvezza contro raggio della morte, il suo (`abilita: ts_morte`: il numero della tabella della classe,
    # con la razza); fallito, muore; riuscito, resta vivo e svenuto per 2d10 round (`finestra`) e muore se nessuno gli
    # fascia le ferite (il potere `fasciare`) o lo cura in quel tempo. Un incantatore che sopravvive perde gli
    # incantesimi preparati (p. 189). Il 20 che rimette in piedi con un punto e l'1 che conta doppio sono dell'SRD, non
    # del manuale: spenti. `cd` resta per chi non ha il salvezza nella scheda.
    a_zero: {pg: tiri_morte, png: morte}
    tiri_morte: {cd: 10, successi: 1, fallimenti: 1, venti_rialza: false, uno_doppio: false, abilita: ts_morte, finestra: "2d10", perde_incantesimi: true}
  condizioni:
    - {id: sorpreso, nome: "Sorpreso", icona: "SO", effetti: [perde_turno, non_si_muove], testo: "Per un round non si muove e non attacca, ma si difende."}
    # −4 del manuale ai tiri e alla Classe d'Armatura: gli effetti del Motore valgono ±2 (il vantaggio del set).
    - {id: accecato, nome: "Accecato", icona: "AC", effetti: [svantaggio_attacchi, attacchi_contro_vantaggio], testo: "Colpisce peggio ed è più facile da colpire."}
    - {id: trattenuto, nome: "Trattenuto", icona: "TR", effetti: [non_si_muove, attacchi_contro_vantaggio], testo: "Afferrato: non si muove ed è più facile da colpire."}
    - {id: svenuto, nome: "Svenuto", icona: "SV", effetti: [perde_turno, non_si_muove, attacchi_contro_vantaggio], testo: "A terra senza sensi, finché qualcuno non gli fascia le ferite."}
    # Le condizioni degli incantesimi (p. 18, 25, 36): chi dorme, è incantato o paralizzato conta come caduto per il
    # morale (p. 57) e non agisce; chi dorme si colpisce sempre (p. 36).
    - {id: addormentato, nome: "Addormentato", icona: "ZZ", effetti: [perde_turno, non_si_muove, fuori_combattimento, colpito_automaticamente], testo: "Dorme per magia: si colpisce sempre, e un colpo lo sveglia."}
    - {id: affascinato, nome: "Affascinato", icona: "AF", effetti: [fuori_combattimento], testo: "Vede in chi l'ha incantato un caro amico e non lo combatte."}
