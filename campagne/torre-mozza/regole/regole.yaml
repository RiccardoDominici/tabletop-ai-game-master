cadute: {dadi: "1d6", ogni: 3, unita: "metri", arrotonda: vicino, massimo: 20}

# Riposo (p. 59): un punto ferita per ogni giorno con il sonno normale; chi sta a letto tutto il giorno ne recupera uno
# in più ogni sera. Il master lo dà dal pannello (docs/prove.md §10).
riposo:
  - {id: notte, nome: "Una notte di sonno", cura: 1}
  - {id: a_letto, nome: "Un giorno di riposo a letto", cura: 2}

danni:
  nome: "Punti ferita"
  a_zero: "A zero punti ferita un personaggio muore; con la regola facoltativa del manuale un PG tira un salvezza contro la morte e, se riesce, resta svenuto finché qualcuno non gli fascia le ferite"

# Reazione dei mostri (p. 50): il manuale tira 2d6 + Carisma (8–11 favorevole, 12+ molto favorevole). Lo schema ha
# una sola risoluzione, quindi si convince con una prova di Carisma: facile (13) vale circa il «favorevole» del 2d6
# (40% contro 42%), normale (17) il «molto favorevole».
sociale:
  caratteristica: carisma
  nota: "Per convincere, trattare o spaventare un PNG si tira Carisma: facile se il PNG è disposto a trattare o gli si offre qualcosa che vuole, normale se è diffidente, difficile o ardua se è ostile. È la reazione del manuale (2d6 più Carisma) portata sul d20."

condizioni:
  - {id: sorpreso, nome: "Sorpreso", effetto: "Per un round non si muove e non attacca, ma si difende (p. 50)."}
  - {id: accecato, nome: "Accecato", effetto: "−4 ai tiri per colpire e alla Classe d'Armatura, −2 all'iniziativa (p. 59)."}
  - {id: trattenuto, nome: "Trattenuto", effetto: "Afferrato in una lotta: non si muove, −4 alla Classe d'Armatura contro gli altri (p. 56)."}
  - {id: svenuto, nome: "Svenuto", effetto: "A terra senza sensi: non si muove, non combatte, non lancia incantesimi."}
  - {id: addormentato, nome: "Addormentato", effetto: "Dorme per magia: si colpisce sempre, e un colpo lo sveglia (p. 36)."}
  - {id: affascinato, nome: "Affascinato", effetto: "Vede in chi l'ha incantato un caro amico (p. 18)."}
  - {id: paralizzato, nome: "Paralizzato", effetto: "Cosciente ma immobile: non si muove, non agisce, non parla (p. 25)."}

sottosistemi:
  - id: incantesimi
    nome: "Incantesimi"
    testo: "Il mago di primo livello conosce leggere il magico e un incantesimo di primo livello, e ne lancia uno al giorno: il Motore conta gli incantesimi preparati e i posti del giorno, e li ridà col riposo. Il chierico lancia incantesimi solo dal secondo livello."
  - id: scacciare
    nome: "Scacciare i non morti"
    testo: "Il chierico mostra il simbolo sacro e tira un d20 contro la tabella del suo livello e del tipo di non morto: al primo livello 13 per gli scheletri, 17 per gli zombi, 19 per i ghoul (p. 57)."
  - id: sorpresa
    nome: "Sorpresa"
    testo: "Prima di uno scontro si tira 1d6 per ogni parte che può essere sorpresa: con 1–2 è sorpresa e perde il primo round (p. 50). Il Motore tira per la parte attaccata quando lo scontro si apre con un attacco, per tutte e due quando lo apre il master."
  - id: cadute
    nome: "Cadute e fosse"
    testo: "Si prende 1d6 di danno ogni tre metri di caduta, arrotondando: già da un metro e mezzo si prende 1d6. Per non cadere in una fossa coperta si tira salvezza contro raggio della morte con la Destrezza (p. 43, 59)."
  - id: guarigione
    nome: "Guarigione"
    testo: "Si recupera un punto ferita per ogni notte di sonno (p. 59). A zero punti ferita si tira il salvezza contro la morte: riuscito, si resta svenuti e si muore entro 2d10 round se nessuno fascia le ferite. Chi è stato fasciato a zero punti ferita non combatte finché non torna sopra zero (p. 188)."

