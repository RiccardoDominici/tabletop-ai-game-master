  # Web (Magic-User 2, p. 40): range 10' per level, 2 turns/level. Up to 8,000 cubic feet of sticky webbing; failed save vs Death Ray traps, success halves movement. Fire burns a 10' cube per round, 2d4 to creatures inside.
  - id: ragnatela
    nome: "Ragnatela"
    tipo: incantesimo
    livello: {mago: 2}
    bersaglio: nemici
    parole: ["creo una ragnatela", "ragnatela"]
    descrittivo: true
    pagina: 40

  # Wizard Lock (Magic-User 2, p. 41): range 20', permanent. Holds shut a door, gate, window or shutter of wood, metal or stone as if locked. Knock opens it without ending the spell; dispel magic ends it.
  - id: serratura_magica
    nome: "Serratura magica"
    tipo: incantesimo
    livello: {mago: 2}
    bersaglio: uno
    parole: ["chiudo a chiave", "serratura magica"]
    descrittivo: true
    pagina: 41
  # Fasciare le ferite (p. 188): chi è a terra e sta morendo, fasciato in tempo, è stabile a zero punti ferita; finché
  # non torna sopra zero non si muove più di qualche passo, non combatte e non lancia incantesimi. Lo fa chiunque.
  - id: fasciare
    nome: "Fasciare le ferite"
    tipo: azione
    bersaglio: uno
    parole: [fascio, fasciare, bendo, benda, tampono]
    effetti: [{tipo: stabilizza}]
    pagina: 188
  # Scacciare i non morti (p. 57–58): il giocatore tira 1d20 contro la tabella del livello del chierico e del tipo di non
  # morto (classi.chierico.tabelle); T scacciato senza tiro, D danneggiato (1d8 per livello del chierico, un tiro per
  # tutti: chi va a zero è distrutto, gli altri sono scacciati). Riuscito, 2d6 dadi vita di non morti, dal più debole,
  # almeno uno; gli scacciati fuggono e stanno lontani 2d4 turni. Fallito (anche in parte), niente per un turno intero.
  - id: scacciare_non_morti
    nome: "Scacciare i non morti"
    tipo: azione
    bersaglio: nemici
    solo_tipi: [non_morto]
    ostile: true
    parole: [scaccio, scacciare, scacciarli, "simbolo sacro"]
    tabella:
      dado: "1d20"
      colonne:
        - {id: scheletro, nome: "Scheletro", dadi_vita: 1}
        - {id: zombi, nome: "Zombi", dadi_vita: 2}
        - {id: ghoul, nome: "Ghoul", dadi_vita: 3}
        - {id: wight, nome: "Wight", dadi_vita: 4}
        - {id: wraith, nome: "Wraith", dadi_vita: 5}
        - {id: mummia, nome: "Mummia", dadi_vita: 6}
        - {id: spettro, nome: "Spettro", dadi_vita: 7}
        - {id: vampiro, nome: "Vampiro", dadi_vita: 8}
        - {id: fantasma, nome: "Fantasma", dadi_vita: 9}
      colpiti: "2d6"
      distrugge: {dadi: "1d8", per_livello: true}
      dopo_fallimento: {turno: 1}
    effetti: [{tipo: condizione, condizione: scacciato, durata: {turno: "2d4"}}]
    pagina: 57

# Cadute (p. 59): 1d6 ogni 10 piedi (3 metri), al massimo 20d6, arrotondando all'altezza più vicina (da 1–4 piedi
# niente, da 5–14 piedi 1d6: in metri, da un metro e mezzo si prende 1d6). Le altezze delle scene sono in metri.
cadute: {dadi: "1d6", ogni: 3, unita: "metri", arrotonda: vicino, massimo: 20}

# Riposo (p. 59): un punto ferita per ogni giorno con il sonno normale; chi sta a letto tutto il giorno ne recupera uno
# in più ogni sera. Il master lo dà dal pannello (docs/prove.md §10).
riposo:
  - {id: notte, nome: "Una notte di sonno", cura: 1, durata: {ora: 8}}
  - {id: a_letto, nome: "Un giorno di riposo a letto", cura: 2, durata: {giorno: 1}}

# Punti esperienza (p. 49): il valore di un mostro sconfitto per dadi vita (da: 0 = meno di 1), più `speciale` per ogni
# asterisco; oltre i 25 dadi vita, +750 e +25 per ogni dado in più.
esperienza:
  per_dadi_vita:
    - {da: 0, px: 10, speciale: 3}
    - {da: 1, px: 25, speciale: 12}
    - {da: 2, px: 75, speciale: 25}
    - {da: 3, px: 145, speciale: 30}
    - {da: 4, px: 240, speciale: 40}
    - {da: 5, px: 360, speciale: 45}
    - {da: 6, px: 500, speciale: 55}
    - {da: 7, px: 670, speciale: 65}
    - {da: 8, px: 875, speciale: 70}
    - {da: 9, px: 1075, speciale: 75}
    - {da: 10, px: 1300, speciale: 90}
    - {da: 11, px: 1575, speciale: 95}
    - {da: 12, px: 1875, speciale: 100}
    - {da: 13, px: 2175, speciale: 110}
    - {da: 14, px: 2500, speciale: 115}
    - {da: 15, px: 2850, speciale: 125}
    - {da: 16, px: 3250, speciale: 135}
    - {da: 17, px: 3600, speciale: 145}
    - {da: 18, px: 4000, speciale: 160}
    - {da: 19, px: 4500, speciale: 175}
    - {da: 20, px: 5250, speciale: 200}
    - {da: 21, px: 6000, speciale: 225}
    - {da: 22, px: 6750, speciale: 250}
    - {da: 23, px: 7500, speciale: 275}
    - {da: 24, px: 8250, speciale: 300}
    - {da: 25, px: 9000, speciale: 325}
  oltre: {px: 750, speciale: 25}
  # Regola facoltativa (p. 190), scelta del set come il salvezza contro la morte: 1 PX per moneta d'oro di tesoro, solo
  # quando torna al sicuro (il master lo dice dal pannello).
  tesoro: {px: 1, per: mo, quando: al_sicuro}

# Bestiario (p. 53–54, 62): i mostri tirano un d8 per dado vita (½ dado vita = 1d4 punti ferita) e hanno il bonus
# d'attacco della tabella dei mostri per dadi vita («Monster Attack Bonus», p. 53); più e meno non contano (3+2 e 3−1
# valgono 3) e «1−1» o meno vale «meno di uno» (+0, p. 54). Le voci del bestiario sono in regole/mostri.yaml.
bestiario:
  dado_vita: 8
  mezzo: "1d4"
  attacco:
    - {da: 0, bonus: 0}
    - {da: 1, bonus: 1}
    - {da: 2, bonus: 2}
    - {da: 3, bonus: 3}
    - {da: 4, bonus: 4}
    - {da: 5, bonus: 5}
    - {da: 6, bonus: 6}
    - {da: 7, bonus: 7}
    - {da: 8, bonus: 8}
    - {da: 10, bonus: 9}
    - {da: 12, bonus: 10}
    - {da: 14, bonus: 11}
    - {da: 16, bonus: 12}
    - {da: 20, bonus: 13}
    - {da: 24, bonus: 14}
    - {da: 28, bonus: 15}
    - {da: 32, bonus: 16}
  abilita: [mischia, distanza]
  uno_meno_meno_di_uno: true

# Tempo di gioco (p. 42): un turno è circa dieci minuti, un round dieci secondi (sessanta round fanno un turno).
# Esplorando, ogni giro di azioni del tavolo è un turno (il movimento e le ricerche si contano a turni, p. 42–44; le
# abilità del ladro chiedono un turno, p. 8); in combattimento ogni round è un round. Le torce bruciano 1d4+4 turni, la
# lanterna una fiasca d'olio in 18+1d6 (p. 12: catalogo, `luce`). La notte di sonno dura otto ore (sei di sonno, p. 59,
# più la veglia: scelta del set).
tempo:
  unita:
    - {id: round, nome: "Round", plurale: "round", secondi: 10}
    - {id: turno, nome: "Turno", plurale: "turni", secondi: 600}
    - {id: ora, nome: "Ora", plurale: "ore", secondi: 3600}
    - {id: giorno, nome: "Giorno", plurale: "giorni", secondi: 86400}
  round: round
  per_finestra: {turno: 1}
# Viaggio (p. 45): miglia al giorno = 0,6 × il movimento d'incontro in piedi (40' → 24 miglia), cioè 2 per ogni metro del
# movimento in metri del set; un giorno di viaggio è di otto ore; il gruppo va al passo del più lento; il terreno moltiplica.
viaggio:
  unita: miglia
  per_movimento: 2
  ore_al_giorno: 8
  terreni:
    - {id: giungla_montagna_palude, nome: "Giungla, montagna o palude", per: 0.333}
    - {id: deserto_bosco_colline, nome: "Deserto, bosco o colline", per: 0.667}
    - {id: pianura_sentiero, nome: "Pianura aperta o sentiero", per: 1}
    - {id: strada, nome: "Strada lastricata", per: 1.333}

# Monete (p. 10): 1 pp = 5 gp, 1 gp = 10 sp, 1 ep = 5 sp, 1 sp = 10 cp. Il valore è in rame (il taglio più piccolo vale 1).
# Peso: una moneta pesa 1/20 di libbra, quindi 20 monete = 1 unità di carico (1 libbra).
monete:
  base: mo
  prezzi: [mo, ma, mr]
  peso: {quante: 20, peso: 1}
  tagli:                                    # p. 10: 1 pp = 5 gp = 500 cp (qui in rame), 1 ep = 5 sp = 50 cp
    - {id: mp, nome: "Monete di platino", vale: 500}
    - {id: mo, nome: "Monete d'oro", vale: 100}
    - {id: me, nome: "Monete d'elettro", vale: 50}
    - {id: ma, nome: "Monete d'argento", vale: 10}
    - {id: mr, nome: "Monete di rame", vale: 1}

# Catalogo (p. 10–12). Conversioni: piedi × 0,3 = metri (50 piedi = 15 m); libbre come nel manuale; prezzi in mo (gp),
# ma (sp), mr (cp). Peso «*» = 0,1 libbre, «**» = 0 (si contano poco). Le gittate del manuale, in piedi, sono in metri.
catalogo:
  # Classe d'Armatura senza armatura: 11 (p. 11), più il bonus di Destrezza (p. 3).
  difesa: {senza_armatura: 11, caratteristica: destrezza}
  abilita: {mischia: mischia, distanza: distanza}
  # Il bonus di Forza si aggiunge al danno in mischia e a quello delle armi da lancio (p. 55).
  danno_caratteristica: forza
  # Gittate (p. 11): corta +1, media 0, lunga −2. Le distanze nel manuale sono in piedi (50/100/150 piedi = 15/30/45 m).
  gittate:
    unita: metri
    parole_unita: [metri, metro, m]
    fasce:
      - {id: corta, nome: "Gittata corta", bonus: 1, parole: [da vicino, a pochi passi, da pochi passi]}
      - {id: media, nome: "Gittata media", bonus: 0}
      - {id: lunga, nome: "Gittata lunga", bonus: -2, parole: [da lontano, da molto lontano, dalla distanza]}
    predefinita: media

  # Armi (p. 11). Taglia: S piccola, M media, L grande (le armi L si usano a due mani, p. 11). «mani: 2» = a due mani.
  # «proprieta»: taglio = da taglio, contundente = da botta, punta = da punta, argento = d'argento (contro i licantropi).
  armi:
    # Asce (p. 11).
    - {id: ascia_da_mano, nome: "Ascia da mano", danno: "1d6", taglia: S, peso: 5, costo: "4 mo", proprieta: [taglio], lancio: {gittate: [3, 6, 9], nome: "Ascia da mano lanciata"}}   # 10/20/30 piedi
    - {id: ascia_da_battaglia, nome: "Ascia da battaglia", danno: "1d8", taglia: M, peso: 7, costo: "7 mo", proprieta: [taglio]}
    - {id: grande_ascia, nome: "Grande ascia", danno: "1d10", taglia: L, mani: 2, peso: 15, costo: "14 mo", proprieta: [taglio]}
    # Archi (p. 11, gittate: arco corto 50/100/150 piedi, arco lungo 70/140/210 piedi).
    - {id: arco_corto, nome: "Arco corto", danno: "1d6", taglia: M, mani: 2, peso: 2, costo: "25 mo", gittate: [15, 30, 45], munizioni: [freccia_arco_corto, freccia_arco_corto_argento]}
    - {id: arco_lungo, nome: "Arco lungo", danno: "1d8", taglia: L, mani: 2, peso: 3, costo: "60 mo", gittate: [21, 42, 63], munizioni: [freccia_arco_lungo, freccia_arco_lungo_argento]}
    # Balestre (p. 11, gittate: leggera 60/120/180 piedi, pesante 80/160/240 piedi). Ricarica: spara ogni N round (p. 54).
    - {id: balestra_leggera, nome: "Balestra leggera", danno: "1d6", taglia: M, mani: 2, peso: 7, costo: "30 mo", gittate: [18, 36, 54], munizioni: [quadrello_leggero, quadrello_leggero_argento], ricarica: 2}
    - {id: balestra_pesante, nome: "Balestra pesante", danno: "1d8", taglia: L, mani: 2, peso: 14, costo: "50 mo", gittate: [24, 48, 72], munizioni: [quadrello_pesante, quadrello_pesante_argento], ricarica: 3}
    # Pugnali (p. 11, gittata come il pugnale: 10/20/30 piedi).
    - {id: pugnale, nome: "Pugnale", danno: "1d4", taglia: S, peso: 1, costo: "2 mo", proprieta: [taglio], lancio: {gittate: [3, 6, 9], nome: "Pugnale lanciato"}}
    - {id: pugnale_argento, nome: "Pugnale d'argento", danno: "1d4", taglia: S, peso: 1, costo: "25 mo", proprieta: [taglio, argento], lancio: {gittate: [3, 6, 9], nome: "Pugnale d'argento lanciato"}}
    # Spade (p. 11).
    - {id: spada_corta, nome: "Spada corta", danno: "1d6", taglia: S, peso: 3, costo: "6 mo", proprieta: [taglio]}
    - {id: spada_lunga, nome: "Spada lunga", danno: "1d8", taglia: M, peso: 4, costo: "10 mo", proprieta: [taglio]}   # Longsword/Scimitar
    - {id: spadone, nome: "Spadone", danno: "1d10", taglia: L, mani: 2, peso: 10, costo: "18 mo", proprieta: [taglio]}   # Two-Handed Sword
    # Martelli e mazze (p. 11).
    - {id: martello_da_guerra, nome: "Martello da guerra", danno: "1d6", taglia: S, peso: 6, costo: "4 mo", proprieta: [contundente], lancio: {gittate: [3, 6, 9], nome: "Martello da guerra lanciato"}}   # Warhammer, 10/20/30 piedi
    - {id: mazza, nome: "Mazza", danno: "1d8", taglia: M, peso: 10, costo: "6 mo", proprieta: [contundente]}
    - {id: maglio, nome: "Maglio", danno: "1d10", taglia: L, mani: 2, peso: 16, costo: "10 mo", proprieta: [contundente]}   # Maul
    # Altre armi (p. 11).
    - {id: randello, nome: "Randello", danno: "1d4", taglia: M, peso: 1, costo: "2 ma", proprieta: [contundente]}   # Club/Cudgel/Walking Staff
    - {id: bastone, nome: "Bastone", danno: "1d6", taglia: L, mani: 2, peso: 4, costo: "2 mo", proprieta: [contundente]}   # Quarterstaff
    - {id: arma_in_asta, nome: "Arma in asta", danno: "1d10", taglia: L, mani: 2, peso: 15, costo: "9 mo", proprieta: [punta]}   # Pole Arm
    # Fionda (p. 11): gittate 30/60/90 piedi; con la Forza si aggiunge il bonus al danno (p. 55). Il sasso è in munizioni.
    - {id: fionda, nome: "Fionda", danno: "1d4", taglia: S, peso: 0.1, costo: "1 mo", gittate: [9, 18, 27], munizioni: [proiettile, sasso], forza_al_danno: true, proprieta: [contundente]}
    # Lancia (p. 11): 1d6 a una mano, 1d8 a due mani; lanciata come le gittate di 10/20/30 piedi.
    - {id: lancia, nome: "Lancia", danno: "1d6", taglia: M, peso: 5, costo: "5 mo", proprieta: [punta], lancio: {gittate: [3, 6, 9]}, a_due_mani: {danno: "1d8", nome: "Lancia a due mani"}}

  # Armature (p. 11): CA 13, 15, 17. «categoria»: cuoio (ladro), metallo (non per il ladro).
  armature:
    - {id: cuoio, nome: "Armatura di cuoio", ca: 13, categoria: cuoio, peso: 15, costo: "20 mo"}   # Leather Armor
    - {id: cotta_di_maglia, nome: "Cotta di maglia", ca: 15, categoria: metallo, peso: 40, costo: "60 mo"}   # Chain Mail
    - {id: armatura_a_piastre, nome: "Armatura a piastre", ca: 17, categoria: metallo, peso: 50, costo: "300 mo"}   # Plate Mail

  # Scudo (p. 11): +1 alla CA.
  scudi:
    - {id: scudo, nome: "Scudo", bonus: 1, peso: 5, costo: "7 mo"}

  # Munizioni (p. 11): pesano 0,1 libbre l'una («*»). I prezzi sono per pezzo, come nel manuale.
  # Argento: frecce, quadrelli e pugnali d'argento contro i licantropi (p. 11, †).
  munizioni:
    - {id: freccia_arco_corto, nome: "Frecce per arco corto", danno: "1d6", peso: 0.1, costo: "1 ma"}
    - {id: freccia_arco_corto_argento, nome: "Frecce d'argento per arco corto", danno: "1d6", peso: 0.1, costo: "2 mo", proprieta: [argento]}
    - {id: freccia_arco_lungo, nome: "Frecce per arco lungo", danno: "1d8", peso: 0.1, costo: "2 ma"}
    - {id: freccia_arco_lungo_argento, nome: "Frecce d'argento per arco lungo", danno: "1d8", peso: 0.1, costo: "4 mo", proprieta: [argento]}
    - {id: quadrello_leggero, nome: "Quadrelli leggeri", danno: "1d6", peso: 0.1, costo: "2 ma"}
    - {id: quadrello_leggero_argento, nome: "Quadrelli leggeri d'argento", danno: "1d6", peso: 0.1, costo: "5 mo", proprieta: [argento]}
    - {id: quadrello_pesante, nome: "Quadrelli pesanti", danno: "1d8", peso: 0.1, costo: "4 ma"}
    - {id: quadrello_pesante_argento, nome: "Quadrelli pesanti d'argento", danno: "1d8", peso: 0.1, costo: "10 mo", proprieta: [argento]}
    - {id: proiettile, nome: "Proiettili per fionda", danno: "1d4", peso: 0.1, costo: "1 ma"}   # Bullet
    - {id: sasso, nome: "Sassi", danno: "1d3", peso: 0.1}   # Stone: il prezzo è n/a, quindi nessun costo

  # Attrezzatura (p. 10, 12): i 46 oggetti della lista di p. 10 nell'ordine del manuale. «confezione»: peso e costo
  # sono di tutta la confezione (p. 10). Contenitori: capienza in libbre (p. 12). Luce (p. 12): raggio 30 piedi = 9 m,
  # fioca 20 piedi = 6 m. Le candele non hanno «luce»: il manuale dà i turni per pollice d'altezza, non per candela.
  attrezzatura:
    # p. 10 (colonna sinistra), p. 12.
    - {id: zaino, nome: "Zaino", peso: 0.1, costo: "4 mo", capienza: 40}   # p. 12: 40 libbre; lo zaino dell'halfling ne regge 30
    - {id: borsa_da_cintura, nome: "Borsa da cintura", peso: 0.1, costo: "1 mo"}
    - {id: morso_e_briglie, nome: "Morso e briglie", peso: 3, costo: "15 ma"}
    - {id: candele, nome: "Candele", peso: 0.1, confezione: 12, costo: "1 mo"}   # p. 12: a candle lights 5' di raggio; non modellato
    - {id: gesso, nome: "Gesso", peso: 0.1, costo: "2 mo"}   # Chalk, piccolo sacchetto di pezzi; serve per segnare la strada
    - {id: mantello, nome: "Mantello", peso: 1, costo: "2 mo"}   # Cloak
    - {id: abiti_comuni, nome: "Abiti comuni", peso: 1, costo: "4 mo"}   # Clothing, common outfit
    - {id: bottiglia_di_vetro, nome: "Bottiglia o fiala di vetro", peso: 0.1, costo: "1 mo"}   # Glass bottle or vial
    - {id: rampino, nome: "Rampino", peso: 4, costo: "2 mo"}   # Grappling Hook
    - {id: simbolo_sacro, nome: "Simbolo sacro", peso: 0.1, costo: "25 mo"}   # Holy Symbol
    - {id: acqua_santa, nome: "Acqua santa", peso: 0.1, costo: "10 mo"}   # Holy Water, per fiala
    - {id: ferri_di_cavallo, nome: "Ferri di cavallo e ferratura", peso: 10, costo: "1 mo"}   # Horseshoes & shoeing
    - {id: inchiostro, nome: "Inchiostro", peso: 0.5, costo: "8 mo"}   # Ink, per vasetto (½ libbra)
    - {id: chiodi_di_ferro, nome: "Chiodi di ferro", confezione: 12, peso: 1, costo: "1 mo"}   # Iron Spikes, 12
    - {id: scala, nome: "Scala", peso: 20, costo: "1 mo"}   # Ladder, 10 piedi (3 m)
    # Lanterne (p. 12): luce 30 piedi = 9 m, fioca 20 piedi = 6 m. Una fiasca d'olio dura 18+1d6 turni.
    - {id: lanterna, nome: "Lanterna", peso: 2, costo: "5 mo", luce: {raggio: 9, fioca: 6, durata: "1d6+18", unita: turno, consuma: olio}}
    - {id: lanterna_a_fascio, nome: "Lanterna a fascio", peso: 3, costo: "14 mo", luce: {raggio: 9, fioca: 6, durata: "1d6+18", unita: turno, consuma: olio}}   # Bullseye: cono di 30 piedi, modellato come luce tonda
    - {id: lanterna_schermabile, nome: "Lanterna schermabile", peso: 2, costo: "8 mo", luce: {raggio: 9, fioca: 6, durata: "1d6+18", unita: turno, consuma: olio}}   # Hooded: si può schermare
    - {id: manette, nome: "Manette (senza lucchetto)", peso: 4, costo: "6 mo"}   # Manacles
    - {id: astuccio_per_mappe, nome: "Astuccio per mappe o pergamene", peso: 0.5, costo: "1 mo"}   # Map or scroll case
    - {id: specchio, nome: "Specchio piccolo di metallo", peso: 0.1, costo: "7 mo"}   # Mirror, small metal
    - {id: olio, nome: "Fiasca d'olio", peso: 1, costo: "1 mo"}   # Oil, per fiasca
    - {id: lucchetto, nome: "Lucchetto (con due chiavi)", peso: 1, costo: "12 mo"}   # Padlock
    - {id: carta, nome: "Carta", peso: 0, costo: "1 mo"}   # Paper, per foglio
    - {id: pertica, nome: "Pertica di legno", peso: 10, costo: "1 mo"}   # Pole, 10 piedi (3 m)
    - {id: penna, nome: "Penna d'oca", peso: 0, costo: "1 ma"}   # Quill
    - {id: coltellino, nome: "Coltellino per penne", peso: 0.1, costo: "1 mo"}   # Quill Knife
