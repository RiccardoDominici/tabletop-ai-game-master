    - {id: pony_da_guerra, nome: "Pony da guerra", peso: 0, costo: "80 mo", proprieta: [animale]}   # Pony, War

  # Restrizioni (p. 5–8 e 187): che cosa può usare ogni classe e razza, e la penalità se lo fa comunque.
  restrizioni:
    - {classe: mago, cosa: arma, ammessi: [pugnale, pugnale_argento, randello], penalita: {attacco: -5}, pagina: 187}
    - {classe: mago, cosa: armatura, ammessi: [], penalita: {senza_incantesimi: perso}, pagina: 187}
    - {classe: mago, cosa: scudo, ammessi: [], penalita: {senza_incantesimi: perso}, pagina: 8}
    - {classe: chierico, cosa: arma, ammessi_proprieta: [contundente], penalita: {perde_incantesimi: true}, pagina: 187}
    - {classe: ladro, cosa: armatura, ammessi_categorie: [cuoio], penalita: {senza_abilita: [scassinare, trappole, borseggiare, muoversi_in_silenzio, scalare, nascondersi, ascoltare, alle_spalle]}, pagina: 187}
    - {classe: ladro, cosa: scudo, ammessi: [], penalita: {senza_abilita: [scassinare, trappole, borseggiare, muoversi_in_silenzio, scalare, nascondersi, ascoltare, alle_spalle]}, pagina: 8}
    - {razza: nano, cosa: arma, vietati: [spadone, arma_in_asta, arco_lungo], penalita: {vietato: true}, pagina: 5}
    - {razza: halfling, cosa: arma, vietati_taglie: [L], penalita: {vietato: true}, pagina: 6}

# Carico (p. 42): leggero e pesante per punteggio di Forza; gli halfling hanno la loro tabella e la loro armatura pesa
# un quarto. Il peso delle monete è nel catalogo (monete.peso). Oltre il pesante non ci si muove.
carico:
  unita: libbre
  caratteristica: forza
  fasce: [{id: leggero, nome: "Carico leggero"}, {id: pesante, nome: "Carico pesante"}]
  limiti:                                   # Nano, elfo, umano (p. 42)
    - {da: 3, valori: [25, 60]}
    - {da: 4, valori: [35, 90]}
    - {da: 6, valori: [50, 120]}
    - {da: 9, valori: [60, 150]}
    - {da: 13, valori: [65, 165]}
    - {da: 16, valori: [70, 180]}
    - {da: 18, valori: [80, 195]}
  per_razza:
    halfling:                               # Halfling (p. 42)
      - {da: 3, valori: [20, 40]}
      - {da: 4, valori: [30, 60]}
      - {da: 6, valori: [40, 80]}
      - {da: 9, valori: [50, 100]}
      - {da: 13, valori: [55, 110]}
      - {da: 16, valori: [60, 120]}
      - {da: 18, valori: [65, 130]}
  peso_armatura: {halfling: 0.25}
# Movimento per round (p. 42), in metri come le gittate (piedi × 0,3: 40' = 12 m): senza armatura 40'/30', di cuoio
# 30'/20', di metallo 20'/10'. Esplorando, un turno copre tre volte il movimento del round. Le armature magiche (che
# usano la riga migliore) non ci sono ancora.
movimento:
  unita: metri
  per_turno: 3
  righe:
    - {armatura: nessuna, valori: [12, 9]}
    - {armatura: cuoio, valori: [9, 6]}
    - {armatura: metallo, valori: [6, 3]}

danni:
  nome: "Punti ferita"
  a_zero: "A zero punti ferita un personaggio muore; con la regola facoltativa del manuale un PG tira un salvezza contro la morte e, se riesce, resta svenuto finché qualcuno non gli fascia le ferite"

# Reazione dei mostri (p. 50): il manuale tira 2d6 + Carisma (8–11 favorevole, 12+ molto favorevole). Lo schema ha
# una sola risoluzione, quindi si convince con una prova di Carisma: facile (13) vale circa il «favorevole» del 2d6
# (40% contro 42%), normale (17) il «molto favorevole».
sociale:
  caratteristica: carisma
  nota: "Per convincere, trattare o spaventare un PNG si tira Carisma: facile se il PNG è disposto a trattare o gli si offre qualcosa che vuole, normale se è diffidente, difficile o ardua se è ostile. È la reazione del manuale (2d6 più Carisma) portata sul d20."

condizioni:
  - {id: sorpreso, nome: "Sorpreso", effetto: "Per un round non si muove e non attacca, ma si difende (p. 50)."}
  - {id: accecato, nome: "Accecato", effetto: "−4 ai tiri per colpire e alla Classe d'Armatura, −2 all'iniziativa (p. 59)."}
  - {id: trattenuto, nome: "Trattenuto", effetto: "Afferrato in una lotta: non si muove, −4 alla Classe d'Armatura contro gli altri (p. 56)."}
  - {id: svenuto, nome: "Svenuto", effetto: "A terra senza sensi: non si muove, non combatte, non lancia incantesimi."}
  - {id: addormentato, nome: "Addormentato", effetto: "Dorme per magia: si colpisce sempre, e un colpo lo sveglia (p. 36)."}
  - {id: affascinato, nome: "Affascinato", effetto: "Vede in chi l'ha incantato un caro amico (p. 18)."}
  - {id: paralizzato, nome: "Paralizzato", effetto: "Cosciente ma immobile: non si muove, non agisce, non parla (p. 25)."}
  - {id: scacciato, nome: "Scacciato", effetto: "Un non morto scacciato fugge dal chierico e non torna per 2d4 turni (p. 58)."}

sottosistemi:
  - id: incantesimi
    nome: "Incantesimi"
    testo: "Il mago di primo livello conosce leggere il magico e un incantesimo di primo livello, e ne lancia uno al giorno: il Motore conta gli incantesimi preparati e i posti del giorno, e li ridà col riposo. Il chierico lancia incantesimi solo dal secondo livello."
  - id: scacciare
    nome: "Scacciare i non morti"
    testo: "Il chierico mostra il simbolo sacro e tira un d20 contro la tabella del suo livello e del tipo di non morto: al primo livello 13 per gli scheletri, 17 per gli zombi, 19 per i ghoul (p. 57). Il Motore lo tira col potere «Scacciare i non morti»: i dadi vita scacciati, i distrutti, un turno di attesa dopo un fallimento."
  - id: sorpresa
    nome: "Sorpresa"
    testo: "Prima di uno scontro si tira 1d6 per ogni parte che può essere sorpresa: con 1–2 è sorpresa e perde il primo round (p. 50). Il Motore tira per la parte attaccata quando lo scontro si apre con un attacco, per tutte e due quando lo apre il master."
  - id: cadute
    nome: "Cadute e fosse"
    testo: "Si prende 1d6 di danno ogni tre metri di caduta, arrotondando: già da un metro e mezzo si prende 1d6. Per non cadere in una fossa coperta si tira salvezza contro raggio della morte con la Destrezza (p. 43, 59)."
  - id: guarigione
    nome: "Guarigione"
    testo: "Si recupera un punto ferita per ogni notte di sonno (p. 59). A zero punti ferita si tira il salvezza contro la morte: riuscito, si resta svenuti e si muore entro 2d10 round se nessuno fascia le ferite. Chi è stato fasciato a zero punti ferita non combatte finché non torna sopra zero (p. 188)."

parole_chiave:
  scassinare: [scassino, scassinare, grimaldello, grimaldelli, serratura, lucchetto]
  trappole: [trappola, trappole, disinnesco, disinnescare, tagliola]
  borseggiare: [borseggio, sfilo, sfilare, dalla tasca]
  muoversi_in_silenzio: [silenzio, silenziosa, silenzioso, furtiva, furtivo, quatta, quatto]
  scalare: [scalo, scalare, arrampico, arrampicarmi, la parete]
  nascondersi: [nascondo, nascondermi, acquatto, nell'ombra]
  ascoltare: [ascolto, ascoltare, origlio, tendo l'orecchio]
  cercare: [cerco, frugo, esamino, perquisisco, passaggio segreto]
  forzare: [forzo, sfondo, spallata, scardino]
  pietra: [muratura, malta, mattoni, pietre squadrate]
  ts_morte: [veleno, avvelenato]
  ts_morte_destrezza: [schivo, evito, balzo, aggrappo]
  carisma: [convinco, persuado, prometto, tratto, minaccio]

combattimento:
  # Iniziativa (p. 51): ogni round 1d6 più la Destrezza, per ogni personaggio e mostro; chi fa di più agisce prima,
  # i pari agiscono insieme («act simultaneously»). Il Motore la ritira a ogni round (`ogni_round`); coi pari
  # simultanei (`pari: simultanei`) i PG pari hanno una finestra sola, i PNG pari agiscono subito dopo, e uno che i PG
  # hanno abbattuto in quel momento colpisce lo stesso.
  iniziativa: {tipo: individuale, dado: 6, caratteristica: destrezza, ogni_round: true, pari: simultanei}
  # Il round del manuale non ha fasi: al suo numero d'iniziativa ognuno si muove e poi attacca (p. 51).
  fasi:
    - {id: turno, nome: "Turno: movimento e attacco", png: attacco}
  azioni:
    - {id: movimento, nome: "Movimento", quante: "fino al movimento d'incontro, prima di attaccare"}
    - {id: attacco, nome: "Attacco", quante: "uno, oppure un incantesimo, una pozione, una corsa"}
  danni:
    modello: pf
    # Regola base: a zero punti ferita si muore (p. 55). Per i PG la regola facoltativa «Save vs. Death» (p. 188):
    # un tiro salvezza contro raggio della morte, il suo (`abilita: ts_morte`: il numero della tabella della classe,
    # con la razza); fallito, muore; riuscito, resta vivo e svenuto per 2d10 round (`finestra`) e muore se nessuno gli
    # fascia le ferite (il potere `fasciare`) o lo cura in quel tempo. Un incantatore che sopravvive perde gli
    # incantesimi preparati (p. 189). Il 20 che rimette in piedi con un punto e l'1 che conta doppio sono dell'SRD, non
    # del manuale: spenti. `cd` resta per chi non ha il salvezza nella scheda.
    a_zero: {pg: tiri_morte, png: morte}
    tiri_morte: {cd: 10, successi: 1, fallimenti: 1, venti_rialza: false, uno_doppio: false, abilita: ts_morte, finestra: "2d10", perde_incantesimi: true}
  condizioni:
    - {id: sorpreso, nome: "Sorpreso", icona: "SO", effetti: [perde_turno, non_si_muove], testo: "Per un round non si muove e non attacca, ma si difende."}
    # Le condizioni coi numeri del manuale (p. 59): l'accecato −4 a colpire, +4 a chi lo colpisce (−4 alla Classe
    # d'Armatura), −2 all'iniziativa, sorpreso con 1–4; l'assordato −1 e sorpreso con 1–3; attaccare un invisibile −4,
    # che non si somma al −4 di chi è accecato (stesso gruppo «vista»).
    - {id: accecato, nome: "Accecato", icona: "AC", valori: {attacchi: -4, contro: 4, iniziativa: -2, sorpresa: 4}, gruppo: vista, testo: "Non vede: −4 a colpire, più facile da colpire, −2 all'iniziativa."}
    - {id: assordato, nome: "Assordato", icona: "AS", valori: {iniziativa: -1, sorpresa: 3}, testo: "Non sente: −1 all'iniziativa, si sorprende più facilmente."}
    - {id: invisibile, nome: "Invisibile", icona: "IN", valori: {contro: -4}, gruppo: vista, testo: "Non si vede: −4 a chi lo attacca."}
    # Trattenuto (p. 56): −4 alla Classe d'Armatura contro chi non lo trattiene; il Motore non sa chi lo tiene, vale per tutti.
    - {id: trattenuto, nome: "Trattenuto", icona: "TR", effetti: [non_si_muove], valori: {contro: 4}, testo: "Afferrato: non si muove ed è più facile da colpire."}
    # Riparo e occultamento (p. 54): −1 (un quarto nascosto) a −4 (nove decimi) per l'occultamento, il doppio per un riparo
    # solido. Il master li mette dal pannello a chi è al riparo, durante lo scontro.
    - {id: occultato, nome: "Occultato a metà", icona: "O2", valori: {contro: -2}, testo: "Mezzo nascosto da fumo o fronde: −2 a chi lo attacca."}
    - {id: molto_occultato, nome: "Quasi nascosto", icona: "O4", valori: {contro: -4}, testo: "Quasi del tutto nascosto: −4 a chi lo attacca."}
    - {id: al_riparo, nome: "Al riparo a metà", icona: "R4", valori: {contro: -4}, testo: "Mezzo coperto da un riparo solido: −4 a chi lo attacca."}
    - {id: molto_al_riparo, nome: "Quasi del tutto al riparo", icona: "R8", valori: {contro: -8}, testo: "Quasi del tutto dietro un riparo solido: −8 a chi lo attacca."}
    - {id: svenuto, nome: "Svenuto", icona: "SV", effetti: [perde_turno, non_si_muove, attacchi_contro_vantaggio], testo: "A terra senza sensi, finché qualcuno non gli fascia le ferite."}
    # Le condizioni degli incantesimi (p. 18, 25, 36): chi dorme, è incantato o paralizzato conta come caduto per il
    # morale (p. 57) e non agisce; chi dorme si colpisce sempre (p. 36).
    - {id: addormentato, nome: "Addormentato", icona: "ZZ", effetti: [perde_turno, non_si_muove, fuori_combattimento, colpito_automaticamente], testo: "Dorme per magia: si colpisce sempre, e un colpo lo sveglia."}
    - {id: affascinato, nome: "Affascinato", icona: "AF", effetti: [fuori_combattimento], testo: "Vede in chi l'ha incantato un caro amico e non lo combatte."}
    - {id: paralizzato, nome: "Paralizzato", icona: "PA", effetti: [perde_turno, non_si_muove, attacchi_contro_vantaggio, fuori_combattimento], testo: "Cosciente ma immobile: non si muove, non agisce, non parla."}
    # Il non morto scacciato (p. 58) fugge e non attacca: conta come fuori dallo scontro.
    - {id: scacciato, nome: "Scacciato", icona: "SC", effetti: [perde_turno, fuori_combattimento], testo: "Fugge dal chierico e non torna per un po'."}
    # Chi cede al morale e si arrende (p. 57): getta le armi, non combatte più per tutta la scena.
    - {id: arreso, nome: "Arreso", icona: "AR", effetti: [perde_turno, fuori_combattimento], testo: "Si è arreso: non combatte più."}
  condizione_a_zero: svenuto
  # Sorpresa (p. 50): 1d6 per ogni parte che può essere sorpresa, con 1–2 perde il primo round. Il Motore la tira per la
  # parte attaccata quando lo scontro si apre con un attacco, per tutte e due quando lo apre il master.
  sorpresa: {dado: 6, fino_a: 2, condizione: sorpreso}
  # Tiri che mancano in una mischia (p. 55): il colpo mancato a un nemico in mischia con altri PG va verso di loro, uno
  # dopo l'altro finché uno è colpito (lo tira il master); il manuale non dà un limite, qui tutti quelli in mischia.
  nella_mischia: {alleati: 9}
  # Morale (p. 57): 2d6, con più del morale il mostro fugge, o si arrende se è intelligente (`si_arrende` sulla scheda).
  # Si tira quando i mostri incontrano la prima opposizione (il primo attacco di un PG a uno di loro) e a metà forze (per
  # numero; un mostro solo a metà dei punti ferita); un tiro per la parte, letto contro il morale di ciascuno. Lo tira il
  # master: la carta resta sul pannello. Chi dorme, è incantato o paralizzato conta come caduto.
  fine: {morale: {quando: [prima_opposizione, meta], resa: {condizione: arreso}}}
