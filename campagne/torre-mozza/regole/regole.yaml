    - {id: sacco_piccolo, nome: "Sacco piccolo", peso: 0.1, costo: "5 ma", capienza: 20}   # Sack, Small; p. 12: 20 libbre
    - {id: sella_da_soma, nome: "Sella da soma", peso: 15, costo: "5 mo"}   # Saddle, Pack
    - {id: sella, nome: "Sella da cavalcare", peso: 35, costo: "10 mo"}   # Saddle, Riding
    - {id: bisacce, nome: "Bisacce (coppia)", peso: 7, costo: "4 mo", capienza: 10}   # Saddlebags, pair; p. 12: 10 libbre divise tra le due
