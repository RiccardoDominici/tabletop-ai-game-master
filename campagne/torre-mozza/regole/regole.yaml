    # Animali da soma (p. 11). Il peso è zero: la bestia non si porta nello zaino.
    - {id: cavallo_da_tiro, nome: "Cavallo da tiro", peso: 0, costo: "120 mo", proprieta: [animale]}   # Horse, Draft
