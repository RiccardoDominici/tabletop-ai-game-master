# Bestiario di Basic Fantasy Role-Playing Game, 4ª edizione, release 142 (CC BY-SA 4.0, basicfantasy.org), pp. 63–162.
# Una voce per ogni blocco di statistiche stampato (una per colonna quando il blocco ne ha più d'una: formica gigante,
# enorme, grande). `manuale` è il blocco da cui è copiata, `pagina` la pagina stampata (PDF = stampata + 4).
# Il controllo contro il PDF: python3 strumenti/regole/confronta_bestiario.py campagne/torre-mozza/regole/mostri.yaml \
#   --pdf manuali/basic-fantasy-rpg-r142.pdf (legge i blocchi per posizione, strumenti/regole/blocchi_mostri.py, e li
#   confronta nei due sensi). `testo` riassume le capacità speciali; quelle che hanno un effetto tipato sono anche dati
#   (`colpendo`, `potere`, `immune`, `resistenze`…). Le schede dei PNG e dei gregari le usano con `mostro: <id>`.
mostri:
  - id: camello
    nome: "Cammello"
    manuale: "Beasts of Burden | Camel"
    pagina: 63
    difesa: 13
    dadi_vita: "2"
    attacchi:
      - {id: morso, nome: "Morso", danno: "1"}
      - {id: zoccolo, nome: "Zoccolo", danno: "1d4"}
    per_round: [[morso, zoccolo]]
    movimento: "50' (10') [ 40' (10') ]"
    numero: "Wild 2d4"
    salva_come: {classe: guerriero, livello: 2}
    morale: 7
    tipo: [animale]
