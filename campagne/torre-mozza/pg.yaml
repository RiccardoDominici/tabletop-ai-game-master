# Personaggi pregenerati: tre giocatori più uno. Tutto è pubblico (telefono del giocatore e selettore), tranne
# `conoscenze_private`, che va solo sul telefono di quel giocatore (T9).
#
# Schede nel set di Basic Fantasy (regole/regole.yaml): ogni caratteristica vale il suo bonus del manuale (il
# punteggio è nel commento); i tiri salvezza, le abilità del ladro e le possibilità «su 1d6» sono bonus sul d20
# contro 17 (bonus = 17 − numero della tabella; percentuale / 5 − 4). Bonus d'attacco +1 a tutti al primo livello.
# Punti ferita: dado vita al massimo più la Costituzione (decisione nel brief).
situazione_comune: "Siete arrivati a Spinalba all'imbrunire, ognuno per la sua strada, e la pastora Berta Benni vi ha chiamati al suo ovile. In paese dicono che la notte scorsa i goblin della Torre Mozza le hanno preso il figlio, e che vogliono la chiave di famiglia entro mezzanotte."
personaggi:
  - id: pg_livia
    nome: "Livia Sarti"
    pronuncia: "Lìvia Sàrti"
    pronomi: "lei"
    specie: "umana"
    classe: "guerriera"
    livello: 1
    aspetto: "Una donna alta sui trent'anni, con i capelli corti, una cotta di maglia rattoppata e uno scudo con la croce bianca della milizia di valle."
    concetto: "Ex soldato della milizia di valle, dritta come una lancia. Crede negli ordini, finché non deve darli lei."
    aggancio: "Due inverni fa, di pattuglia con la milizia, Berta Benni ti ha dato un letto e una scodella di latte caldo."
    cosa_sai_fare:
      - "combatti meglio di tutti: spada lunga, scudo e arco corto"
      - "forzi le porte bloccate e tieni la prima fila"
      - "sai come ragiona una pattuglia, e come si fa la guardia"
    conoscenze_private:
      - testo: "Hai servito con il balivo di Valdirame: sai che quest'anno i Benni sono sulla sua lista della decima non pagata, e che alla prima neve il balivo si prende l'ovile."
        fatti: [f_debito]
    scheda:
      # Forza 16, Intelligenza 10, Saggezza 9, Destrezza 13, Costituzione 15, Carisma 11.
      caratteristiche: {forza: 2, intelligenza: 0, saggezza: 0, destrezza: 1, costituzione: 1, carisma: 0}
      # Guerriera di primo livello: salvezza 12, 13, 14, 15, 17. Porte bloccate: 3 su 6 con la Forza.
      abilita: {mischia: 1, distanza: 1, ts_morte: 5, ts_morte_destrezza: 5, ts_bacchette: 4, ts_paralisi: 3, ts_soffio: 2, ts_incantesimi: 0, forzare: 6}
      pf: 9                      # 1d8 al massimo, più 1 di Costituzione
      difesa: 17                 # cotta di maglia 15, scudo +1, Destrezza +1
      attacchi:
        - {nome: "Spada lunga", danno: "1d8+2", abilita: mischia}
        - {nome: "Arco corto", danno: "1d6", abilita: distanza, distanza: true}

  - id: pg_fulco
    nome: "Fulco Granito"
    pronuncia: "Fùlco Granìto"
    pronomi: "lui"
    specie: "nano"
    classe: "chierico"
    livello: 1
    aspetto: "Un nano tarchiato con la barba grigia intrecciata di perline di ferro, una mazza alla cintura e un simbolo sacro di pietra al collo."
    concetto: "Chierico nano che parla con la pietra meglio che con la gente. Benedice gli ovili, e conta le pecore per scaramanzia."
    aggancio: "Il tuo tempio ti manda a benedire gli ovili di Spinalba prima della neve, e quello dei Benni è il primo della lista."
    cosa_sai_fare:
      - "vedi al buio e noti la muratura nuova, le trappole di pietra e i passaggi in pendenza"
      - "scacci i non morti con il simbolo sacro"
      - "combatti con la mazza e con la fionda"
      - "resisti a veleni e magie meglio della gente alta"
    conoscenze_private:
      - testo: "I nani che costruirono le torri di confine lasciavano sempre, sotto ogni torre, una postierla: un passaggio basso verso il bosco, per le sortite. Di solito sbuca in cantina."
        fatti: [f_postierle_torri]
    scheda:
      # Forza 13, Intelligenza 9, Saggezza 15, Destrezza 8, Costituzione 14, Carisma 10.
      caratteristiche: {forza: 1, intelligenza: 0, saggezza: 1, destrezza: -1, costituzione: 1, carisma: 0}
      # Chierico di primo livello (11, 12, 14, 16, 15) con il bonus dei nani (+4, e +3 al soffio).
      # Occhio per la pietra: 2 su 6. Porte bloccate: 2 su 6 con la Forza.
      abilita: {mischia: 1, distanza: 1, ts_morte: 10, ts_morte_destrezza: 10, ts_bacchette: 9, ts_paralisi: 7, ts_soffio: 4, ts_incantesimi: 6, forzare: 3, pietra: 3}
      pf: 7                      # 1d6 al massimo, più 1 di Costituzione
      difesa: 15                 # cotta di maglia 15, scudo +1, Destrezza −1
      attacchi:
        - {nome: "Mazza", danno: "1d8+1", abilita: mischia}
        # La fionda somma la Forza al danno (p. 55: «sling bullets or stones do»).
        - {nome: "Fionda", danno: "1d4+1", abilita: distanza, distanza: true}

  - id: pg_nespola
    nome: "Nespola Tondi"
    pronuncia: "Nèspola Tóndi"
    pronomi: "lei"
    specie: "halfling"
    classe: "ladra"
    livello: 1
    aspetto: "Una halfling riccia e scalza, con una giacca di cuoio piena di tasche e una fionda infilata nella cintura."
    concetto: "Ladra halfling che riscuote i debiti degli altri in cambio di una parte. Ha il naso fino per le bugie, soprattutto per le sue."
    aggancio: "Ugo il carbonaio ti deve tre monete d'argento da una partita a dadi, e sei venuta a riscuoterle."
    cosa_sai_fare:
      - "scassini serrature, scali muri, ti nascondi e ti muovi in silenzio"
      - "trovi e togli le trappole"
      - "colpisci alle spalle chi non sa che ci sei: un colpo furtivo per avversario"
      - "con la fionda non sbagli quasi mai"
    conoscenze_private:
      - testo: "Una settimana fa, al mercato di Valdirame, un ragazzo di Spinalba ti ha chiesto quanto vale una moneta d'argento vecchia con una torre coniata sopra, e dove si cambia senza domande. Diceva di chiamarsi Tonio."
        fatti: [f_tonio_mercato]
    scheda:
      # Forza 9, Intelligenza 12, Saggezza 10, Destrezza 17, Costituzione 13, Carisma 13.
      caratteristiche: {forza: 0, intelligenza: 0, saggezza: 0, destrezza: 2, costituzione: 1, carisma: 1}
      # Ladra di primo livello (13, 14, 13, 16, 15) con il bonus degli halfling (+4, e +3 al soffio).
      # Abilità del ladro 25, 20, 30, 25, 80, 30 per cento; nascondersi al chiuso come halfling (70%).
      # Distanza: +1 degli halfling. Attacco furtivo: +4. Il +1 degli halfling all'iniziativa lo schema non lo porta
      # (l'iniziativa somma solo la Destrezza).
      abilita: {mischia: 1, distanza: 2, alle_spalle: 5, ts_morte: 8, ts_morte_destrezza: 8, ts_bacchette: 7, ts_paralisi: 8, ts_soffio: 4, ts_incantesimi: 6,
                scassinare: 1, trappole: 0, borseggiare: 2, muoversi_in_silenzio: 1, scalare: 12, nascondersi: 10, ascoltare: 2}
      pf: 5                      # 1d4 al massimo, più 1 di Costituzione
      difesa: 15                 # armatura di cuoio 13, Destrezza +2
      attacchi:
        - {nome: "Spada corta", danno: "1d6", abilita: mischia}
        - {nome: "Spada corta alle spalle", danno: "2d6", abilita: alle_spalle}
        - {nome: "Fionda", danno: "1d4", abilita: distanza, distanza: true}

  - id: pg_eliandro
    nome: "Eliandro"
    pronuncia: "Eliàndro"
    pronomi: "lui"
    specie: "elfo"
    classe: "mago"
    livello: 1
    aspetto: "Un elfo pallido e magro, con un mantello grigio, le dita macchiate d'inchiostro e un quaderno di pelle sotto il braccio."
    concetto: "Mago elfo che copia le iscrizioni delle rovine su un quaderno di pelle. Si fida più delle pietre che delle persone."
    aggancio: "Cerchi le iscrizioni delle vecchie torri di confine, e la Torre Mozza è la prossima della tua lista."
    cosa_sai_fare:
      - "lanci dardo incantato una volta al giorno: colpisce sempre"
      - "leggi il magico e le scritte antiche delle rovine"
      - "vedi al buio e trovi le porte segrete meglio degli altri"
      - "combatti male: un pugnale, e niente armatura"
    conoscenze_private:
      - testo: "I goblin non scrivono la lingua comune: incidono segni sul legno, e non sanno fare lettere con un carbone. Un messaggio in lettere comuni lo scrive un umano, un nano o un elfo."
        fatti: [f_goblin_scrittura]
    scheda:
      # Forza 10, Intelligenza 16, Saggezza 12, Destrezza 14, Costituzione 12, Carisma 9.
      caratteristiche: {forza: 0, intelligenza: 2, saggezza: 0, destrezza: 1, costituzione: 0, carisma: 0}
      # Mago di primo livello (13, 14, 13, 16, 15) con il bonus degli elfi (+2 bacchette e incantesimi, +1 paralisi).
      # Porte segrete: 3 su 6 (elfo con Intelligenza 15 o più). Dardo incantato: colpisce sempre (+20).
      abilita: {mischia: 1, distanza: 1, dardo_incantato: 20, ts_morte: 4, ts_morte_destrezza: 4, ts_bacchette: 5, ts_paralisi: 5, ts_soffio: 1, ts_incantesimi: 4, cercare: 6}
      pf: 4                      # 1d4 al massimo
      difesa: 12                 # senza armatura 11, Destrezza +1
      attacchi:
        - {nome: "Pugnale", danno: "1d4", abilita: mischia}
        - {nome: "Pugnale lanciato", danno: "1d4", abilita: distanza, distanza: true}
        - {nome: "Dardo incantato", danno: "1d6+1", abilita: dardo_incantato, distanza: true}
