sessione:
  riassunto_iniziale: "Spinalba è un borgo di pastori sotto la Torre Mozza. Da tre settimane, nella torre in rovina, ci sono i goblin. Stanotte è sparito Tonio, il figlio della pastora Berta, e sulla porta è comparsa una lavagna."
  cinque_stanze:
    ingresso_o_guardiano: "L'ovile dei Benni: Berta con la chiave in pugno, e Ugo accusato davanti a tutti."
    enigma_o_sfida_sociale: "Chi dice il vero su stanotte: la madre, il carbonaio, la lavagna?"
    trucco_o_battuta_d_arresto: "Il sentiero dei goblin con la fossa coperta, e la postierla sotto i rovi."
    climax: "La torre a mezzanotte: Zirrà, Grosso e la porta di ferro della cripta."
    ricompensa_o_colpo_di_scena: "Tonio non era un prigioniero: che cosa si racconta a Spinalba?"
  scene_potenziali: [scena_ovile, scena_carbonaia, scena_torre]
  chiusura: "Con Tonio vivo e la verità in mano, i PG scelgono che cosa raccontare a Spinalba: la verità, il silenzio o l'alibi di Ugo. Poi si chiede ai giocatori che cosa faranno all'alba."
