# Scheda scena/luogo (manuale §4): il terzo tocco, sul ponte, a mezzanotte. Climax della sessione.
# Durata prevista 20–30 minuti. Stessa pianta della prima scena.
# La catena: a terra il ponte è aperto; alzata e tesa tra i paletti, il ponte è chiuso.

id: scena_terzo_tocco
nodo: e_terzo_tocco
nome: "Il terzo tocco, sul ponte"

descrizione: "Il ponte poco prima di mezzanotte, con la stessa pianta della prima scena. La catena è ancora a terra tra i paletti: con la manovella si alza e si tende, e il ponte è chiuso. La rampa bassa è sott'acqua fino alla caviglia, e sale. All'imbocco della Riva Alta, sotto la tettoia, il console e il consiglio; dietro, il paese con lanterne e ceri. Vischi sta accanto al console. Tullio è alla manovella; Bice è alle lanterne del parapetto. Chi è già passato è su in chiesa: Rosa, se è passata, è in chiesa con i suoi vecchi e non scende al ponte. La Bigia, la chiatta del ponte, è al pontile sotto il casello, oppure è nel Borgo per il secondo viaggio, se è ripartita appena tornata dal primo. Un viaggio che parte adesso torna tra quasi quattro ore. Chi sente cosa: ciò che si dice alla manovella lo sentono Tullio e chi gli sta accanto; ciò che si grida lo sente tutto il ponte, console compreso. Dentro il casello, a porta chiusa, non sente nessuno. Sulla rampa bassa il fiume copre tutto."

scopo: {tipo: far_avanzare_fronte, rif: fronte_debiti}
domanda_drammatica: "Al terzo tocco, il ponte resterà aperto?"

posta:
  si_guadagna:
    cosa: "Il ritorno del secondo viaggio, con il gruppo rimasto di là, se la barca è già partita e il ponte resta aperto."
    per_chi: [png_rosa, pg_nives, pg_dalia]
  si_perde:
    cosa: "Il casello di Tullio, e il rischio sulla rampa, se il ponte resta aperto. Una notte al freddo per chi è ancora di là, se si chiude."
    per_chi: [png_tullio, png_bice, png_rosa]

intensita: 5

sensi:
  - "Il ponte fermo sotto i piedi, mentre il fiume urla tra le arcate."    # tatto e udito
  - "L'acqua gelata alle caviglie, sulla rampa bassa."                    # tatto
  - "Odore di cera dei ceri del paese, mescolato al fango."               # olfatto

elementi_interattivi:
  - {cosa: "la catena e la manovella", dove: "davanti al casello", azioni: "Tullio la tiene; si alza e si tende in un momento, e il ponte è chiuso"}
  - {cosa: "le lanterne del parapetto", dove: "una sopra ogni arcata", azioni: "si staccano e si portano sulla rampa bassa: piantate sui paletti segnano il bordo sotto l'acqua"}
  - {cosa: "la rampa bassa", dove: "dalla parte del Borgo", azioni: "ci si scende con l'acqua che sale; ci si sta in piedi tenendosi ai paletti"}
  - {cosa: "il leone e il pilone di mezzo", dove: "sotto il casello, verso monte", azioni: "ci si sporge con una lanterna; si mostra a tutti quello che c'è sul pilone"}
  - {cosa: "la Bigia", dove: "al pontile sotto il casello, o nel Borgo", azioni: "se è nel Borgo, torna carica verso la rampa; se è al pontile, un viaggio che parte adesso torna tra quasi quattro ore"}
  - {cosa: "il console e il paese", dove: "all'imbocco della Riva Alta", azioni: "si parla davanti a tutti; si mostra una prova; si chiede un voto"}

png_presenti: [png_tullio, png_bice, png_vischi]
orologi_attivi: [o_piena, o_rampa]

indizi:
  - id: i_ponte_fermo
    conclusione: r_leone
    tipo: evento
    nodo: e_terzo_tocco
    essenziale: false
    tiro: "nessuno"
    modi: 1
    come_si_trova: "Indizio proattivo, al terzo tocco: l'acqua tocca la criniera, e chi ha i piedi sul ponte non sente niente, né tremito né scricchiolio. Le pietre del pilone sopra il leone sono ancora asciutte."
    vincolo_pubblico: "Al terzo tocco il ponte non trema e non scricchiola."

uscite:
  - {verso: n_chiesa, segnalata_da: [i_ponte_fermo], nota: "Chi passa il ponte sale in chiesa."}
  - {verso: n_passo_vecchio, segnalata_da: [i_lista_alba, i_carte_pronte], nota: "All'alba, le barche di Vischi: prossima sessione."}

climax: true

mossa_morbida_pronta: "All'imbocco della Riva Alta il paese batte i piedi sulle pietre, a tempo. Qualcuno grida a Tullio di chiudere la catena."

apertura: "Quasi mezzanotte sul ponte: l'acqua lecca la rampa bassa, e il paese aspetta all'imbocco con le lanterne. Tullio ha la mano sulla manovella, e Vischi parla piano al console. Dal Borgo, una lanterna chiama ancora: che fate?"

musica:
  tag: esplorazione_tesa
  transizione: "Verso inseguimento se la Bigia torna con l'acqua sulla rampa. A scena chiusa: taverna_calda se tutti sono passati, lutto se qualcuno resta di là."

immagine:
  invarianti: ["ponte di pietra a sei arcate", "sei lanterne accese sul parapetto", "casello di legno e pietra in mezzo al ponte", "catena di ferro ancora a terra tra due paletti", "rampa bassa sotto l'acqua", "folla con lanterne e ceri in fondo al ponte"]
  prompt_luogo: "old six-arched stone toll bridge just before midnight in a raging flood, muddy water lapping over the low ramp, six lanterns along the parapet, wood-and-stone toll house at mid-span, heavy iron chain still lying slack on the roadway between two posts beside a crank, a crowd with lanterns and candles gathered under a shelter at the high end, rain slanting in the lantern light"

taglio: "La scena si chiude quando la catena è tesa e la rampa è vuota. Se la catena si chiude al terzo tocco con un gruppo ancora di là, quel gruppo passa la notte sopra l'acqua. Se il ponte resta aperto, il secondo viaggio prova a passare con l'acqua sulla rampa: se la barca torna prima dell'ultimo segno della rampa, passa; se no, la catena si chiude e la barca torna nel Borgo con il suo carico. Se i PG accettano la proposta di Vischi davanti al console, la catena si chiude al tocco e all'alba le sue barche prendono tutti. Se al terzo tocco i PG esitano, Tullio aspetta il tempo di una risposta, poi chiude."

# Esiti del taglio, ognuno con il suo finale nel repertorio.
esiti:
  - {id: e_famiglie_di_la, descrizione: "Catena chiusa al tocco, le famiglie delle Case Lunghe restano di là fino all'alba.", finale: fin_notte_case_lunghe}
  - {id: e_vecchi_di_la, descrizione: "Catena chiusa al tocco, i vecchi del Ricovero restano di là fino all'alba.", finale: fin_notte_ricovero}
  - {id: e_patto, descrizione: "I PG accettano la proposta di Vischi: catena chiusa al tocco, barche per tutti all'alba, e nessuno guarda il pilone.", finale: fin_patto}
  - {id: e_ora_in_piu, descrizione: "Ponte aperto dopo il tocco: il secondo viaggio torna in tempo, con l'acqua sulla rampa.", finale: fin_ora_in_piu}
  - {id: e_barca_tardi, descrizione: "Ponte aperto dopo il tocco, ma la barca non torna in tempo: la catena si chiude, e la barca resta di là.", finale: fin_barca_tardi}
  - {id: e_nessun_viaggio, descrizione: "La barca non è mai partita: Ricovero e Case Lunghe restano di là.", finale: fin_nessun_viaggio}
