# Scheda scena/luogo (manuale §4): la Casa del Sale, durante il consiglio, tra il primo e il terzo tocco.
# Durata prevista 25–35 minuti. Si può giocare prima o dopo il Borgo Basso, o in parallelo se il gruppo si divide.

id: scena_casa_del_sale
nodo: n_casa_del_sale
nome: "La Casa del Sale, durante il consiglio"

descrizione: "Un magazzino di pietra sulla Riva Alta, a cinquanta passi dalla testa del ponte. Nella sala grande ci sono sacchi di sale fino alle travi, un camino acceso e il tavolo lungo del consiglio: il console Ugolino, quattro consiglieri, Vischi a capotavola, lo scrivano Ottone con i fogli e il calamaio. Barcaioli bagnati entrano a chiedere e a firmare. In fondo alla sala c'è una porta di quercia chiusa, con una guardia davanti: è lo studio di Vischi, con lo scrittoio, un camino piccolo e una cassa di ferro sotto lo scrittoio. Chi sente cosa: ciò che si dice al tavolo lo sente tutta la sala. Tra i sacchi, sottovoce, non sente nessuno. Nello studio a porta chiusa non si sente niente dalla sala, e dalla sala non si sente niente dello studio. Bice e Tullio restano al ponte."

scopo: {tipo: rivelare_indizio, rif: i_lista_alba}
domanda_drammatica: "Il consiglio confermerà la catena chiusa al terzo tocco?"

posta:
  si_guadagna:
    cosa: "Una prova da portare al ponte, e forse il voto del console."
    per_chi: [png_tullio, pg_nives, pg_ghita]
  si_perde:
    cosa: "La lista sigillata: all'alba sulle barche di Vischi sale solo chi ha firmato."
    per_chi: [pg_nives, pg_arrigo, png_rosa]

intensita: 3

sensi:
  - "Il calore secco del camino, e il sale che scricchiola sotto gli stivali."   # tatto e udito
  - "Odore di vino caldo e di lana fradicia appesa ad asciugare."               # olfatto
  - "La penna dello scrivano che gratta la carta, a ogni firma."                # udito

elementi_interattivi:
  - {cosa: "il tavolo del consiglio", dove: "in mezzo alla sala grande", azioni: "ci si siede, si parla al console, si brinda; lo scrivano tiene lì i fogli da firmare"}
  - {cosa: "la porta dello studio", dove: "in fondo alla sala", azioni: "è chiusa, con la guardia davanti; si apre con la chiave di Vischi, con il permesso della guardia, o con le buone maniere"}
  - {cosa: "lo scrittoio", dove: "nello studio", azioni: "sopra c'è la cartella di Vischi; accanto al camino piccolo pende una corda bagnata"}
  - {cosa: "la cassa di ferro", dove: "nello studio, sotto lo scrittoio", azioni: "chiusa con un lucchetto vecchio, che cede a una leva o a un grimaldello; dentro, i registri vecchi"}
  - {cosa: "i sacchi di sale", dove: "lungo le pareti della sala e del magazzino", azioni: "ci si nasconde, ci si arrampica, si parla sottovoce"}
  - {cosa: "la porta del retro", dove: "nel magazzino, dietro i sacchi", azioni: "NASCOSTA: non ha il chiavistello; non nominarla finché non la nomina chi la conosce, o finché un PG non gira dietro i sacchi"}

png_presenti: [png_vischi]
orologi_attivi: [o_firme]

indizi:
  - id: i_registro_padre
    conclusione: r_leone
    tipo: documento
    nodo: n_casa_del_sale
    essenziale: false
    tiro: "nessuno"
    modi: 1
    come_si_trova: "Chi apre la cassa di ferro trova il registro di Corrado Vischi, il padre: pochi giorni dopo la piena grande, dieci fiorini a mastro Pece, «per il leone del ponte, lavoro di notte, due spanne»."
  - id: i_corda_nodi
    conclusione: r_leone
    tipo: oggetto
    nodo: n_casa_del_sale
    essenziale: false
    tiro: "nessuno"
    modi: 1
    come_si_trova: "Chi entra nello studio vede, appesa ad asciugare accanto al camino piccolo, una corda a nodi bagnata, con un nastro rosso legato due spanne dopo il primo nodo."
    vincolo_pubblico: "Nello studio, accanto al camino piccolo, asciuga una corda a nodi con un nastro rosso."
  - id: i_carte_pronte
    conclusione: r_vischi
    tipo: documento
    nodo: n_casa_del_sale
    essenziale: false
    tiro: "nessuno"
    modi: 2
    come_si_trova: "Sul tavolo dello scrivano, oppure nella cartella di Vischi sullo scrittoio: contratti di prestito già scritti, con i nomi delle famiglie delle Case Lunghe e di Rosa Galli, e la casa in pegno. Manca solo la firma."
  - id: i_lista_alba
    conclusione: r_vischi
    tipo: documento
    nodo: n_casa_del_sale
    essenziale: true
    tiro: "nessuno"
    modi: 1
    come_si_trova: "La lista per le barche dell'alba, che lo scrivano ricopia al tavolo: in cima, di pugno di Vischi, c'è scritto «solo chi ha firmato». Si legge da sopra la spalla dello scrivano, o chiedendogliela."
  - id: i_vischi_darsena
    conclusione: r_vischi
    tipo: png
    nodo: png_vischi
    essenziale: false
    tiro: "nessuno"
    modi: 1
    come_si_trova: "Chi ascolta Vischi parlare piano con il console, tra i sacchi o al camino: le Case Lunghe sono legno marcio, dice, e lì ci starebbe bene una darsena."

uscite:
  - {verso: n_ponte, segnalata_da: [i_corda_nodi, i_registro_padre, i_lista_alba], nota: "Si torna al ponte all'ora in cui si è: per la barca, o per il terzo tocco."}
  - {verso: e_terzo_tocco, segnalata_da: [i_registro_padre, i_corda_nodi, i_lista_alba], nota: "La prova si mostra al ponte, al terzo tocco, davanti a Tullio e al console."}
  - {verso: n_borgo_basso, segnalata_da: [i_carte_pronte, i_vischi_darsena, i_lista_alba], nota: "I nomi sui contratti sono quelli di chi è ancora di là."}

mossa_morbida_pronta: "Il console batte il bicchiere sul tavolo e chiede silenzio. Vuole sapere chi è d'accordo a chiudere la catena al terzo tocco."

apertura: "Alla Casa del Sale il camino scoppietta, e il sale scricchiola sotto gli stivali. Al tavolo lungo il console beve, e Vischi vi fa cenno di sedere vicino al fuoco. Lo scrivano intinge la penna: chi parla per primo?"

musica:
  tag: taverna_calda
  transizione: "Verso esplorazione_tesa quando qualcuno entra nello studio o apre la cassa."

immagine:
  invarianti: ["magazzino di pietra con sacchi di sale fino alle travi", "camino acceso", "tavolo lungo con calamaio, fogli e boccali", "porta di quercia chiusa in fondo alla sala", "mantelli bagnati appesi vicino all'ingresso"]
  prompt_luogo: "warm stone salt warehouse at night, white sacks of salt stacked up to the rafters, crackling fireplace, long council table with inkwell, papers and pewter cups, closed oak door at the far end of the hall, wet cloaks hanging by the entrance"

taglio: "La scena si chiude quando i PG lasciano la Casa del Sale, con una prova o senza. Oppure al sesto segno delle firme, quando Vischi sigilla la lista: il consiglio ha votato, e i PG tornano al ponte all'ora in cui sono, per la barca se non è ancora partita, o per il terzo tocco. Se i PG esitano, il console chiude la seduta e manda tutti fuori sotto la pioggia."
