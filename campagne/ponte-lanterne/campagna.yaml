# Campagna «ponte-lanterne» — Il ponte delle lanterne. Artefatti del Preparatore (manuale §2).
#
# Divisione per pubblico (E2, need-to-know):
#   - `preparazione` NON va al Narratore: destini, cronologia del cattivo, segreti astratti, archi;
#   - canone, orologi, rivelazioni, colli di bottiglia, nodi e sessione servono al Narratore in modo A.
#     In modo B (repertorio) il compilatore toglie le parti elencate in
#     repertorio/parole_segrete.yaml → da_togliere_dal_contesto.
#
# Gli id dei fatti (f_*) sono quelli citati nelle schede PNG e dei PG. Gli indizi (i_*) sono definiti
# nelle schede delle scene: scena.yaml (il ponte all'imbrunire) e scene/*.yaml.

id: ponte-lanterne

# ---------------------------------------------------------------------------
# CANONE (E10). Un fatto per riga.
# noto_ai_pg: true  = lo sanno i PG o tutto il paese: si può dire a voce;
# noto_ai_pg: false = nascosto: lo dice solo un PNG che lo sa, o un indizio.
# ---------------------------------------------------------------------------
canone:
  # Pubblici: il paese, il ponte, la piena
  - {id: f_piena, noto_ai_pg: true, stato: confermato, entita: [n_ponte],
     testo: "Da tre giorni piove su Vadolungo, e stanotte la Lenta è in piena."}
  - {id: f_ponte_unico, noto_ai_pg: true, stato: confermato, entita: [n_ponte],
     testo: "Il Ponte delle Lanterne è l'unico passaggio tra il Borgo Basso e la Riva Alta."}
  - {id: f_pedaggio, noto_ai_pg: true, stato: confermato, entita: [n_ponte, png_tullio],
     testo: "Al ponte si paga un soldo a passaggio, al casello in mezzo al ponte, dove vive Tullio Bellora, il custode."}
  - {id: f_tullio_custode, noto_ai_pg: true, stato: confermato, entita: [png_tullio],
     testo: "Tullio tiene il casello da trent'anni, come suo padre prima di lui."}
  - {id: f_lanterne_ponte, noto_ai_pg: true, stato: confermato, entita: [n_ponte, png_bice],
     testo: "Sul parapetto ci sono sei lanterne, una per arcata. Le accende Bice, la nipote di Tullio."}
  - {id: f_tocchi, noto_ai_pg: true, stato: confermato, entita: [],
     testo: "Nelle notti di piena la campana di San Clemente batte tre tocchi: al tramonto, a metà sera e a mezzanotte."}
  - {id: f_regola_leone, noto_ai_pg: true, stato: confermato, entita: [n_ponte, png_tullio],
     testo: "Per regola, quando l'acqua tocca la criniera del leone di pietra sul pilone di mezzo, il custode alza la catena e la tende tra i paletti, e il ponte resta chiuso finché l'acqua non cala."}
  - {id: f_ordine_consiglio, noto_ai_pg: true, stato: confermato, entita: [png_vischi],
     testo: "Il consiglio ha ordinato di chiudere la catena al terzo tocco: a quell'ora l'acqua sarà al leone."}
  - {id: f_piena_grande, noto_ai_pg: true, stato: confermato, entita: [n_ponte],
     testo: "Quarant'anni fa, nella piena grande, quattro persone rimaste sulla rampa bassa di notte non sono più tornate a casa. La regola del leone è nata allora."}
  - {id: f_detto_bellora, noto_ai_pg: true, stato: confermato, entita: [png_tullio],
     testo: "In paese tutti ricordano il detto del vecchio Bellora, il padre di Tullio: il leone ha paura dell'acqua, il ponte no. Nessuno l'ha mai capito."}
  - {id: f_borgo_passato, noto_ai_pg: true, stato: confermato, entita: [n_borgo_basso],
     testo: "Al primo tocco quasi tutto il Borgo Basso ha passato il ponte, e dorme nella chiesa di San Clemente. Il Ricovero e le Case Lunghe sono rimasti tagliati fuori dall'acqua."}
  - {id: f_ricovero, noto_ai_pg: true, stato: confermato, entita: [n_borgo_basso, png_rosa],
     testo: "Al Ricovero, in fondo al Borgo verso monte, vivono sette vecchi con la custode, Rosa Galli. È una casa di pietra a due piani."}
  - {id: f_case_lunghe, noto_ai_pg: true, stato: confermato, entita: [n_borgo_basso],
     testo: "Le Case Lunghe sono case di legno sull'argine, in fondo al Borgo verso valle. Ci vivono quattro famiglie di barcaioli: quindici persone, nove delle quali bambini."}
  - {id: f_barca_bigia, noto_ai_pg: true, stato: confermato, entita: [n_ponte, png_tullio],
     testo: "Sotto il casello è legata la Bigia, la vecchia chiatta del ponte: è l'unica barca che entra nei vicoli allagati, e porta una ventina di persone strette."}
  - {id: f_un_viaggio, noto_ai_pg: true, stato: confermato, entita: [n_borgo_basso],
     testo: "Un viaggio della Bigia nel Borgo, andata e ritorno, dura più di metà della sera: prima del terzo tocco ne entra uno solo."}
  - {id: f_secondo_viaggio, noto_ai_pg: true, stato: confermato, entita: [n_borgo_basso],
     testo: "Un secondo viaggio tornerebbe al ponte circa un'ora dopo il terzo tocco."}
  - {id: f_un_gruppo, noto_ai_pg: true, stato: confermato, entita: [n_borgo_basso],
     testo: "La Bigia porta un gruppo per volta: il Ricovero e le Case Lunghe stanno ai due capi opposti del Borgo."}
  - {id: f_segnali, noto_ai_pg: true, stato: confermato, entita: [n_borgo_basso],
     testo: "Nel Borgo si parla con le lanterne alle finestre: dondolata vuol dire «stiamo bene», ferma vuol dire «venite»."}
  - {id: f_barche_vischi, noto_ai_pg: true, stato: confermato, entita: [png_vischi, n_passo_vecchio],
     testo: "Leandro Vischi, mercante di sale e prestatore, ha le barche grandi del Passo Vecchio, un'ora a valle, e ha promesso di mandarle all'alba."}
  - {id: f_consiglio_sale, noto_ai_pg: true, stato: confermato, entita: [png_vischi, n_casa_del_sale],
     testo: "Vischi siede nel consiglio. Stanotte il consiglio si riunisce nella sua Casa del Sale, sulla Riva Alta, perché è asciutta e calda."}
  - {id: f_debiti_borgo, noto_ai_pg: true, stato: confermato, entita: [png_vischi, n_borgo_basso],
     testo: "Mezzo Borgo Basso ha debiti con Vischi: barche, reti, tetti."}
  - {id: f_console, noto_ai_pg: true, stato: confermato, entita: [],
     testo: "Il consiglio lo guida il console Ugolino Pradella, che non ha mai detto di no a Vischi."}
  - {id: f_ernesto, noto_ai_pg: true, stato: confermato, entita: [png_rosa],
     testo: "Tra i vecchi del Ricovero c'è Ernesto, barcaiolo per sessant'anni, che ha insegnato a remare a mezzo Borgo."}

  # Nascosti: il leone
  - {id: f_leone_calato, noto_ai_pg: false, stato: confermato, entita: [n_ponte],
     testo: "Dopo la piena grande il leone è stato smurato e rimesso due spanne più in basso."}
  - {id: f_padre_vischi, noto_ai_pg: false, stato: confermato, entita: [png_vischi],
     testo: "A pagare il muratore che calò il leone fu Corrado Vischi, il padre di Leandro."}
  - {id: f_onda_pontieri, noto_ai_pg: false, stato: confermato, entita: [n_ponte],
     testo: "Sul pilone di mezzo, due spanne sopra il leone, sotto il muschio, c'è un'onda scolpita dai costruttori: è il vero segno del pericolo."}
  - {id: f_ora_in_piu, noto_ai_pg: false, stato: confermato, entita: [n_ponte],
     testo: "Dal leone all'onda l'acqua impiega circa un'ora a salire: il ponte regge un'ora dopo il terzo tocco."}
  - {id: f_malta_chiara, noto_ai_pg: false, stato: confermato, entita: [n_ponte],
     testo: "Il blocco del leone è murato con una malta chiara e liscia, diversa da quella scura e mangiata del pilone."}
  - {id: f_libro_piena, noto_ai_pg: false, stato: confermato, entita: [n_ponte, png_tullio],
     testo: "Nel libro dei passi del casello, alla piena di trentacinque anni fa, il vecchio Bellora scrisse: «Acqua alla criniera, ponte saldo. Acqua all'onda, la rampa se ne va.»"}
  - {id: f_bellora_guardava, noto_ai_pg: false, stato: confermato, entita: [png_tullio],
     testo: "Dopo la piena grande, nelle notti d'acqua il vecchio Bellora guardava un punto del pilone più in alto del leone."}
  - {id: f_vischi_sa, noto_ai_pg: false, stato: confermato, entita: [png_vischi],
     testo: "Leandro Vischi sa che il leone è stato calato: lo ha letto nel registro del padre."}
  - {id: f_registro_padre, noto_ai_pg: false, stato: confermato, entita: [n_casa_del_sale],
     testo: "Nel registro di Corrado Vischi, quarant'anni fa: dieci fiorini a mastro Pece, per il leone del ponte, lavoro di notte, due spanne."}
  - {id: f_scrivano_misura, noto_ai_pg: false, stato: confermato, entita: [png_vischi],
     testo: "Ieri notte lo scrivano di Vischi, da una barca, ha misurato il pilone con una corda a nodi, dal leone in su."}
  - {id: f_rondini, noto_ai_pg: false, stato: confermato, entita: [png_rosa, n_ponte],
     testo: "Prima della piena grande il leone stava all'altezza dei nidi delle rondini, sotto l'arcata."}
  - {id: f_bice_anguille, noto_ai_pg: false, stato: confermato, entita: [png_bice],
     testo: "Bice pesca anguille di notte sotto il ponte, dove è vietato, e Tullio non lo sa."}

  # Nascosti: i debiti
  - {id: f_carte_pronte, noto_ai_pg: false, stato: confermato, entita: [png_vischi, n_casa_del_sale],
     testo: "Nella Casa del Sale ci sono già i contratti di prestito con i nomi delle Case Lunghe e del Ricovero, con la casa in pegno."}
  - {id: f_barche_firma, noto_ai_pg: false, stato: confermato, entita: [png_vischi, n_passo_vecchio],
     testo: "All'alba le barche di Vischi prenderanno solo chi firma il prestito."}
  - {id: f_darsena, noto_ai_pg: false, stato: confermato, entita: [png_vischi, n_borgo_basso],
     testo: "Vischi vuole buttare giù le Case Lunghe e farci una darsena per le barche del sale."}
  - {id: f_croci_gesso, noto_ai_pg: false, stato: confermato, entita: [n_borgo_basso],
     testo: "Ieri lo scrivano di Vischi ha segnato con una croce di gesso le porte delle Case Lunghe e del Ricovero."}
  - {id: f_debito_tullio, noto_ai_pg: false, stato: confermato, entita: [png_tullio, png_vischi],
     testo: "Due anni fa Tullio ha preso da Vischi quaranta fiorini per rifare il tetto del casello, e gli ha dato il casello in pegno."}
  - {id: f_minaccia_tullio, noto_ai_pg: false, stato: confermato, entita: [png_tullio, png_vischi],
     testo: "Vischi ha detto a Tullio che, se tiene aperto il ponte dopo il terzo tocco, il debito scade all'alba e il casello è suo."}

  # Nascosti: il Ricovero
  - {id: f_ernesto_tosse, noto_ai_pg: false, stato: confermato, entita: [png_rosa],
     testo: "Domenica, a messa, Ernesto tossiva già forte."}
  - {id: f_ernesto_febbre, noto_ai_pg: false, stato: confermato, entita: [png_rosa],
     testo: "Ernesto ha la febbre alta da ieri."}
  - {id: f_legna_bagnata, noto_ai_pg: false, stato: confermato, entita: [n_borgo_basso],
     testo: "Al Ricovero la legna è finita sott'acqua, e la stufa del piano di sopra è fredda."}

# ---------------------------------------------------------------------------
# OROLOGI (C2) che il Narratore vede. Il nome è quello dell'ostacolo.
# `segni`: uno per segmento, in ordine; il Narratore mostra il segno del segmento appena riempito.
# ---------------------------------------------------------------------------
orologi:
  - id: o_piena
    nome: "La Lenta sale al leone"
    pericolo: p_piena
    segmenti: 8
    pieni_all_inizio: 0
    # Orologio di tutta la sessione: un segno ogni sei risposte al massimo, perché duri tre scene.
    segno_almeno_ogni: 6
    segni:
      - "Il fiume cambia voce: un brontolio basso e continuo, sotto la pioggia."
      - "Una botte vuota scende veloce sulla corrente e sbatte contro un pilone."
      - "Nel Borgo Basso il tetto di una stalla vuota cede, con un tonfo nell'acqua."
      - "La campana di San Clemente batte il secondo tocco, lento e pesante."
      - "Un tronco intero sbatte contro il ponte, e il colpo arriva fino in piazza."
      - "La pioggia raddoppia, e dal Borgo arriva uno scroscio di tegole cadute."
      - "Dal ponte gridano che l'acqua è alla zampa del leone."
      - "La campana batte il terzo tocco, e l'acqua tocca la criniera del leone."
    avanza_quando:
      - "almeno un segno ogni sei risposte del narratore, nelle scene in cui l'orologio è attivo: quando tocca, il Motore scrive nel contesto «mostralo in questa risposta»"
      - "più uno a ogni cambio di scena: il viaggio della barca e le discussioni consumano la sera. Il segno guadagnato così si mostra nella prima risposta della scena nuova"
      - "all'inizio della scena del terzo tocco, se è sotto sei, sale a sei"
      - "mai due segni nella stessa risposta"
    al_completo: "La Lenta è al leone e la campana ha battuto il terzo tocco. Il console, il paese e Vischi vogliono la catena chiusa subito. Tullio tiene la manovella e guarda i PG: chiude o aspetta sulla loro parola, non da solo. Se chiude, chi è ancora nel Borgo passa la notte sopra l'acqua e all'alba firma per salire sulle barche di Vischi. Se i PG hanno trovato l'onda, Vischi propone davanti a tutti un patto: catena chiusa al tocco e barche gratis per tutti all'alba, e nessuno parla più del pilone. Se il ponte resta aperto, parte l'orologio della rampa: la Bigia, se è già partita per il secondo viaggio, prova a tornare, qualcuno tiene le lanterne sulla rampa con l'acqua alle ginocchia, e all'alba Vischi chiama il debito di Tullio. Vedi il taglio della scena del terzo tocco."

  - id: o_rampa
    nome: "La rampa bassa cede"
    pericolo: p_rampa
    segmenti: 4
    pieni_all_inizio: 0
    # Corre solo nell'ora dopo il terzo tocco, se il ponte è rimasto aperto: è il prezzo della terza via.
    segno_almeno_ogni: 2
    segni:
      - "Sulla rampa bassa l'acqua arriva alle ginocchia, e tira."
      - "Il leone sparisce sotto l'acqua, e la corrente fa un gorgo sul pilone."
      - "Il fiume si porta via un paletto della rampa, con la sua lanterna."
      - "Dal pilone di mezzo sale un gemito lungo, e la rampa trema."
    avanza_quando:
      - "solo dopo il terzo tocco, e solo se il ponte è rimasto aperto"
      - "almeno un segno ogni due risposte del narratore"
      - "subito, anche se la risposta precedente ne aveva uno, quando nessuno tiene le lanterne sulla rampa o la barca si ferma"
      - "mai due segni nella stessa risposta"
    al_completo: "L'acqua è al segno vero: il ponte va chiuso adesso. Chi è sulla rampa risale. Se la barca non è tornata, vira e torna nel Borgo con il suo carico, e passa la notte di là."

  - id: o_firme
    nome: "I debiti stringono il Borgo"
    pericolo: p_vischi
    segmenti: 6
    pieni_all_inizio: 0
    segno_almeno_ogni: 2
    segni:
      - "Lo scrivano stende i fogli sul tavolo lungo, e intinge la penna."
      - "Un barcaiolo bagnato entra, si toglie il berretto e firma con una croce."
      - "Il console alza il bicchiere verso Vischi, e i consiglieri lo imitano."
      - "Lo scrivano ricopia una lista di nomi e la soffia per asciugarla."
      - "Il consiglio vota a mani alzate: catena chiusa al terzo tocco."
      - "Vischi chiude la lista con il suo sigillo, e manda lo scrivano al Passo Vecchio."
    avanza_quando:
      - "almeno un segno ogni due risposte del narratore, mentre i PG sono alla Casa del Sale"
      - "subito, anche se la risposta precedente ne aveva uno, quando un PG accusa Vischi davanti al consiglio senza mostrare una prova"
      - "mai due segni nella stessa risposta"
    al_completo: "La lista è sigillata e il consiglio ha votato. All'alba le barche di Vischi prendono solo chi ha firmato. Il voto si può ancora rovesciare solo al ponte, al terzo tocco, con una prova davanti al console e al paese."

# ---------------------------------------------------------------------------
# RIVELAZIONI (C4): ≥3 indizi, in ≥2 nodi, di ≥2 tipi. Si spuntano quando i giocatori le accettano.
# ---------------------------------------------------------------------------
rivelazioni:
  - id: r_leone
    chiave: true
    conclusione: "Il leone è stato calato: il ponte regge un'ora in più di quanto dice la regola, fino all'onda scolpita."
    indizi: [i_onda_pilone, i_malta_leone, i_libro_piena, i_detto_bellora, i_bice_scrivano, i_rosa_rondini, i_registro_padre, i_corda_nodi, i_ponte_fermo]
  - id: r_vischi
    chiave: true
    conclusione: "Vischi vuole il ponte chiuso al terzo tocco per legare il Borgo ai suoi debiti: le sue barche all'alba prendono solo chi firma."
    indizi: [i_scrivano_corda, i_tullio_minaccia, i_croci_gesso, i_carte_pronte, i_lista_alba, i_vischi_darsena]
  - id: r_ricovero
    chiave: true
    conclusione: "Al Ricovero non stanno bene: Ernesto ha la febbre e non c'è fuoco."
    indizi: [i_lanterna_ricovero, i_fila_ernesto, i_tosse_ernesto, i_legna_bagnata, i_rosa_ernesto]

# Colli di bottiglia (C4): ognuno ha almeno 3 soluzioni.
colli_di_bottiglia_nota: "Tutte le soluzioni funzionano se i PG le tentano. Il narratore non suggerisce quelle segnate «solo se la propone chi la conosce»."
colli_di_bottiglia:
  - id: cb_barca
    ostacolo: "Mettere in acqua la Bigia, piena d'acqua piovana, e portarla nei vicoli del Borgo."
    soluzioni:
      - "Chiederla a Tullio: la dà a chi va a prendere qualcuno, e indica dove sono i remi."
      - "Svuotarla con i secchi del casello e remare: fatica, e un po' di tempo."
      - "Farsi fare da faro da Bice: dal parapetto, con la lanterna alzata, indica i vicoli giusti."
      - "Convincere Nerio e due barcaioli del Borgo, fermi sul ponte, a remare per i PG."
  - id: cb_studio
    ostacolo: "Entrare nello studio di Vischi, alla Casa del Sale, mentre il consiglio è riunito."
    soluzioni:
      - "Ghita è la guardia dello studio stanotte. Solo se la propone chi la conosce (Ghita)."
      - "La porta del magazzino del sale, sul retro, non ha il chiavistello. Solo se la propone chi la conosce (Nives)."
      - "Tenere occupati Vischi e il console nella sala: un brindisi, un discorso, una canzone."
      - "Fingere di voler firmare: lo scrivano porta il PG nello studio, dove stanno le carte."
  - id: cb_prova
    ostacolo: "Mostrare a Tullio e al console che il leone non è il segno vero."
    soluzioni:
      - "Grattare il muschio sopra il leone con una pertica e illuminare l'onda, dal parapetto o dalla barca."
      - "Portare al ponte il registro di Corrado Vischi, preso dalla cassa di ferro."
      - "Leggere a tutti la riga del vecchio Bellora nel libro dei passi, nel casello."
      - "Riferire il ricordo di Rosa sulle rondini: Tullio sa dove stavano i nidi."
      - "Quirino riconosce l'onda dei costruttori e lo spiega. Solo se la propone chi la conosce (Quirino)."
  - id: cb_catena
    ostacolo: "Tenere aperto il ponte dopo il terzo tocco, contro l'ordine del consiglio."
    soluzioni:
      - "Convincere Tullio con una prova sul pilone: decide sulla parola dei PG."
      - "Togliere a Tullio la paura del debito: una promessa davanti a tutti, o il paese che si impegna a pagarlo."
      - "Mostrare la prova al console davanti al paese: Ugolino ritira l'ordine pur di non sembrare complice."
      - "Prendere la manovella con la forza: Tullio non si batte e le due guardie del console nemmeno, ma Tullio perde il casello e il paese la fiducia nei PG."

# ---------------------------------------------------------------------------
# NODI (C5). Quattro scene con scheda; due abbozzi.
# ---------------------------------------------------------------------------
nodi:
  - id: n_ponte
    tipo: luogo
    nome: "Il Ponte delle Lanterne"
    scheda: scena.yaml
    collegamenti: [n_borgo_basso, n_casa_del_sale, n_chiesa, e_terzo_tocco, png_tullio, png_bice, png_vischi]
  - id: n_borgo_basso
    tipo: luogo
    nome: "Il Borgo Basso sott'acqua"
    scheda: scene/scena_borgo_basso.yaml
    collegamenti: [n_ponte, png_rosa]
  - id: n_casa_del_sale
    tipo: luogo
    nome: "La Casa del Sale"
    scheda: scene/scena_casa_del_sale.yaml
    collegamenti: [n_ponte, n_passo_vecchio, png_vischi]
  - id: e_terzo_tocco
    tipo: evento
    nome: "Il terzo tocco"
    scheda: scene/scena_terzo_tocco.yaml
    collegamenti: [n_ponte, n_chiesa, n_passo_vecchio]
  - id: n_chiesa
    tipo: luogo
    nome: "La chiesa di San Clemente"
    abbozzo: "In cima alla Riva Alta. Il Borgo Basso dorme sulla paglia tra le panche, con due stufe accese e le ceste in mezzo. Ci salgono i vecchi del Ricovero e le famiglie, se passano il ponte. Il curato distribuisce coperte e brodo."
    collegamenti: [n_ponte]
  - id: n_passo_vecchio
    tipo: luogo
    nome: "Il Passo Vecchio"
    abbozzo: "Il traghetto dei Vischi, un'ora a valle: barconi neri e rematori pagati. Stanotte la strada dell'argine è sott'acqua: resta la mulattiera della collina, tre ore a piedi nel buio."
    prossima_sessione: true
    collegamenti: []
  - {id: png_tullio, tipo: png, scheda: png/png_tullio.yaml, collegamenti: [n_ponte, e_terzo_tocco]}
  - {id: png_bice, tipo: png, scheda: png/png_bice.yaml, collegamenti: [n_ponte, e_terzo_tocco]}
  - {id: png_vischi, tipo: png, scheda: png/png_vischi.yaml, collegamenti: [n_ponte, n_casa_del_sale, e_terzo_tocco]}
  - {id: png_rosa, tipo: png, scheda: png/png_rosa.yaml, collegamenti: [n_borgo_basso]}

# ---------------------------------------------------------------------------
# SESSIONE (C9–C13). Quattro scene: un menù, non un binario.
# ---------------------------------------------------------------------------
sessione:
  # C9: letto a inizio sessione, prima di scena.apertura. Tre frasi più le tre dell'apertura.
  riassunto_iniziale: "Da tre giorni piove su Vadolungo, e stanotte la Lenta è in piena. Il Borgo Basso passa il ponte con le ceste in spalla. Al terzo tocco della campana, per regola, la catena si chiude."
  cinque_stanze:
    ingresso_o_guardiano: "Tullio alla catena del ponte, con la sola barca del casello e la regola del leone."
    enigma_o_sfida_sociale: "Chi salvare per primo: il consiglio, Vischi, i barcaioli e due lanterne che dicono cose diverse."
    trucco_o_battuta_d_arresto: "Al Ricovero Rosa dice che stanno bene, e non è vero. Alla Casa del Sale il consiglio vota la chiusura e Vischi sigilla la lista."
    climax: "Il terzo tocco: l'acqua al leone, un gruppo ancora di là, la manovella in mano a Tullio. Chiusa, e chi resta passa la notte di là; il patto di Vischi, e nessuno firma ma il leone resta una bugia; aperta, e c'è un'ora a rischio sulla rampa, con il casello perso."
    ricompensa_o_colpo_di_scena: "Il leone calato dal padre di Vischi, e un paese che deve un casello al suo custode."
  scene_potenziali: [scena_ponte_imbrunire, scena_borgo_basso, scena_casa_del_sale, scena_terzo_tocco]
  chiusura: "Una scelta aperta: all'alba andare al Passo Vecchio contro le barche di Vischi, raccogliere con il Borgo il debito di Tullio, o portare il registro del leone davanti a tutto il paese. Si chiede ai giocatori cosa pensano di fare."

# ===========================================================================
# PREPARAZIONE: solo per Preparatore, Critico e Motore. NON va nel contesto del Narratore.
# ===========================================================================
preparazione:

  # C2. Fronti.
  fronti:
    - id: fronte_debiti
      livello: campagna
      nome: "I debiti della Lenta"
      pericoli:
        - id: p_vischi
          tipo: "organizzazione ambiziosa: un prestatore che compra il paese"
          impulso: "possedere"
          destino_incombente: "A primavera Vischi possiede l'argine del Borgo Basso, il Ricovero e il pedaggio del ponte, e il Borgo paga a lui ogni passo."
          presagi:
            - {testo: "Vischi compra i debiti delle Case Lunghe.", segno_visibile: "Croci di gesso sulle porte delle Case Lunghe e del Ricovero."}
            - {testo: "Vischi prepara le firme della notte.", segno_visibile: "Un tavolo con calamaio e fogli nella sala della Casa del Sale."}
          mosse: ["offre un prestito", "chiama un debito", "parla al console", "manda lo scrivano", "offre un accordo a chi sa troppo"]
          cast: [png_vischi]
          orologio: o_firme
        - id: p_casello
          tipo: "debito: un pegno che scade"
          impulso: "scadere"
          destino_incombente: "Il casello e il pedaggio passano a Vischi, e Tullio e Bice restano senza casa."
          presagi:
            - {testo: "Il debito di Tullio pesa sul ponte.", segno_visibile: "Tullio conta e riconta i soldi del pedaggio, al lume, e li mette in un sacchetto a parte."}
          mosse: ["ricorda la scadenza", "toglie la casa", "fa obbedire per paura"]
          cast: [png_tullio]
          orologio: o_casello
      domande_di_posta:
        - "A primavera il Borgo Basso sarà di Vischi?"
        - "Tullio e Bice terranno il casello?"
      orologi_extra:
        - {id: o_casello, nome: "Il casello passa di mano", segmenti: 4, pieni_all_inizio: 2}

    - id: fronte_piena
      livello: avventura
      nome: "La notte della piena"
      pericoli:
        - id: p_piena
          tipo: "forza della natura: la Lenta in piena"
          impulso: "salire"
          destino_incombente: "La Lenta copre il Borgo Basso fino alle grondaie, e chi è rimasto passa la notte sui tetti e sotto le tegole."
          presagi:
            - {testo: "Il Borgo si svuota al primo tocco.", segno_visibile: "File di gente con le ceste e le capre sul ponte, sotto la pioggia."}
          mosse: ["porta via una barca", "sbatte un tronco contro il pilone", "allaga un vicolo", "spegne una lanterna", "copre un gradino della rampa"]
          cast: []
          orologio: o_piena
        - id: p_paura
          tipo: "orda: un paese che ha paura del ponte"
          impulso: "chiudere"
          destino_incombente: "Il ponte chiude al terzo tocco e nessuno osa più guardare il leone, né stanotte né mai."
          presagi:
            - {testo: "Il paese ricorda la piena grande.", segno_visibile: "Ceri accesi a San Clemente per i quattro della rampa bassa."}
          mosse: ["grida di chiudere", "tira la catena", "chiama il console", "isola chi vuole aspettare"]
          cast: []
          orologio: o_paura
        - id: p_rampa
          tipo: "luogo pericoloso: la rampa bassa nell'ora dopo il terzo tocco"
          impulso: "cedere"
          destino_incombente: "La rampa bassa se ne va come nella piena grande, con chi ci sta sopra: fuori scena, mai raccontato."
          presagi:
            - {testo: "La rampa bassa va sott'acqua.", segno_visibile: "L'acqua alle caviglie sulla rampa, a mezzanotte."}
          mosse: ["tira le gambe", "porta via un paletto", "spegne una lanterna", "fa gemere il pilone"]
          cast: []
          orologio: o_rampa
      domande_di_posta:
        - "Il Ricovero e le Case Lunghe saranno all'asciutto prima dell'alba?"
        - "Il ponte resterà aperto dopo il terzo tocco?"
      orologi_extra:
        - {id: o_paura, nome: "Il paese vuole la catena chiusa", segmenti: 4, pieni_all_inizio: 1}

  # C3. Cattivo con agenda.
  cattivo:
    id: png_vischi
    nome: "Leandro Vischi"
    pronuncia: "Leàndro Vìschi"
    ruolo: "mercante di sale e prestatore; consigliere"
    obiettivo: "Possedere l'argine del Borgo Basso e il pedaggio del ponte, con i debiti firmati nella notte della piena."
    cronologia_se_i_pg_non_intervengono:
      - "Due anni fa presta a Tullio quaranta fiorini, con il casello in pegno."
      - "Un mese fa compra dal prestatore di Pieve i debiti delle Case Lunghe; ieri fa segnare le porte con il gesso."
      - "Ieri notte manda lo scrivano a misurare il pilone: vuole sapere quanto manca dal leone all'onda."
      - "Stasera chiede al console di mandare la barca prima al Ricovero, «per carità»: le famiglie delle Case Lunghe restano di là."
      - "Al terzo tocco la catena si chiude. All'alba le sue barche prendono solo chi firma, con la casa in pegno."
      - "A primavera butta giù le Case Lunghe per la darsena e chiede il Ricovero per il debito di Rosa."
    risorse:
      - {cosa: "le barche grandi del Passo Vecchio", a_cosa_serve: "essere l'unico passaggio quando il ponte è chiuso"}
      - {cosa: "i debiti del Borgo e di Tullio", a_cosa_serve: "far firmare, e tenere Tullio alla regola"}
      - {cosa: "il console e il consiglio", a_cosa_serve: "dare alla chiusura la voce della prudenza"}
      - {cosa: "lo scrivano Ottone", a_cosa_serve: "misurare, scrivere, portare gli ordini al Passo Vecchio"}
      - {cosa: "il registro del padre", a_cosa_serve: "sapere la verità sul leone, e tenerla chiusa nella cassa di ferro"}
    reazioni:
      - {intrusione: "i PG vogliono la barca per le Case Lunghe", reazione: "parla di carità per i vecchi e chiede al console di mandarla al Ricovero"}
      - {intrusione: "i PG fanno domande sul leone", reazione: "ricorda i quattro della piena grande, e chiede se vogliono altri morti sulla rampa"}
      - {intrusione: "i PG entrano nello studio", reazione: "chiama la guardia, poi offre un accordo: le barche gratis all'alba, in cambio del silenzio"}
      - {intrusione: "i PG mostrano il registro o l'onda davanti a tutti", reazione: "dice che è un falso, poi chiama il debito di Tullio: all'alba il casello è suo"}
      - {intrusione: "i PG hanno trovato l'onda, ma non l'hanno ancora mostrata al console", reazione: "al terzo tocco propone davanti a tutti un patto: catena chiusa e barche gratis per tutti all'alba, senza firme. Rinuncia alle firme di stanotte per tenere il leone com'è"}
    stato_di_quiete: "Vadolungo viveva del fiume e del ponte: il Borgo pescava e lavava, la Riva comprava, e Tullio faceva passare tutti per un soldo."
    chiamata_all_azione: "La Lenta è in piena, il Ricovero e le Case Lunghe sono tagliati fuori, e la barca del ponte fa in tempo per un gruppo solo."

  # C6. Segreti astratti: una o due frasi, senza luogo fisso.
  segreti_astratti:
    - "Corrado Vischi fece calare il leone di notte, dopo la piena grande, e poi propose lui la regola al consiglio."
    - "Il vecchio Bellora sospettava del leone, ma contro i Vischi non aveva prove."
    - "Rosa ha rifiutato tre volte di vendere il Ricovero a Vischi."
    - "Il console Ugolino deve a Vischi la dote di sua figlia."
    - "Lo scrivano Ottone ha paura dell'acqua e non sa nuotare."
    - "L'oca del Ricovero si chiama Contessa e morde chi alza la voce."
    - "Nerio, il capo dei barcaioli, ha già firmato da Vischi e non l'ha detto a sua moglie."
    - "Mastro Pece, il muratore del leone, è morto senza dire niente. Suo figlio fa il fornaio sulla Riva Alta."
    - "I rematori di Vischi al Passo Vecchio sono pagati fino a mezzogiorno, non un'ora di più."
    - "Bice mette da parte i soldi delle anguille per comprarsi una barca sua."

  # C8. Archi: annotati, non imposti.
  archi:
    campagna_tre_atti:
      - "Atto primo: la notte della piena."
      - "Atto secondo: i debiti del Borgo."
      - "Atto terzo: di chi è il ponte."
    pg:
      pg_dalia: {tu: "chierica cresciuta al Ricovero", bisogno: "smettere di essere la bambina di Rosa", vai: "la lanterna del Ricovero dondola troppo in fretta", cerca: "la verità su Ernesto", trova: "che Rosa le mente per proteggerla", paga: "contraddice Rosa davanti a tutti", ritorna: "porta i vecchi al caldo, o li lascia per altri", cambia: "decide da adulta, e lo dice"}
      pg_quirino: {tu: "studioso di ponti che nessuno legge", bisogno: "che il suo sapere serva a qualcosa", vai: "vede il leone e qualcosa non torna", cerca: "il segno dei costruttori", trova: "l'onda sotto il muschio", paga: "mette la sua parola contro la regola di un paese", ritorna: "spiega a Tullio cosa ha visto", cambia: "da topo di biblioteca a uomo che risponde delle sue misure"}
      pg_nives: {tu: "barcaiola senza barca", bisogno: "smettere di vergognarsi del debito", vai: "le Case Lunghe con la lanterna ferma", cerca: "un modo di salvare i suoi senza firmare", trova: "le carte già pronte di Vischi", paga: "mostra il suo debito davanti a tutti", ritorna: "riporta a casa la sua gente", cambia: "da debitrice a chi parla per il Borgo"}
      pg_arrigo: {tu: "venditore ambulante, simpatico e in debito con tutti", bisogno: "pagare almeno un debito, una volta", vai: "Tullio gli ha fatto credito per vent'anni", cerca: "perché Tullio obbedisce a Vischi", trova: "la minaccia sul casello", paga: "rischia per Tullio quello che non ha mai rischiato", ritorna: "tiene la parola data", cambia: "da chi deve a chi restituisce"}
      pg_ghita: {tu: "guardia a pagamento", bisogno: "un lavoro che non le faccia vergogna", vai: "Vischi la paga per sorvegliare lo studio", cerca: "che cosa sta sorvegliando", trova: "le firme e il registro", paga: "rompe il patto e perde la paga", ritorna: "tiene la rampa con le lanterne", cambia: "da spada in affitto a guardia del ponte"}

  # Cronologia e logistica: i conti che il validatore rifà (strumenti/valida/regole_mondo.py, classe MONDO).
  # Nella prova cieca il revisore ha trovato proprio qui gli errori più gravi (due viaggi tra due tocchi,
  # una barca da otto per gruppi di venti, una riga del libro datata prima del fatto). Le ore scelte:
  # l'ultima notte di novembre il sole cala verso le cinque, quindi primo tocco alle 17:00, secondo a metà
  # sera (20:30), terzo a mezzanotte; l'acqua va dal leone all'onda in un'ora (01:00); l'alba alle 7.
  # «giorno: 1» è la notte dopo la mezzanotte. Qui ci sono segreti: preparazione non va al narratore.
  cronologia:
    eventi:
      # --- il passato che fonda i segreti ---------------------------------------------------------
      - {id: t_ponte_costruito, quando: {anni_fa: 300}, fatti: [f_onda_pontieri, f_ponte_unico],
         cosa: "I Pontieri della Valle costruiscono il ponte e scolpiscono sul pilone di mezzo l'onda, il segno vero dell'acqua pericolosa."}
      - {id: t_piena_grande, quando: {anni_fa: 40, giorni_fa: 20}, fatti: [f_piena_grande, f_rondini],
         cosa: "Nella piena grande l'acqua arriva all'onda, dove stava allora il leone, all'altezza dei nidi delle rondini: la rampa bassa se ne va, e quattro persone non tornano."}
      - {id: t_leone_calato, quando: {anni_fa: 40, giorni_fa: 12}, fatti: [f_leone_calato, f_padre_vischi, f_malta_chiara],
         cosa: "Di notte, a piena finita, mastro Pece smura il leone e lo rimette due spanne più in basso, con una malta chiara. Paga Corrado Vischi."}
      - {id: t_regola, quando: {anni_fa: 40, giorni_fa: 5}, fatti: [f_regola_leone],
         cosa: "Corrado Vischi propone al consiglio la regola del leone: catena chiusa quando l'acqua tocca la criniera. Il consiglio la vota."}
      - {id: t_piena_bellora, quando: {anni_fa: 35}, fatti: [f_libro_piena, f_bellora_guardava],
         cosa: "In una piena l'acqua tocca la criniera del leone calato e il ponte non si muove. Il vecchio Bellora, ancora custode, lo scrive nel libro dei passi; da allora, nelle notti d'acqua, guarda l'onda."}
      - {id: t_tullio_custode, quando: {anni_fa: 30}, fatti: [f_tullio_custode],
         cosa: "Tullio prende il casello dal padre: le pagine del vecchio Bellora finiscono qui, e Tullio non le rilegge più."}
      - {id: t_credito_arrigo, quando: {anni_fa: 20},
         cosa: "Tullio comincia a far passare Arrigo a credito: una pagina intera del libro dei passi."}
      - {id: t_debito_tullio, quando: {anni_fa: 2}, fatti: [f_debito_tullio],
         cosa: "Tullio prende da Vischi quaranta fiorini per il tetto del casello, con il casello in pegno."}
      - {id: t_debiti_comprati, quando: {giorni_fa: 30}, fatti: [f_debiti_borgo],
         cosa: "Vischi compra dal prestatore di Pieve tutti i debiti delle Case Lunghe."}
      - {id: t_minaccia, quando: {giorni_fa: 7}, fatti: [f_minaccia_tullio],
         cosa: "Sotto la tettoia del ponte Vischi dice piano a Tullio che, se tiene aperto dopo il terzo tocco, all'alba il casello è suo. Arrigo lo sente."}
      - {id: t_messa, quando: {giorni_fa: 4}, fatti: [f_ernesto_tosse],
         cosa: "Domenica, a messa a San Clemente, Ernesto tossisce già forte."}
      - {id: t_pioggia, quando: {giorni_fa: 3}, fatti: [f_piena],
         cosa: "Comincia a piovere su Vadolungo, e la Lenta cresce."}
      - {id: t_legna, quando: {giorni_fa: 1, ora: "10:00"}, fatti: [f_legna_bagnata, f_ernesto_febbre],
         cosa: "Al Ricovero l'acqua entra nel sottoscala e copre la legna; la stufa di sopra si spegne, ed Ernesto ha la febbre alta."}
      - {id: t_croci, quando: {giorni_fa: 1, ora: "15:00"}, fatti: [f_croci_gesso],
         cosa: "Lo scrivano segna con una croce di gesso le porte delle Case Lunghe e del Ricovero."}
      - {id: t_contratti, quando: {giorni_fa: 1, ora: "18:00"}, fatti: [f_carte_pronte],
         cosa: "Alla Casa del Sale lo scrivano scrive in bella copia i contratti di prestito con i nomi delle Case Lunghe e di Rosa, la casa in pegno."}
      # --- il giorno della sessione ---------------------------------------------------------------
      - {id: t_misura, quando: {ora: "05:30"}, fatti: [f_scrivano_misura, f_bice_anguille],
         cosa: "Prima dell'alba lo scrivano, da una barca, misura il pilone con la corda a nodi dal leone in su e gratta il muschio due spanne più in alto. Bice, a pescare anguille sotto l'arcata, lo vede."}
      - {id: t_scrivano_torna, quando: {ora: "07:00"},
         cosa: "All'alba lo scrivano torna fradicio con la corda a nodi e dice al padrone: due spanne giuste. Ghita lo vede, e Vischi la paga per la notte di guardia."}
      - {id: t_ordine, quando: {ora: "11:00"}, fatti: [f_ordine_consiglio, f_console],
         cosa: "Il consiglio ordina di chiudere la catena al terzo tocco: a quell'ora l'acqua sarà al leone."}
      - {id: t_lista, quando: {ora: "16:00"}, fatti: [f_barche_firma],
         cosa: "Alla Casa del Sale Vischi scrive di suo pugno, in cima alla lista per le barche dell'alba, «solo chi ha firmato»."}
      - {id: t_primo_tocco, quando: {ora: "17:00"}, fatti: [f_tocchi, f_borgo_passato, f_ricovero, f_case_lunghe],
         cosa: "Al tramonto la campana batte il primo tocco. Quasi tutto il Borgo Basso ha passato il ponte; il Ricovero e le Case Lunghe sono tagliati fuori. Comincia la sessione, sul ponte."}
      - {id: t_carita, quando: {ora: "17:10"}, fatti: [f_barche_vischi],
         cosa: "Sotto la tettoia Vischi chiede al console di mandare la barca prima al Ricovero, per carità, e promette le sue barche all'alba."}
      - {id: t_corda_ponte, quando: {ora: "17:20"}, segno: {orologio: o_piena, n: 1},
         cosa: "Al primo segno della piena lo scrivano scende dalla tettoia con la corda a nodi, conta i nodi sul leone e torna a scrivere."}
      - {id: t_prima_partenza, quando: {ora: "17:30"}, fatti: [f_barca_bigia],
         cosa: "Il primo momento in cui la Bigia, svuotata con i secchi, può partire per il Borgo."}
      - {id: t_secondo_tocco, quando: {ora: "20:30"}, fatti: [f_tocchi], segno: {orologio: o_piena, n: 4},
         cosa: "A metà sera la campana batte il secondo tocco. Una barca che parte adesso torna dopo il terzo."}
      - {id: t_primo_ritorno, quando: {ora: "21:15"}, fatti: [f_un_viaggio, f_un_gruppo],
         cosa: "Se è partita al più presto, la Bigia torna alla rampa con un gruppo. Se riparte subito per l'altro capo del Borgo, è il secondo viaggio."}
      - {id: t_voto, quando: {ora: "22:30"}, fatti: [f_consiglio_sale],
         cosa: "Se nessuno lo ferma, il consiglio conferma a mani alzate la catena chiusa al terzo tocco, e Vischi sigilla la lista."}
      - {id: t_paese_al_ponte, quando: {ora: "23:30"},
         cosa: "Il paese scende al ponte con lanterne e ceri; sulla rampa bassa l'acqua è alle caviglie."}
      - {id: t_terzo_tocco, quando: {ora: "24:00"}, fatti: [f_tocchi, f_regola_leone], segno: {orologio: o_piena, n: 8},
         cosa: "A mezzanotte la campana batte il terzo tocco e l'acqua tocca la criniera; il ponte non trema. Se i PG non fanno niente, Tullio chiude la catena, e chi è di là passa la notte sopra l'acqua."}
      - {id: t_scrivano_passo, quando: {giorno: 1, ora: "00:15"},
         cosa: "A catena chiusa senza patto, Vischi manda lo scrivano al Passo Vecchio con la lista sigillata, per la mulattiera della collina."}
      - {id: t_secondo_ritorno, quando: {giorno: 1, ora: "01:00"}, fatti: [f_secondo_viaggio],
         cosa: "Nel migliore dei casi (prima partenza alle 17:30, ripartenza subito) la Bigia torna dal secondo viaggio: un'ora dopo il terzo tocco."}
      - {id: t_onda, quando: {giorno: 1, ora: "01:00"}, fatti: [f_ora_in_piu], segno: {orologio: o_rampa, n: 4},
         cosa: "L'acqua arriva all'onda scolpita: la rampa bassa se ne va, e il ponte va chiuso adesso."}
      - {id: t_alba, quando: {giorno: 1, ora: "07:00"}, fatti: [f_barche_firma],
         cosa: "All'alba le barche nere di Vischi risalgono dal Passo Vecchio e prendono solo chi ha firmato. Se il ponte è rimasto aperto, Vischi bussa al casello con il foglio del debito."}
      - {id: t_primavera, quando: {giorno: 120}, fatti: [f_darsena],
         cosa: "A primavera Vischi butta giù le Case Lunghe per la darsena e chiede il Ricovero per il debito di Rosa."}
    # Ogni indizio di tipo documento, più le carte datate su cui la storia si regge.
    documenti:
      - {id: doc_registro_padre, indizio: i_registro_padre, fatti: [f_registro_padre], datato: {anni_fa: 40, giorni_fa: 11}, prova: [t_leone_calato],
         cosa: "La riga del registro di Corrado Vischi, nella cassa di ferro: dieci fiorini a mastro Pece, per il leone del ponte, lavoro di notte, due spanne. È del giorno dopo il lavoro, pochi giorni dopo la piena grande."}
      - {id: doc_libro_piena, indizio: i_libro_piena, fatti: [f_libro_piena], datato: {anni_fa: 35}, prova: [t_piena_grande, t_leone_calato, t_piena_bellora],
         cosa: "La riga del vecchio Bellora nelle sue pagine del libro dei passi: «Acqua alla criniera, ponte saldo. Acqua all'onda, la rampa se ne va.» Ha senso solo a leone già calato."}
      - {id: doc_carte_pronte, indizio: i_carte_pronte, fatti: [f_carte_pronte], datato: {giorni_fa: 1, ora: "18:00"}, prova: [t_debiti_comprati, t_contratti],
         cosa: "I contratti di prestito in bella copia, con i nomi delle Case Lunghe (i debiti comprati a Pieve) e di Rosa Galli, la casa in pegno e nessuna firma."}
      - {id: doc_lista_alba, indizio: i_lista_alba, fatti: [f_barche_firma], datato: {ora: "16:00"}, prova: [t_lista],
         cosa: "La lista per le barche dell'alba, che lo scrivano ricopia al tavolo: in cima, di pugno di Vischi, «solo chi ha firmato»."}
      - {id: doc_foglio_debito, fatti: [f_debito_tullio], datato: {anni_fa: 2}, prova: [t_debito_tullio],
         cosa: "Il foglio del debito di Tullio, con il sigillo di Vischi: quaranta fiorini per il tetto, il casello in pegno. All'alba Vischi bussa al casello con questo."}
      - {id: doc_lettera_madre, datato: {giorni_fa: 25}, prova: [t_debiti_comprati],
         cosa: "La lettera della madre di Nives: Vischi ha comprato dal prestatore di Pieve tutti i debiti delle Case Lunghe."}
      - {id: doc_pagina_arrigo, datato: {anni_fa: 20}, prova: [t_credito_arrigo],
         cosa: "La pagina di Arrigo nel libro dei passi, tra quelle di Tullio: vent'anni di passaggi a credito, mai un soldo."}
  logistica:
    durate:
      - {id: d_svuotare, minuti: 30, fatti: [f_barca_bigia],
         cosa: "Svuotare la Bigia, mezza piena di pioggia, con i secchi del casello, e prendere i remi."}
      - {id: d_viaggio, minuti: 225, fatti: [f_un_viaggio],
         cosa: "Un viaggio della Bigia nel Borgo, andata e ritorno: i vicoli a spinta di pertica, il carico di un gruppo intero (i vecchi giù dalla scala, i bambini dal ballatoio uno alla volta), il ritorno carica. Più di metà della sera, che dal primo al terzo tocco è di sette ore."}
      - {id: d_casa_sale, minuti: 120, fatti: [f_consiglio_sale],
         cosa: "Una visita alla Casa del Sale durante il consiglio, studio compreso, con i cinquanta passi di andata e ritorno."}
      - {id: d_mulattiera, minuti: 180,
         cosa: "Dalla Riva Alta al Passo Vecchio a piedi, al buio, per la mulattiera della collina: la strada dell'argine è sott'acqua."}
      - {id: d_risalita, minuti: 90, fatti: [f_barche_vischi],
         cosa: "Le barche nere di Vischi risalgono la piena dal Passo Vecchio fino al ponte."}
    capienze:
      - {id: c_bigia, posti: 20, fatti: [f_barca_bigia],
         cosa: "La Bigia, la chiatta del ponte: una ventina di persone strette."}
    gruppi:
      - {id: g_pg, persone: 4, cosa: "I PG a bordo: al massimo quattro, quanti i giocatori."}
      - {id: g_ricovero, persone: 8, fatti: [f_ricovero], cosa: "I sette vecchi del Ricovero e Rosa (l'oca Contessa non conta)."}
      - {id: g_barella, persone: 2, fatti: [f_ernesto_febbre], cosa: "Il posto in più di Ernesto disteso sulla barella: tre posti invece di uno."}
      - {id: g_case_lunghe, persone: 15, fatti: [f_case_lunghe], cosa: "Le quattro famiglie delle Case Lunghe: nove bambini e sei grandi."}
      - {id: g_nerio, persone: 1, cosa: "Nerio, il capo dei barcaioli, se salta in barca."}
      - {id: g_barcaioli, persone: 2, cosa: "I due barcaioli del Borgo fermi sul ponte, se remano con Nerio."}
    verifiche:
      # --- tempi della barca e dei tocchi ---------------------------------------------------------
      - {tra: [t_primo_tocco, t_terzo_tocco], ci_sta: [d_svuotare, d_viaggio],
         perche: "«Prima del terzo tocco ci sta un viaggio» (f_un_viaggio, Tullio): svuotata la barca, un viaggio torna in tempo."}
      - {tra: [t_primo_tocco, t_terzo_tocco], non_ci_sta: [d_viaggio, d_viaggio],
         perche: "«Ne entra uno solo»: due viaggi non tornano prima del terzo tocco nemmeno partendo al primo."}
      - {tra: [t_secondo_tocco, t_terzo_tocco], non_ci_sta: [d_viaggio],
         perche: "Il viaggio dura più di metà della sera: chi parte al secondo tocco torna dopo il terzo. Per questo la prima scena chiede se la Bigia partirà prima del secondo tocco."}
      - {tra: [t_prima_partenza, t_onda], ci_sta: [d_viaggio, d_viaggio],
         perche: "Il secondo viaggio, se la barca riparte appena tornata, torna un'ora dopo il terzo tocco (f_secondo_viaggio): proprio l'ora che il ponte regge (f_ora_in_piu). Non c'è margine: decide l'orologio della rampa."}
      - {tra: [t_terzo_tocco, t_onda], non_ci_sta: [d_viaggio],
         perche: "Un viaggio che parte al terzo tocco non torna prima dell'onda: a mezzanotte il secondo viaggio c'è solo se la barca è già nel Borgo (scena del terzo tocco)."}
      - {tra: [t_primo_ritorno, t_terzo_tocco], ci_sta: [d_casa_sale],
         perche: "La Casa del Sale si può giocare dopo il Borgo Basso, e si torna al ponte per il terzo tocco."}
      - {tra: [t_primo_tocco, t_terzo_tocco], ci_sta: [d_casa_sale, d_svuotare, d_viaggio],
         perche: "La Casa del Sale si può giocare anche prima del Borgo: la barca fa ancora in tempo al suo viaggio."}
      - {tra: [t_scrivano_passo, t_alba], ci_sta: [d_mulattiera, d_risalita],
         perche: "Lo scrivano porta la lista sigillata al Passo Vecchio dopo il tocco, e le barche nere arrivano lo stesso all'alba."}
      # --- posti sulla Bigia -----------------------------------------------------------------------
      - {capienza: c_bigia, porta: [g_pg, g_ricovero, g_barella],
         perche: "La Bigia porta il Ricovero intero, anche con un vecchio disteso, con i PG a bordo."}
      - {capienza: c_bigia, porta: [g_pg, g_case_lunghe],
         perche: "La Bigia porta le Case Lunghe intere, con i PG a bordo."}
      - {capienza: c_bigia, porta: [g_nerio, g_pg, g_case_lunghe],
         perche: "Se i PG esitano, Nerio salta in barca e parte con chi risponde: ci stanno anche con il gruppo più grande."}
      - {capienza: c_bigia, porta: [g_nerio, g_barcaioli, g_case_lunghe],
         perche: "Nerio e due barcaioli possono remare al posto dei PG (cb_barca)."}
      - {capienza: c_bigia, non_porta: [g_ricovero, g_case_lunghe],
         perche: "Un gruppo per volta (f_un_gruppo): i due gruppi insieme non ci stanno nemmeno senza i PG, oltre a stare ai due capi del Borgo."}
