# Repertorio di Tullio Bellora, il custode del ponte. Voce: tu a tutti, lei a Vischi e al console.
# Frasi di tre-otto parole, lessico di pedaggio e di pietra. Tic: «Un soldo, e passi.»
# Segnale quando mente: si gratta la nuca sotto il berretto e si guarda le scarpe.
# Menzogna registrata: tul_catena = «perché chiude la catena al terzo tocco».

battute:

  # --- esempi di voce (solo_esempio) ----------------------------------------------------------
  - id: tul_saluto
    chi: png_tullio
    tipo: saluto
    solo_esempio: true
    quando: "i PG arrivano alla catena o salutano Tullio"
    temi: [saluto, salve, buonasera, custode]
    testo:
      - "[narratore] Tullio batte la chiave della manovella sul palmo."
      - "[png_tullio] Sera. Stanotte si passa a credito, il soldo lo segno."
    varianti:
      - ["[png_tullio] Avanti, avanti. Il ponte non aspetta, e il fiume nemmeno."]
    max_usi: 2
  - id: tul_rifiuto
    chi: png_tullio
    tipo: rifiuto
    solo_esempio: true
    quando: "un PG chiede a Tullio di cose lontane dal ponte"
    temi: [domanda]
    testo:
      - "[png_tullio] Io so di pietre e di soldi. Il resto chiedilo al fiume."
    max_usi: 1
  - id: tul_domanda_gentile
    chi: png_tullio
    tipo: reazione
    solo_esempio: true
    quando: "un PG chiede a Tullio come sta"
    temi: [gentile]
    testo:
      - "[png_tullio] Bagnato fino alle ossa. Trent'anni di ponte, e mai un'acqua così."
    max_usi: 1
  - id: tul_accusa
    chi: png_tullio
    tipo: reazione
    solo_esempio: true
    quando: "un PG accusa Tullio di lasciare il Borgo di là"
    temi: [accuso]
    testo:
      - "[narratore] Tullio smette di battere la chiave."
      - "[png_tullio] Trent'anni che faccio passare tutti. Tu quanti ne hai fatti passare?"
    max_usi: 1
  - id: tul_minaccia
    chi: png_tullio
    tipo: reazione
    solo_esempio: true
    quando: "un PG minaccia Tullio o mette le mani sulla manovella"
    temi: [minaccia]
    testo:
      - "[png_tullio] Giù le mani dal mio ferro. Sul ponte comando io."
    max_usi: 1
  - id: tul_offerta
    chi: png_tullio
    tipo: reazione
    solo_esempio: true
    quando: "un PG offre a Tullio i soldi del pedaggio"
    temi: [soldi]
    testo:
      - "[png_tullio] Tieni i soldi. Stanotte il libro fa credito a tutti."
    max_usi: 1
  - id: tul_aiuto
    chi: png_tullio
    tipo: reazione
    solo_esempio: true
    quando: "un PG aiuta Tullio con la catena o con le ceste"
    temi: [aiuto]
    testo:
      - "[png_tullio] Buon braccio. Tira piano, che la catena morde."
    max_usi: 1

  # --- selezionabili --------------------------------------------------------------------------
  - id: tul_barca
    chi: png_tullio
    tipo: momento
    quando: "un PG chiede a Tullio la barca per andare nel Borgo"
    temi: [barca, remi, prestami, prestare, borgo]
    testo:
      - "[png_tullio] La barca è tua. I remi stanno nel casello, dietro la stufa."
      - "[narratore] Tullio indica la scaletta che scende al pontile, senza lasciare la catena."
      - "[png_tullio] Prima del terzo tocco ci sta un viaggio solo. Scegli bene dove."
    max_usi: 1
  - id: tul_detto
    chi: png_tullio
    tipo: indizio
    quando: "un PG chiede a Tullio del leone, della regola o di suo padre"
    temi: [leone, regola, criniera, padre]
    testo:
      - "[png_tullio] Mio padre diceva: il leone ha paura dell'acqua, il ponte no."
      - "[narratore] Tullio guarda il pilone di mezzo, poi scuote la testa."
      - "[png_tullio] Nelle notti d'acqua guardava più su del leone. Mai capito perché."
    effetti: {rivela_indizi: [i_detto_bellora], fatti_noti: [f_bellora_guardava]}
    max_usi: 1
  - id: tul_costruttori
    chi: png_tullio
    tipo: verita
    quando: "un PG chiede a Tullio chi ha costruito il ponte"
    temi: [costruttori, costruito, pontieri, costruire]
    testo:
      - "[png_tullio] I Pontieri della Valle, trecento anni fa. Pietra su pietra, senza un chiodo."
      - "[narratore] Tullio batte la mano sul parapetto, come sul collo di un cavallo."
    max_usi: 1
  - id: tul_libro_credito
    chi: png_tullio
    tipo: verita
    quando: "un PG chiede a Tullio dei passaggi segnati a credito"
    temi: [credito, crediti, pagina, debiti, segnato]
    testo:
      - "[png_tullio] Trent'anni di crediti, segnati qui. C'è chi ha una pagina intera."
      - "[narratore] Tullio batte il dito su una pagina fitta, e quasi sorride."
      - "[png_tullio] Paga in canzoni, quello. Stonate."
    max_usi: 1
  - id: tul_catena_domanda
    chi: png_tullio
    tipo: menzogna
    quando: "un PG chiede a Tullio di aspettare, o perché chiuderà al terzo tocco"
    temi: [aspettare, aspetta, aspetti, chiudi, chiudere, chiusura, catena]
    testo:
      - "[narratore] Tullio si gratta la nuca sotto il berretto e si guarda le scarpe."
      - "[png_tullio] La regola è la regola. Al leone si chiude, e basta."
    varianti:
      - ["[narratore] Tullio si gratta la nuca sotto il berretto, e si guarda le scarpe.", "[png_tullio] Te l'ho detto. Al leone si chiude, e basta."]
    effetti: {menzogna_detta: tul_catena}
    max_usi: 2

  # --- confessioni: una per ogni condizione di cede_se ----------------------------------------
  - id: tul_catena_casello
    chi: png_tullio
    tipo: confessione
    quando: "dentro il casello, a porta chiusa, un PG chiede a Tullio perché obbedisce"
    temi: [obbedisci, obbedire, paura, debito, tetto]
    richiede:
      privata: true
      battute_usate: [tul_catena_domanda]
      battute_non_usate: [tul_catena_arrigo, tul_catena_registro]
    testo:
      - "[narratore] Tullio chiude lo sportello della stufa e si toglie il berretto."
      - "[png_tullio] Il tetto nuovo me l'ha pagato Vischi. Il casello è in pegno."
      - "[png_tullio] Se tengo aperto dopo il tocco, il debito scade. E all'alba il casello è suo."
      - "[png_tullio] Bice non lo sa. Dimmi tu cosa faccio."
    effetti: {rivela_indizi: [i_tullio_minaccia], fatti_noti: [f_minaccia_tullio, f_debito_tullio]}
    max_usi: 1
  - id: tul_catena_arrigo
    chi: png_tullio
    tipo: confessione
    quando: "un PG ripete a Tullio le parole di Vischi sentite sotto la tettoia"
    temi: [tettoia, sentito, sentite, parole, minacciato]
    richiede:
      da_pg: [pg_arrigo]
      battute_usate: [tul_catena_domanda]
      battute_non_usate: [tul_catena_casello, tul_catena_registro]
    testo:
      - "[narratore] Tullio smette di battere la chiave, e abbassa la voce."
      - "[png_tullio] Allora l'hai sentito anche tu. Sì, il tetto me l'ha pagato lui."
      - "[png_tullio] Il casello è in pegno. Se tengo aperto dopo il tocco, all'alba è suo."
    effetti: {rivela_indizi: [i_tullio_minaccia], fatti_noti: [f_minaccia_tullio, f_debito_tullio]}
    max_usi: 1
  - id: tul_catena_registro
    chi: png_tullio
    tipo: confessione
    quando: "un PG mostra a Tullio il registro trovato nella cassa di ferro"
    temi: [registro, mostro, leggi, pece]
    richiede:
      indizi_rivelati: [i_registro_padre]
      battute_non_usate: [tul_catena_casello, tul_catena_arrigo]
    testo:
      - "[narratore] Tullio legge piano, muovendo le labbra, e diventa rosso fino al berretto."
      - "[png_tullio] Corrado Vischi ha calato il leone. E suo figlio mi tiene con il tetto."
      - "[png_tullio] Sì, il casello è in pegno. Se tengo aperto dopo il tocco, all'alba è suo."
    effetti: {rivela_indizi: [i_tullio_minaccia], fatti_noti: [f_minaccia_tullio, f_debito_tullio]}
    max_usi: 1

  # --- momenti del terzo tocco ----------------------------------------------------------------
  - id: tul_catena_decide
    chi: png_tullio
    tipo: momento
    scena: scena_terzo_tocco
    quando: "verso il terzo tocco, un PG parla con Tullio alla manovella"
    temi: [manovella, decidi, decidere, decidiamo, rintocco]
    richiede: {orologio: {id: o_piena, min: 7, max: 8}}
    testo:
      - "[png_tullio] Io tengo la catena. La testa mettetecela voi."
      - "[narratore] Tullio vi guarda uno per uno, con la mano ferma sulla manovella."
      - "[png_tullio] Ditemi voi. Chiudo, o aspetto?"
    max_usi: 1
  - id: tul_ponte_aperto
    chi: png_tullio
    tipo: momento
    scena: scena_terzo_tocco
    quando: "dopo il terzo tocco, i PG chiedono a Tullio di non chiudere la catena"
    temi: [aspetta, aspettare, aperto, aperta, apri, tienila]
    richiede: {orologio: {id: o_piena, min: 8, max: 8}, indizi_rivelati: [i_onda_pilone], battute_non_usate: [tul_catena_tesa]}
    testo:
      - "[narratore] Tullio guarda il pilone di mezzo, poi la manovella, e non la gira."
      - "[png_tullio] Fino all'onda, non di più. E la rampa la tenete voi."
      - "[narratore] Dall'imbocco il paese mormora, e Vischi parla piano al console."
    max_usi: 1
  - id: tul_senza_prova
    chi: png_tullio
    tipo: rifiuto
    scena: scena_terzo_tocco
    quando: "dopo il terzo tocco, i PG chiedono a Tullio di aspettare a chiudere"
    temi: [aspetta, aspettare, aperto, aperta, apri, tienila]
    richiede: {orologio: {id: o_piena, min: 8, max: 8}, indizi_non_rivelati: [i_onda_pilone]}
    testo:
      - "[png_tullio] Aperto con che cosa? Con le chiacchiere?"
      - "[narratore] Tullio batte la mano sul parapetto, sopra il pilone di mezzo."
      - "[png_tullio] Fammi vedere una pietra, e ti credo."
    max_usi: 1
  - id: tul_catena_tesa
    chi: png_tullio
    tipo: momento
    scena: scena_terzo_tocco
    quando: "al terzo tocco, i PG dicono a Tullio di chiudere"
    temi: [chiudi, chiudila, chiudere, tendi, tendila]
    richiede: {orologio: {id: o_piena, min: 8, max: 8}, battute_non_usate: [tul_ponte_aperto]}
    testo:
      - "[narratore] Tullio gira la manovella, e la catena si alza e si tende tra i paletti."
      - "[png_tullio] Fatto. Che il fiume ci perdoni."
    max_usi: 1

  # --- riempitivo -----------------------------------------------------------------------------
  - id: tul_conta
    chi: png_tullio
    tipo: momento
    riempitivo: true
    scena: scena_ponte_imbrunire
    quando: "i PG indugiano vicino al casello"
    temi: [attesa]
    testo:
      - "[narratore] Tullio conta al lume i soldi del pedaggio, uno per uno."
      - "[narratore] Poi li mette in un sacchetto a parte, e lo stringe forte."
      - "[png_tullio] Undici. Dodici. Non bastano mai."
    max_usi: 1
