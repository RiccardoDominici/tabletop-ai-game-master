# Scheda scena/luogo (manuale §4): l'osteria del Forno Vecchio, nella Notte dei Lumi.
# Durata prevista: 20–30 minuti, 3–4 giocatori. Niente combattimento, niente dadi.

id: scena_forno_vecchio
nodo: n_osteria
nome: "L'osteria del Forno Vecchio, nella Notte dei Lumi"

# Pianta, per non inventare (il Narratore la usa, non la legge a voce così com'è).
descrizione: "Una sala bassa con le travi nere di fumo. In fondo il forno a legna, acceso. A destra il bancone; dietro, una tenda copre il retro con i sacchi di farina. Al centro il tavolo lungo con le ceste del pane. A sinistra la porta del ripostiglio, con una grata all'altezza degli occhi: lì siede Baldrin. La finestra dà sulla piazza, il pozzo e la cappella. La porta d'ingresso si apre sotto il portico. Chi sente cosa: Baldrin, seduto accanto alla grata, sente tutto ciò che si dice nella sala e alla grata. Non sente ciò che si dice nel retro dietro la tenda, in cantina, sotto il portico, né quando è alla finestra."

# C12: scopo dall'elenco chiuso, e domanda drammatica da sì o no.
scopo: {tipo: rivelare_indizio, rif: i_speroni_neri}
domanda_drammatica: "Al terzo rintocco, il paese si prenderà Sebastiano?"

posta:
  si_guadagna:
    cosa: "La vita di Sebastiano, e un paese che non mangia il pane guasto."
    per_chi: [png_sebastiano, png_baldrin, pg_ginestra, pg_teodora]
  si_perde:
    cosa: "Sebastiano finisce nella neve e il paese spezza il pane dei lumi. Oppure, se la verità esce male, Ottavia perde l'osteria e la faccia davanti a tutti."
    per_chi: [png_sebastiano, png_ottavia, pg_assenzio, pg_corrado]

intensita: 4

# Esattamente 3 dettagli sensoriali, almeno 2 non visivi.
sensi:
  - "Odore di pane di segale appena sfornato, con un fondo amaro, come di muffa."   # olfatto
  - "Il canto della veglia arriva a ondate dalla cappella, oltre la piazza."       # udito
  - "Il caldo del forno sulla faccia, il freddo della porta sulla schiena."         # tatto

elementi_interattivi:
  - {cosa: "le ceste del pane dei lumi", dove: "sul tavolo lungo, coperte di lino bianco", azioni: "si possono scoprire, spezzare, nascondere, rovesciare, buttare nel forno"}
  - {cosa: "la porta del ripostiglio", dove: "a sinistra, con la grata all'altezza degli occhi", azioni: "si parla attraverso la grata; la chiave è al collo di Baldrin; la serratura è vecchia e si può forzare, ma scatta forte"}
  - {cosa: "i sacchi di segale", dove: "nel retro, dietro la tenda", azioni: "si possono aprire, annusare, setacciare tra le dita"}
  - {cosa: "il quaderno dei conti", dove: "sotto il bancone, unto di farina", azioni: "si può sfogliare"}
  - {cosa: "la borsa di Sebastiano", dove: "ai piedi di Baldrin", azioni: "Baldrin la mostra volentieri come prova; si può frugare se lui lo permette"}
  - {cosa: "il forno a legna", dove: "in fondo alla sala", azioni: "ci si può buttare dentro qualcosa; il fumo esce dalla canna sulla piazza"}
  - {cosa: "Moro, il cane", dove: "accucciato vicino al forno", azioni: "si può guardare, accarezzare; la sua ciotola è accanto"}
  - {cosa: "la finestra sulla piazza", dove: "accanto all'ingresso", azioni: "si vedono il pozzo, la casa di Tecla, la cappella illuminata; si può aprire e gridare"}
  - {cosa: "la botola del ripostiglio", dove: "nel pavimento del ripostiglio, sotto un sacco vuoto", azioni: "scende in cantina; dalla cantina una scala sale nel retro e una grata dà sotto il portico. NASCOSTA: non nominarla finché non la nomina chi la conosce, o finché un PG non scende in cantina dal retro"}

png_presenti: [png_ottavia, png_baldrin, png_sebastiano]
orologi_attivi: [o_colpevole]

# Indizi trovabili in questa scena. Un indizio essenziale non richiede tiri (F3).
# In F0 non ci sono dadi: `tiro` dice solo cosa deciderebbe un tiro nelle fasi successive.
indizi:
  - id: i_speroni_neri
    conclusione: r_pane
    tipo: oggetto
    nodo: n_osteria
    essenziale: true
    tiro: "nessuno"
    modi: 2   # aprire un sacco; spezzare una pagnotta
    come_si_trova: "Chi apre un sacco nel retro, o spezza una pagnotta delle ceste, trova chicchi neri e curvi come piccole unghie, nella farina e nella mollica."
  - id: i_cane_croste
    conclusione: r_pane
    tipo: evento
    nodo: n_osteria
    essenziale: false
    tiro: "nessuno"
    modi: 3   # guardare Moro; parlargli con la magia; la mossa morbida
    come_si_trova: "Chi guarda Moro lo vede tremare e leccarsi le zampe. Nella sua ciotola ci sono croste di pane nero. Chi gli parla con la magia sente cose da cane: le croste erano buone, poi bruciava la bocca, ora bruciano le zampe. È anche la mossa morbida della scena."
  - id: i_preghiera_pane
    conclusione: r_pane
    tipo: visione
    nodo: n_osteria
    essenziale: false
    tiro: "nessuno"
    modi: 1
    come_si_trova: "Se Teodora prega sul pane o sulla farina per sentire se è impuro: sente un freddo in bocca e un odore di marcio che sente solo lei."
  - id: i_baldrin_sano
    conclusione: r_pane
    tipo: png
    nodo: png_baldrin
    essenziale: false
    tiro: "nessuno"
    modi: 1
    come_si_trova: "Chi chiede a Baldrin se beve al pozzo, o perché lui sta bene: beve al pozzo da sempre, ma il pane di segale non lo tocca."
  - id: i_carbonai_sani
    conclusione: r_pane
    tipo: png
    nodo: png_baldrin
    essenziale: false
    tiro: "nessuno"
    modi: 1
    come_si_trova: "Chi chiede a Baldrin chi si è ammalato e chi no: i carbonai bevono al pozzo come tutti, il pane lo fanno da sé, e stanno bene."
  - id: i_sebastiano_avverte
    conclusione: r_pane
    tipo: png
    nodo: png_sebastiano
    essenziale: false
    tiro: "nessuno"
    modi: 1
    come_si_trova: "Chi parla con Sebastiano della febbre: dice che non è l'acqua, è il pane. E che lo ha detto all'ostessa due giorni fa."
  - id: i_polvere_nera
    conclusione: r_innocente
    tipo: oggetto
    nodo: n_osteria
    essenziale: false
    tiro: "nessuno"
    modi: 1
    come_si_trova: "Baldrin mostra il sacchetto di polvere nera come prova del veleno. Chi la tocca o la annusa: sa di bruciato e tinge le dita, come la polvere di un braciere spento. Il narratore descrive, non spiega: la conclusione la tirano i giocatori."
  - id: i_libretto
    conclusione: r_innocente
    tipo: documento
    nodo: n_osteria
    essenziale: false
    tiro: "nessuno"
    modi: 1
    come_si_trova: "Chi sfoglia il libretto della borsa: dosi di erbe, di carbone e di vino, per ferite e febbri, in una calligrafia ordinata. Nessun nome."
  - id: i_tecla_corvo
    conclusione: r_innocente
    tipo: png
    nodo: png_baldrin
    essenziale: false
    tiro: "nessuno"
    modi: 2   # chiedere dei malati; chiedere della notte al pozzo
    come_si_trova: "Chi chiede a Baldrin dei malati o della notte al pozzo: la vecchia Tecla, dice lui, delira. Racconta che un corvo le ha dato da bere."
  - id: i_sebastiano_tecla
    conclusione: r_innocente
    tipo: png
    nodo: png_sebastiano
    essenziale: false
    tiro: "nessuno"
    modi: 1
    come_si_trova: "Chi chiede a Sebastiano cosa faceva al pozzo: prendeva acqua per la vecchia che vive lì accanto, sola e malata."
  - id: i_nodo_bende
    conclusione: r_cerusico
    tipo: oggetto
    nodo: n_osteria
    essenziale: false
    tiro: "nessuno"
    modi: 1
    come_si_trova: "Nella borsa, bende arrotolate e chiuse con un nodo doppio e piatto. Il narratore descrive il nodo e basta: chi lo riconosce è il giocatore."
  - id: i_parole_da_medico
    conclusione: r_cerusico
    tipo: png
    nodo: png_sebastiano
    essenziale: false
    tiro: "nessuno"
    modi: 1
    come_si_trova: "Quando Sebastiano parla di malati usa parole da medico, e si corregge subito con parole semplici."
  - id: i_cicatrice
    conclusione: r_cerusico
    tipo: png
    nodo: png_sebastiano
    essenziale: false
    tiro: "nessuno"
    modi: 2   # il cappuccio abbassato; la candela alla grata
    come_si_trova: "Se Sebastiano abbassa il cappuccio, o qualcuno lo guarda da vicino con una candela alla grata: una cicatrice bianca gli taglia il sopracciglio sinistro."
  - id: i_registro_conti
    conclusione: r_gualtiero
    tipo: documento
    nodo: n_osteria
    essenziale: false
    tiro: "nessuno"
    modi: 1
    come_si_trova: "Nel quaderno dei conti, quattro giorni fa: sei sacchi di segale da Gualtiero, a metà prezzo, metà da pagare a primavera."
  - id: i_sacchi_marchio
    conclusione: r_gualtiero
    tipo: oggetto
    nodo: n_osteria
    essenziale: false
    tiro: "nessuno"
    modi: 1
    come_si_trova: "Sui sacchi nel retro c'è una ruota di mulino dipinta di nero, e sotto la parola Valsecca."
  - id: i_baldrin_testimoni
    conclusione: r_gualtiero
    tipo: png
    nodo: png_baldrin
    essenziale: false
    tiro: "nessuno"
    modi: 2   # le due condizioni di cede_se: i nomi dei tre; lui che beve al pozzo
    come_si_trova: "Solo quando Baldrin cede sulla sua menzogna: al pozzo il forestiero l'ha visto solo lui, da lontano. La polvere l'ha vista Gualtiero, il mugnaio."
  - id: i_ottavia_confessione
    conclusione: r_gualtiero
    tipo: png
    nodo: png_ottavia
    essenziale: false
    tiro: "nessuno"
    modi: 2   # le due condizioni di cede_se: il chicco in privato; Assenzio
    come_si_trova: "Solo quando Ottavia cede: la segale è di Gualtiero, presa a metà prezzo. «Prendila tutta», le ha detto lui."

# Almeno 2 uscite verso altri nodi, ognuna con l'indizio che la segnala.
uscite:
  - {verso: n_mulino_valsecca, segnalata_da: [i_sacchi_marchio, i_registro_conti, i_ottavia_confessione], nota: "Stanotte non si raggiunge: è la pista per domani."}
  - {verso: n_piazza, segnalata_da: [i_tecla_corvo, i_sebastiano_tecla, i_baldrin_testimoni], nota: "La casa di Tecla e il pozzo sono a venti passi. Uscire fa avanzare l'orologio."}

# Se i PG indugiano (S1). È anche l'indizio proattivo i_cane_croste.
mossa_morbida_pronta: "Il cane, Moro, si tira su accanto al forno, tremando. Guaisce e si lecca le zampe. Nella sua ciotola restano croste di pane nero."

# Al massimo 3 frasi per la voce, conformi al §5. Viene letta dopo sessione.riassunto_iniziale.
apertura: "All'osteria del Forno Vecchio c'è odore di pane caldo e di lana bagnata. Un nano col martello sulle ginocchia sorveglia una porta chiusa a chiave: dall'altra parte, qualcuno tossisce. Ottavia, l'ostessa, copre di lino le ceste del pane dei lumi, poi vi guarda: che fate?"

musica:
  tag: esplorazione_tesa
  transizione: "Dissolvenza lenta verso rito_sacro al sesto segno dell'orologio, quando il paese canta sotto il portico. A scena chiusa: taverna_calda se Sebastiano resta vivo sotto il tetto, lutto se il paese se lo prende."

# La compone il Motore (E14): invarianti del luogo, poi PNG presenti, poi [STILE].
immagine:
  invarianti: ["sala bassa con travi annerite", "forno a legna acceso in fondo", "tavolo lungo con ceste coperte di lino bianco", "porta di legno con grata di ferro", "finestra su una piazza di pietra con candele alle finestre", "cane nero accucciato vicino al forno"]
  prompt_luogo: "low-beamed mountain village tavern at night, soot-black rafters, glowing wood-fired bread oven at the back, long table with baskets covered in white linen, heavy wooden storeroom door with a small iron grate, window onto a stone square where a candle burns in every window, black dog lying asleep on the stone floor beside the oven"

# Condizione che chiude la scena (T5).
taglio: "La scena si chiude dopo il terzo rintocco, quando il paese alla porta ha avuto la sua risposta: se ne va con Sebastiano, con Ottavia, oppure senza nessuno. Se Sebastiano è già fuggito dalla botola, il paese arriva lo stesso, per il pane e per un colpevole. Se al sesto segno i PG esitano ancora, Baldrin apre la porta e il paese entra: i PG hanno una sola risposta, poi la scena si chiude."
