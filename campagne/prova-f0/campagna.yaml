      pg_corrado: {tu: "soldato pieno di debiti", bisogno: "una paga pulita", vai: "riconosce il cerusico", cerca: "il prezzo giusto", trova: "perché è fuggito", paga: "rinuncia alla taglia, o alla coscienza", ritorna: "sceglie da che parte stare", cambia: "da mercenario a protettore"}
      pg_assenzio: {tu: "trovatello guardato storto", bisogno: "essere accettato a casa", vai: "vede Ottavia mentire", cerca: "un modo di salvarla", trova: "la sua vergogna", paga: "la affronta", ritorna: "la difende davanti al paese", cambia: "smette di scappare"}
      pg_teodora: {tu: "chierica al primo incarico", bisogno: "fidarsi del proprio giudizio", vai: "deve benedire il pane", cerca: "cosa vuole davvero il rito", trova: "la regola delle castagne", paga: "sfida l'usanza davanti a tutti", ritorna: "guida la veglia a modo suo", cambia: "da esecutrice a guida"}
