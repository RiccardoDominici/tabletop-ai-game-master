  # C3 — Cattivo con agenda (fuori scena per tutta la sessione di prova).
  cattivo:
    id: gualtiero_malerba
    nome: "Gualtiero Malerba"
    pronuncia: "Gualtièro Malèrba"
    ruolo: "mugnaio di Valsecca; ha venduto la segale guasta"
    obiettivo: "Liberarsi della segale guasta senza perdere il mulino né il buon nome."
    cronologia_se_i_pg_non_intervengono:
      - "Quattro giorni fa vende sei sacchi a Ottavia, a metà prezzo, metà a credito."
      - "Due notti fa vede un incappucciato al pozzo e dice a Baldrin di avergli visto versare una polvere."
      - "Ieri all'alba riparte verso Pievebassa con altri dieci sacchi."
      - "Stanotte il paese mangia il pane dei lumi e caccia il forestiero: nessuno guarda la farina."
      - "Tra una settimana vende i sacchi a Pievebassa; a primavera compra il forno di Ottavia per il debito."
    risorse:
      - {cosa: "carro e mulo", a_cosa_serve: "spostare la segale in fretta, da un paese all'altro"}
      - {cosa: "il credito di Ottavia", a_cosa_serve: "tenerla zitta e prendersi il forno a primavera"}
      - {cosa: "la fama di uomo onesto", a_cosa_serve: "essere creduto contro un forestiero"}
      - {cosa: "la voce della polvere nel pozzo", a_cosa_serve: "dare al paese un colpevole che non sia la farina"}
    reazioni:
      - {intrusione: "i PG scoprono che la segale è sua", reazione: "dice che Ottavia ha mischiato la sua farina con roba vecchia"}
      - {intrusione: "i PG lo cercano a Valsecca", reazione: "nasconde i sacchi nel mulino vecchio e offre un pranzo"}
      - {intrusione: "Sebastiano viene creduto", reazione: "lo denuncia alla Compagnia del Grifo per la taglia"}
    stato_di_quiete: "Fontescura viveva di castagne, di carbone e del pane di Ottavia. L'unico nemico era l'inverno."
    chiamata_all_azione: "Il pane dei lumi è nelle ceste e il paese vuole un colpevole prima del terzo rintocco."

  # C6 — Segreti astratti: una o due frasi, senza luogo fisso. Quelli non usati passano oltre.
  segreti_astratti:
    - "Gualtiero sapeva che la segale era guasta: il granaio del conte l'aveva rifiutata un mese fa."
    - "Sulla testa di Sebastiano c'è una taglia di venti corone della Compagnia del Grifo."
    - "Sebastiano ha disertato per non lasciar morire i feriti nemici, non per paura."
    - "Ottavia deve ancora a Gualtiero metà della segale: se non paga a primavera, il forno è suo."
    - "Quest'estate i campi bassi di Valsecca sono rimasti sott'acqua per due settimane."
    - "Il sacrestano suona sempre la campana un po' prima, perché in cappella ha freddo."
    - "Ilde ha chiesto al padre un pezzo di pane dei lumi, e lui gliel'ha promesso."
    - "Da bambino, quando passavano le guardie, Ottavia nascondeva Assenzio sotto la botola del ripostiglio."
    - "Il libro del rito ammette le castagne al posto del pane impuro."
    - "Due cavalieri della Compagnia sono già a Pievebassa e fanno domande nelle osterie."

