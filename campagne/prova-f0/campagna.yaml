# Campagna «prova-f0» — Il pane dei lumi. Artefatti del Preparatore (manuale §2).
#
# Divisione per pubblico (E2, need-to-know):
#   - tutto ciò che sta sotto `preparazione` NON va al Narratore (destini, cronologia del
#     cattivo, segreti astratti, archi dei PG);
#   - le altre chiavi (canone, orologi, rivelazioni, colli_di_bottiglia, nodi, sessione)
#     servono al Narratore per giocare la scena in modo coerente.
#
# Gli id dei fatti (f_*) sono quelli citati nelle schede PNG (sa, non_sa, mente_su.verita,
# crede_a_torto.contraddice). Gli id degli indizi (i_*) sono definiti nella scheda della scena
# o, per i nodi senza scheda, qui sotto in `nodi`.

id: prova-f0

# ---------------------------------------------------------------------------
# CANONE (E10): fatti confermati all'inizio della sessione.
# noto_ai_pg: true  = i PG lo sanno o lo sa tutto il paese, si può dire a voce;
# noto_ai_pg: false = verità nascosta: la può dire solo un PNG che la sa, o un indizio.
# ---------------------------------------------------------------------------
canone:
  # Pubblici
  - {id: f_notte_lumi, noto_ai_pg: true, stato: confermato, entita: [n_piazza],
     testo: "Stanotte è la Notte dei Lumi: ogni casa tiene una candela alla finestra per i morti, e le donne cantano la veglia nella cappella."}
  - {id: f_campana, noto_ai_pg: true, stato: confermato, entita: [n_piazza],
     testo: "La campana della cappella suona un rintocco a metà veglia e tre rintocchi alla fine."}
  - {id: f_rito_pane, noto_ai_pg: true, stato: confermato, entita: [n_osteria],
     testo: "Al terzo rintocco il paese viene all'osteria a spezzare il pane dei lumi. Lo benedice chi manda il tempio o, se non c'è nessuno, il massaro. Lo mangiano tutti, anche i bambini: rifiutarlo offende i morti."}
  - {id: f_pane_lumi_paga, noto_ai_pg: true, stato: confermato, entita: [png_ottavia],
     testo: "Ogni famiglia paga il pane dei lumi un soldo: è l'incasso più grosso dell'autunno per l'osteria."}
  - {id: f_febbre_sintomi, noto_ai_pg: true, stato: confermato, entita: [],
     testo: "Da due giorni nove persone del paese hanno la febbre: mani e piedi che bruciano, tremori, visioni."}
  - {id: f_malati_nomi, noto_ai_pg: true, stato: confermato, entita: [png_baldrin],
     testo: "Tra i malati ci sono Ilde, la figlia di Baldrin, i due figli del bottaio e la vecchia Tecla, che vive sola accanto al pozzo."}
  - {id: f_accusa, noto_ai_pg: true, stato: confermato, entita: [png_sebastiano],
     testo: "Il paese dice che due notti fa il forestiero ha versato una polvere nel pozzo."}
  - {id: f_forestiero_arrivo, noto_ai_pg: true, stato: confermato, entita: [png_sebastiano],
     testo: "Sebastiano, il forestiero, è arrivato tre giorni fa, a piedi, con una borsa sola. Dice di vendere spezie."}
  - {id: f_chiuso_ripostiglio, noto_ai_pg: true, stato: confermato, entita: [png_sebastiano, png_baldrin],
     testo: "Stasera Baldrin ha chiuso Sebastiano a chiave nel ripostiglio dell'osteria, fino alla fine della veglia."}
  - {id: f_chiave_baldrin, noto_ai_pg: true, stato: confermato, entita: [png_baldrin],
     testo: "La chiave del ripostiglio è appesa al collo di Baldrin, su un laccio di cuoio."}
  - {id: f_borsa_contenuto, noto_ai_pg: true, stato: confermato, entita: [png_baldrin, png_sebastiano],
     testo: "Ai piedi di Baldrin c'è la borsa di Sebastiano: dentro, un sacchetto di polvere nera, bende arrotolate, una tazza di stagno e un libretto scritto fitto, che Baldrin non sa leggere."}
  - {id: f_baldrin_massaro, noto_ai_pg: true, stato: confermato, entita: [png_baldrin],
     testo: "Baldrin è il fabbro e il massaro di Fontescura: quando parla lui, il paese ascolta."}
  - {id: f_gualtiero_passato, noto_ai_pg: true, stato: confermato, entita: [],
     testo: "Gualtiero, il mugnaio di Valsecca, è passato in paese col carro quattro giorni fa ed è ripartito ieri all'alba verso Pievebassa."}

  # Nascosti
  - {id: f_causa_segale, noto_ai_pg: false, stato: confermato, entita: [png_ottavia],
     testo: "La febbre è il fuoco nero: viene dal pane fatto con la segale guasta. Il pozzo non c'entra."}
  - {id: f_pozzo_pulito, noto_ai_pg: false, stato: confermato, entita: [n_piazza],
     testo: "L'acqua del pozzo è pulita."}
  - {id: f_fuoco_nero, noto_ai_pg: false, stato: confermato, entita: [],
     testo: "Il fuoco nero viene dalla segale con gli speroni: chicchi neri e curvi come piccole unghie. Brucia mani e piedi, fa tremare, dà visioni."}
  - {id: f_segale_gualtiero, noto_ai_pg: false, stato: confermato, entita: [png_ottavia],
     testo: "Quattro giorni fa Ottavia ha comprato da Gualtiero sei sacchi di segale a metà prezzo. Metà la deve ancora, da pagare a primavera."}
  - {id: f_segale_di_sempre, noto_ai_pg: false, stato: confermato, entita: [png_ottavia],
     testo: "Per trent'anni Ottavia ha comprato la segale al mulino del paese, mai altrove, fino a quattro giorni fa."}
  - {id: f_chicchi_neri, noto_ai_pg: false, stato: confermato, entita: [png_ottavia, n_osteria],
     testo: "Nei sacchi di Gualtiero ci sono chicchi neri e curvi. Ottavia ne ha tolti molti col setaccio, ma ne restano."}
  - {id: f_setaccio_inutile, noto_ai_pg: false, stato: confermato, entita: [n_osteria],
     testo: "Il setaccio non basta: la farina resta guasta."}
  - {id: f_pane_lumi_segale, noto_ai_pg: false, stato: confermato, entita: [n_osteria],
     testo: "Il pane dei lumi nelle ceste è fatto tutto con la segale di Gualtiero."}
  - {id: f_cane_croste, noto_ai_pg: false, stato: confermato, entita: [n_osteria],
     testo: "Ieri Moro, il cane dell'osteria, ha mangiato le croste del pane nuovo. Da stamattina trema e si lecca le zampe."}
  - {id: f_ottavia_sospetta, noto_ai_pg: false, stato: confermato, entita: [png_ottavia],
     testo: "Ottavia sospetta che sia il pane, ma non vuole crederci: si ripete che il setaccio basta."}
  - {id: f_avvertimento, noto_ai_pg: false, stato: confermato, entita: [png_ottavia, png_sebastiano],
     testo: "Due giorni fa Sebastiano ha detto a Ottavia, in cucina, di non usare quella segale. Lei lo ha cacciato."}
  - {id: f_baldrin_sano, noto_ai_pg: false, stato: confermato, entita: [png_baldrin],
     testo: "Baldrin beve al pozzo ogni giorno, ma il pane di segale non lo mangia: sta bene."}
  - {id: f_carbonai_sani, noto_ai_pg: false, stato: confermato, entita: [],
     testo: "I carbonai del bosco bevono al pozzo come tutti, ma il pane lo cuociono da sé: nessuno di loro è malato."}
  - {id: f_ilde_pane, noto_ai_pg: false, stato: confermato, entita: [png_baldrin],
     testo: "Ilde ha chiesto al padre un pezzo di pane dei lumi. Baldrin glielo ha promesso per stanotte."}
  - {id: f_testimoni_pozzo, noto_ai_pg: false, stato: confermato, entita: [png_baldrin],
     testo: "Al pozzo, due notti fa, Sebastiano l'ha visto solo Baldrin, da lontano. Che versasse una polvere lo ha detto Gualtiero."}
  - {id: f_sebastiano_tecla, noto_ai_pg: false, stato: confermato, entita: [png_sebastiano],
     testo: "Due notti fa Sebastiano è andato al pozzo a prendere acqua per la vecchia Tecla, malata e sola."}
  - {id: f_tecla_dice_corvo, noto_ai_pg: false, stato: confermato, entita: [],
     testo: "Tecla racconta che di notte un corvo le ha dato da bere."}
  - {id: f_tecla_curata, noto_ai_pg: false, stato: confermato, entita: [png_sebastiano],
     testo: "Sebastiano ha dato a Tecla acqua e carbone pestato, e le ha messo le mani nella neve. Da allora Tecla sta meglio."}
  - {id: f_polvere_carbone, noto_ai_pg: false, stato: confermato, entita: [png_sebastiano],
     testo: "La polvere nera nella borsa è carbone di legna pestato: un rimedio, non un veleno."}
  - {id: f_rimedio, noto_ai_pg: false, stato: confermato, entita: [],
     testo: "Chi smette di mangiare il pane guasto guarisce in pochi giorni. Acqua, carbone pestato e freddo sulle mani aiutano."}
  - {id: f_libretto, noto_ai_pg: false, stato: confermato, entita: [png_sebastiano],
     testo: "Il libretto di Sebastiano è pieno di dosi di erbe, di carbone e di vino, per ferite e febbri. Non ci sono nomi."}
  - {id: f_magia_sollievo, noto_ai_pg: false, stato: confermato, entita: [],
     testo: "La magia di cura dei PG calma il bruciore per un'ora, poi la febbre torna, finché si mangia quel pane."}
  - {id: f_sebastiano_cerusico, noto_ai_pg: false, stato: confermato, entita: [png_sebastiano],
     testo: "Sebastiano è un cerusico, non un mercante di spezie."}
  - {id: f_sebastiano_disertore, noto_ai_pg: false, stato: confermato, entita: [png_sebastiano],
     testo: "Sebastiano era il cerusico della Compagnia del Grifo. Ha disertato dopo l'assedio di Roccalba, e la Compagnia offre venti corone per riaverlo."}
  - {id: f_diserzione_motivo, noto_ai_pg: false, stato: confermato, entita: [png_sebastiano],
     testo: "Sebastiano ha disertato la notte in cui il capitano gli ordinò di lasciar morire i feriti nemici. Non ha rubato niente: è partito con la sola borsa."}
  - {id: f_nodo_cerusici, noto_ai_pg: false, stato: confermato, entita: [],
     testo: "I cerusici della Compagnia del Grifo chiudono le bende con un nodo doppio e piatto."}
  - {id: f_taglia_cerusico, noto_ai_pg: false, stato: confermato, entita: [],
     testo: "La Compagnia del Grifo offre venti corone per il suo cerusico disertore: sui quarant'anni, magro, con una cicatrice bianca sul sopracciglio sinistro."}
  - {id: f_cicatrice, noto_ai_pg: false, stato: confermato, entita: [png_sebastiano],
     testo: "Sotto il cappuccio, Sebastiano ha una cicatrice bianca che gli taglia il sopracciglio sinistro."}
  - {id: f_botola, noto_ai_pg: false, stato: confermato, entita: [n_osteria],
     testo: "Nel ripostiglio, sotto un sacco vuoto, c'è una botola che scende in cantina. Dalla cantina una scala sale nel retro, dietro la tenda, e una grata dà sotto il portico."}
  - {id: f_rito_castagne, noto_ai_pg: false, stato: confermato, entita: [],
     testo: "Il libro del rito dice: se il pane è impuro, i morti accettano le castagne. In paese nessuno se lo ricorda."}

# ---------------------------------------------------------------------------
# OROLOGI (C2): uno per pericolo. Il nome è quello dell'ostacolo.
# `segni` = un segno visibile o udibile per segmento, in ordine. Il Narratore mostra il
# segno del segmento appena riempito. `avanza_quando` è la regola di ritmo per F0,
# finché gli orologi non li tiene il Motore (E9).
# ---------------------------------------------------------------------------
orologi:
  - id: o_colpevole
    nome: "Il paese vuole un colpevole"
    pericolo: p_folla
    segmenti: 6
    pieni_all_inizio: 0
    # Ritmo minimo, letto dal Motore: se dall'ultimo segno sono passate almeno N risposte del
    # narratore, il Motore scrive nel contesto «mostralo in questa risposta».
    segno_almeno_ogni: 2
    segni:
      - "Dalla cappella, il canto della veglia si interrompe, poi riprende più in fretta."
      - "Un sasso batte su un'imposta: Baldrin si alza e va alla finestra."
      - "La campana suona un rintocco: Baldrin infila la chiave nella serratura, poi la toglie."
      - "Dalla finestra, lanterne in fila escono dalla cappella e si fermano vicino al pozzo."
      - "Sotto il portico, passi e voci basse: qualcuno prova la maniglia."
      - "Tre rintocchi: la veglia è finita, e bussano alla porta."
    avanza_quando:
      - "almeno un segno ogni due risposte del narratore: quando tocca, il Motore scrive nel contesto «mostralo in questa risposta»"
      - "subito, anche se la risposta precedente ne aveva uno, quando i PG fanno rumore, minacciano Baldrin, gridano dalla finestra o escono in piazza"
      - "mai due segni nella stessa risposta"
    al_completo: "Il paese è sotto il portico con le lanterne. Vuole il pane dei lumi, e vuole qualcuno che risponda della febbre stanotte. Se Baldrin è dalla parte dei PG, tiene il paese sulla soglia per il tempo di una risposta, non di più: la prova o la scelta la devono dare i PG. Se i PG mostrano la verità a tutti, la rabbia passa su Ottavia: il paese vuole lei. Se tacciono la verità, il paese vuole il forestiero. Vedi `taglio` nella scheda della scena."

  - id: o_febbre
    nome: "La febbre si allarga"
    pericolo: p_segale
    segmenti: 4
    pieni_all_inizio: 1
    segni:
      - "Nove malati in paese."
      - "Il paese spezza il pane dei lumi, e torna a casa con le candele."
      - "Un vecchio muore nella notte: si sa solo il mattino dopo."
      - "Mezzo paese ha le mani che bruciano; i carbonai se ne vanno."
    avanza_quando:
      - "fuori scena (T8): +2 se il paese mangia il pane dei lumi; +1 a ogni giorno in cui nessuno capisce la causa"

# ---------------------------------------------------------------------------
# RIVELAZIONI (C4): conclusioni chiave e indizi che le sostengono.
# Regola: >=3 indizi, in >=2 nodi, di >=2 tipi. La conclusione si spunta quando i
# giocatori la accettano, non quando la ipotizzano.
# ---------------------------------------------------------------------------
rivelazioni:
  - id: r_pane
    chiave: true
    conclusione: "La febbre viene dal pane di segale di Ottavia, non dal pozzo."
    indizi: [i_speroni_neri, i_cane_croste, i_baldrin_sano, i_carbonai_sani, i_sebastiano_avverte, i_preghiera_pane, i_pozzo_acqua]
  - id: r_innocente
    chiave: true
    conclusione: "Sebastiano non ha avvelenato il pozzo: di notte curava la vecchia Tecla."
    indizi: [i_polvere_nera, i_libretto, i_tecla_corvo, i_sebastiano_tecla, i_tecla_racconta]
  - id: r_gualtiero
    chiave: true
    conclusione: "La segale guasta viene da Gualtiero di Valsecca, e la storia della polvere nel pozzo l'ha messa in giro lui."
    indizi: [i_registro_conti, i_sacchi_marchio, i_baldrin_testimoni, i_ottavia_confessione]
  - id: r_cerusico
    chiave: false
    conclusione: "Sebastiano è il cerusico disertore della Compagnia del Grifo."
    indizi: [i_nodo_bende, i_parole_da_medico, i_cicatrice]

# Colli di bottiglia (C4): ognuno ha almeno 3 soluzioni.
colli_di_bottiglia_nota: "Tutte le soluzioni funzionano se i PG le tentano. Il narratore non suggerisce quelle segnate «solo se la propone chi la conosce»."
colli_di_bottiglia:
  - id: cb_porta
    ostacolo: "Parlare con Sebastiano, o farlo uscire dal ripostiglio chiuso a chiave."
    soluzioni:
      - "Parlargli attraverso la grata della porta: non serve aprire."
      - "Convincere Baldrin a dare la chiave o ad aprire lui."
      - "Passare dal retro alla cantina e salire dalla botola del ripostiglio: Baldrin non sente niente. Solo se la propone chi la conosce (Assenzio, oppure Ottavia dopo aver confessato)."
      - "Forzare la vecchia serratura: si apre, ma scatta forte e Baldrin se ne accorge."
  - id: cb_pane
    ostacolo: "Impedire che il paese mangi il pane dei lumi."
    soluzioni:
      - "Convincere Ottavia a non servirlo."
      - "Teodora cambia il rito: se il pane è impuro, i morti accettano le castagne. Solo se la propone chi la conosce (Teodora)."
      - "Nascondere, rovesciare o bruciare le ceste."
      - "Spezzare una pagnotta davanti a tutti e mostrare i chicchi neri nella mollica."
  - id: cb_folla
    ostacolo: "Fermare il paese al terzo rintocco."
    soluzioni:
      - "Convincere Baldrin: la parola del massaro tiene il paese sulla soglia, il tempo di farsi ascoltare."
      - "Mostrare le prove a tutti: la mollica, il cane, la polvere che è solo carbone."
      - "Far sparire Sebastiano dalla botola e lasciare alla folla un ripostiglio vuoto. Solo se la propone chi la conosce."
      - "Teodora parla al paese con l'autorità del rito."

# ---------------------------------------------------------------------------
# NODI (C5): luoghi, PNG ed eventi collegati da indizi.
# Solo n_osteria ha una scheda scena completa (scena.yaml). Gli altri luoghi sono
# abbozzi: bastano al Narratore per non inventare se i PG escono.
# ---------------------------------------------------------------------------
nodi:
  - id: n_osteria
    tipo: luogo
    nome: "L'osteria del Forno Vecchio"
    scheda: scena.yaml
    collegamenti: [n_piazza, n_mulino_valsecca, png_ottavia, png_baldrin, png_sebastiano, e_terzo_rintocco]
  - id: n_piazza
    tipo: luogo
    nome: "La piazza di Fontescura"
    abbozzo: "Piazza di pietra in salita. Al centro il pozzo con la carrucola. Accanto, la casa bassa della vecchia Tecla. In fondo la cappella, con le porte aperte e la veglia dentro. Fino al primo rintocco la piazza è vuota; dopo, qualcuno esce con la lanterna e si ferma a parlare vicino al pozzo. A ogni finestra brucia una candela."
    indizi:
      - {id: i_pozzo_acqua, conclusione: r_pane, tipo: luogo, essenziale: false, tiro: "nessuno", modi: 1,
         come_si_trova: "Chi tira su il secchio e guarda o assaggia l'acqua: è limpida e gelata, sa solo di pietra."}
      - {id: i_tecla_racconta, conclusione: r_innocente, tipo: png, essenziale: false, tiro: "nessuno", modi: 1,
         come_si_trova: "Chi entra da Tecla la trova a letto, con le mani in un catino d'acqua fredda. Dice che il corvo le ha dato acqua nera, e che da allora brucia meno."}
    collegamenti: [n_osteria, e_terzo_rintocco]
  - id: n_mulino_valsecca
    tipo: luogo
    nome: "Il mulino di Valsecca"
    abbozzo: "Il mulino di Gualtiero, a un giorno di cammino più a valle. Con il buio e la neve sul sentiero, stanotte non ci si arriva."
    prossima_sessione: true
    collegamenti: [n_osteria]
  - {id: png_ottavia, tipo: png, scheda: png/png_ottavia.yaml, collegamenti: [n_osteria, n_mulino_valsecca]}
  - {id: png_baldrin, tipo: png, scheda: png/png_baldrin.yaml, collegamenti: [n_osteria, n_piazza, n_mulino_valsecca]}
  - {id: png_sebastiano, tipo: png, scheda: png/png_sebastiano.yaml, collegamenti: [n_osteria, n_piazza]}
  - id: e_terzo_rintocco
    tipo: evento
    nome: "Il terzo rintocco"
    abbozzo: "Il paese esce dalla cappella con le lanterne e viene all'osteria: vuole il pane dei lumi e il forestiero."
    collegamenti: [n_osteria, n_piazza]

# ---------------------------------------------------------------------------
# SESSIONE (C9–C13). La sessione di prova è una sola scena.
# ---------------------------------------------------------------------------
sessione:
  # C9: letto dal narratore a inizio sessione, prima di scena.apertura.
  # Riassunto (3 frasi) + apertura (3 frasi) = 6 frasi, il massimo di N2.
  riassunto_iniziale: "È la Notte dei Lumi, a Fontescura. Da due giorni, nove persone del paese bruciano di febbre. Dicono che sia colpa di un forestiero, e al terzo rintocco verranno a prenderlo."
  # C10: le cinque stanze, dentro una sola scena.
  cinque_stanze:
    ingresso_o_guardiano: "Baldrin di guardia alla porta del ripostiglio, col martello e la chiave."
    enigma_o_sfida_sociale: "Chi dice il vero? Ottavia mente sulla segale; Sebastiano mente sul suo mestiere."
    trucco_o_battuta_d_arresto: "La prova di Baldrin, la polvere nera, sembra veleno ed è carbone. Ottavia, messa alle strette, prova a bruciare i sacchi."
    climax: "Il terzo rintocco: il paese alla porta vuole un colpevole. La verità detta a tutti salva il forestiero ma getta Ottavia in pasto alla rabbia del paese; il silenzio salva Ottavia ma non il forestiero."
    ricompensa_o_colpo_di_scena: "Il nome di Gualtiero; e, se c'è Corrado, la taglia sulla testa di Sebastiano."
  # C11: scene potenziali. Per F0 solo la prima ha la scheda completa.
  scene_potenziali: [scena_forno_vecchio]
  # C13: chiusura.
  chiusura: "Una scelta aperta: andare a Valsecca a cercare Gualtiero, accompagnare Sebastiano al passo, o restare a curare i malati. Si chiede ai giocatori cosa pensano di fare."

# ===========================================================================
# PREPARAZIONE: solo per Preparatore, Critico e Motore. NON va nel contesto del Narratore.
# ===========================================================================
preparazione:

  # C2 — Fronti.
  fronti:
    - id: fronte_grano_marcio
      livello: campagna
      nome: "Il grano marcio della valle"
      pericoli:
        - id: p_gualtiero
          tipo: "organizzazione ambiziosa: un mercante senza scrupoli"
          impulso: "arricchirsi"
          destino_incombente: "La segale guasta arriva in ogni osteria della valle, e Gualtiero compra per niente i forni falliti."
          presagi:
            - {testo: "La segale guasta arriva a Fontescura.", segno_visibile: "Sei sacchi con la ruota nera nel retro dell'osteria."}
            - {testo: "Gualtiero vende il resto a Pievebassa.", segno_visibile: "Tracce fresche del carro sulla strada verso valle."}
          mosse: ["vende sottocosto", "sparge una voce", "compra un debito", "sparisce col carro"]
          cast: [gualtiero_malerba]
          orologio: o_grano
        - id: p_compagnia
          tipo: "orda: una compagnia di ventura che cerca i suoi disertori"
          impulso: "riprendere"
          destino_incombente: "La Compagnia del Grifo riporta Sebastiano al campo e lo impicca davanti ai soldati."
          presagi:
            - {testo: "La Compagnia mette una taglia sui disertori.", segno_visibile: "Un avviso con il grifo inchiodato alla porta della cappella."}
          mosse: ["offre una taglia", "manda due cavalieri", "interroga gli osti"]
          cast: []
          orologio: o_compagnia
      domande_di_posta:
        - "Gualtiero pagherà per la segale?"
