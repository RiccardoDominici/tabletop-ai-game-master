# Scheda PNG (manuale §3). Sebastiano è il forestiero accusato: dice il vero sul pane, mente su chi è.
id: png_sebastiano
nome: "Sebastiano"
pronuncia: "Sebastiàno"
# Soprannomi con cui i giocatori lo nomineranno nelle azioni: il Motore li usa per la pertinenza
# (repertorio/pertinenza.ts) e, se ci sono, sostituiscono gli alias predefiniti del server.
alias: [forestiero, straniero, prigioniero, incappucciato, mercante, "quello là dentro", "quello la dentro"]
livello: principale
ruolo: "il forestiero accusato; testimone che conosce la causa; alleato se lo si crede"
fronte: fronte_fuoco_nero

aspetto:
  lettura: "Un uomo magro, sulla quarantina, col cappuccio nero calato sugli occhi. Ha le mani pulite, e non tremano."
  # Ritratto e invarianti vanno sul proiettore dal primo turno: la cicatrice lo identifica come il
  # cerusico ricercato (f_cicatrice, i_cicatrice), quindi qui c'è solo il cappuccio calato, e il
  # sopracciglio resta in ombra. La cicatrice compare nella situazione «senza_cappuccio», da
  # mostrare dopo la rivelazione (nar_volto_candela, nar_volto_uscita).
  # Le mani pulite e ferme, da cerusico, restano solo nella lettura a voce: nell'immagine le tiene
  # nelle maniche, che è anche il suo segnale quando mente.
  invarianti: ["circa 40 anni", "alto e magro", "mantello nero col cappuccio calato sugli occhi, logoro", "barba di tre giorni"]
  # Ritratto a busto per il proiettore (ha la precedenza su prompt_immagine): solo tratti pubblici,
  # nessuna situazione, fondo d'inchiostro blu ardesia.
  prompt_ritratto: "head-and-shoulders bust portrait of a gaunt tall man about forty, worn black wool travelling cloak with a deep medieval hood pulled low, his brow and eyes in the shadow of the hood, three-day stubble, arms folded with his hands tucked into his sleeves, facing the viewer, against a plain dark slate-blue ink wash background that fills the frame, [STILE]"
  prompt_immagine: "gaunt man about forty, worn black hooded cloak pulled low, his brow and eyes lost in the shadow of the hood, hands tucked into his sleeves, three-day stubble, face seen through the small iron grate of a storeroom door, candlelight, [STILE]"
  situazioni:
    - id: senza_cappuccio
      dopo: [i_cicatrice]   # sul proiettore solo quando la cicatrice è stata vista
      prompt: "his hood pushed back onto his shoulders, brow and eyes uncovered, face fully lit by a candle, a thin white scar splits his left eyebrow"

personalita:
  superficie: ["calmo e cortese, anche con chi lo insulta", "preciso: fa domande come un medico", "riservato sul suo passato"]
  sotto_pressione: ["diventa freddo e tagliente, e dice verità che fanno male", "davanti a un malato dimentica la prudenza e si espone"]
  contraddizione: "Vuole sparire senza lasciare traccia, ma non riesce a tacere davanti a un malato."

scheda:
  gs: 0
  caratteristiche: {forza: 10, destrezza: 12, costituzione: 11, intelligenza: 14, saggezza: 13, carisma: 11}
  competenze: [medicina, percezione]
  pf: 4
  attacchi:
  - {nome: Bastone, caratteristica: forza, danno: 1d4, tipo_danno: contundente}
desiderio: "Uscire vivo da Fontescura prima dell'alba, senza che nessuno scopra chi è."   # in tensione con Baldrin, con p_folla e con p_compagnia (Corrado)
paura: "Essere riconosciuto e riportato alla Compagnia del Grifo, per la forca."

segreto:
  testo: "È il cerusico disertore della Compagnia del Grifo. È fuggito dopo Roccalba per non lasciar morire i feriti nemici, e sulla sua testa c'è una taglia di venti corone."
  chi_altro_sa: [compagnia_del_grifo]
  se_rivelato: "Corrado può consegnarlo per la taglia. Il paese gli crede di più sul pane, ma lo teme come disertore."

voce:
  tts: {voce_id: lucian, eta_apparente: "40-45", altezza: media, velocita: 0.95, timbro: "basso, rauco di tosse, pacato"}
  registro: "Dà del lei a tutti, come un medico di città, anche a chi lo insulta. Non dà mai del tu."
  stile: "Frasi ordinate e brevi. Fa domande precise: da quando, quanto, cosa avete mangiato."
  tic: ["«Mi permetta.» prima di una domanda"]
  gesto: "si stringe il cappuccio sotto il mento"
  mai_dice: ["il nome della Compagnia del Grifo, finché non lo dice qualcun altro", "parolacce o insulti", "una promessa che non può mantenere"]
  battuta_campione: "Mi permetta una domanda. Lei ha mangiato pane, stasera?"

sa:
  - f_causa_segale         # è il pane di segale, non l'acqua
  - f_fuoco_nero
  - f_febbre_sintomi
  - f_setaccio_inutile
  - f_avvertimento         # ha avvertito Ottavia due giorni fa
  - f_pozzo_pulito
  - f_sebastiano_tecla     # al pozzo prendeva acqua per Tecla
  - f_tecla_curata
  - f_polvere_carbone      # la polvere nera è carbone
  - f_rimedio
  - f_magia_sollievo
  - f_sebastiano_cerusico
  - f_sebastiano_disertore
  - f_diserzione_motivo
  - f_nodo_cerusici
  - f_cicatrice
  - f_accusa
  - f_chiuso_ripostiglio
  - f_borsa_contenuto
  - f_libretto
non_sa:
  - f_segale_gualtiero     # domanda probabile: «da dove viene quella segale?»
  - f_pane_lumi_segale     # può solo supporre: «se è fatto con quella farina, sì»
  - f_testimoni_pozzo
  - f_botola
  - f_ilde_pane
  - f_ottavia_sospetta
crede_a_torto:
  - {testo: "L'ostessa sa benissimo che il pane è guasto, e lo vende lo stesso.", contraddice: f_ottavia_sospetta}
mente_su:
  - id: seb_mestiere   # = effetti.menzogna_detta delle sue battute
    argomento: "il suo mestiere"
    verita: f_sebastiano_cerusico
    versione: "Vendo spezie. Pepe, cannella, chiodi di garofano."
    perche: "Se scoprono che è un cerusico, qualcuno si chiederà di quale esercito."
    segnale: "nasconde le mani nelle maniche e tossisce"
    cede_se: "Dice di essere un cerusico a chi gli promette di non consegnarlo, quando Baldrin non può sentire: dalla botola, o mentre Baldrin è alla finestra. Oppure quando un malato ha bisogno di lui davanti ai suoi occhi."
  - id: seb_guerra   # = effetti.menzogna_detta delle sue battute
    argomento: "la guerra e da dove viene"
    verita: f_sebastiano_disertore
    versione: "Soldato io? Vengo dal mare. Ho sempre venduto spezie."
    perche: "Paura della forca."
    segnale: "nasconde le mani nelle maniche e tossisce"
    cede_se: "Solo dopo averlo negato una volta: quando un PG nomina Roccalba o la Compagnia del Grifo e gli promette di non venderlo."

atteggiamento_pg:
  pg_ginestra: {stato: amichevole, perche: "chi conosce le erbe può capire", vuole: "che guardi la farina con i suoi occhi"}
  pg_assenzio: {stato: amichevole, perche: "anche lui è guardato storto, come un corvo", vuole: "che apra quella porta, in un modo o nell'altro"}
  pg_teodora:  {stato: indifferente, perche: "i preti fanno domande sul passato", vuole: "che non benedica il pane"}
  pg_corrado:  {stato: ostile, perche: "riconosce il passo e la cintura da soldato, e teme la Compagnia", vuole: "che non lo guardi in faccia"}

relazioni:
  png_ottavia: "l'ha avvertita; lei l'ha cacciato dalla cucina"
  png_baldrin: "il suo carceriere; gli fa pena, per la figlia"
  tecla: "la malata che ha curato di notte"

info_chiave: [i_sebastiano_avverte, i_sebastiano_tecla, i_parole_da_medico, i_cicatrice]

iniziative:
  - "Chiede un sorso d'acqua a chiunque passi vicino alla grata."
  - "Non regala ciò che sa: in cambio chiede acqua, una promessa, o la porta aperta. Ma se vede qualcuno portare il pane alla bocca, grida di non mangiarlo."
  - "Se sente che la chierica benedirà il pane, la chiama alla grata."
  - "Se gli parlano di un malato, anche del cane, chiede di vederlo e spiega il rimedio."

evoluzione:
  - {se: "lo liberano e lo credono", allora: "insegna il rimedio, resta fino all'alba a curare i malati, poi chiede di partire"}
  - {se: "Corrado lo riconosce e lo minaccia", allora: "smette di mentire e chiede solo di salvare prima il paese; dopo, lo consegnino se vogliono"}
  - {se: "lo consegnano al paese", allora: "non si difende più; dice solo, ad alta voce, di non mangiare il pane"}
  - {se: "scopre la botola", allora: "non fugge finché il pane è nelle ceste: prima pretende che nessuno lo mangi. Poi, se nessuno gli chiede di restare, sparisce nella notte"}

statistiche: "popolano (SRD 5.2), con competenza in Medicina"
registro_attivita: []
