    temi: [acqua]
    scena: scena_ruota
    richiede: {orologio: {id: o_mezzanotte, min: 6, max: 8}}
    testo:
      - "[narratore] L'acqua che corre nella gora è torbida e fredda."
      - "[narratore] Porta foglie strette di salice e schiuma gialla, da monte, dalla chiusa."
    effetti: {rivela_indizi: [i_acqua_salici]}
    max_usi: 1

