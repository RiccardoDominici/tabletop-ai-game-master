  # ---------------------------------------------------------------- transizioni
  - id: tr_verso_chiusa
    chi: narratore
    tipo: transizione
    quando: "i PG risalgono la gora verso la chiusa di monte"
    temi: [risalgo, risalire, risaliamo, monte]
    testo:
