      - "[narratore] Il paese se ne va in silenzio, e la supplica partirà all'alba."
    max_usi: 1

  # ---------------------------------------------------------------- chiusure della serata (una per scena)
  - id: nar_chiusura_aia
    chi: narratore
    tipo: chiusura
    quando: "il master chiude la serata nell'aia di Adalgisa"
    temi: [aia, pollaio]
    scena: scena_aia
    testo:
      - "[narratore] Il sole è sceso dietro l'argine, e la rete del pollaio sbatte ancora."
      - "[narratore] In paese si accendono le prime lanterne: a mezzanotte, dicono, la ruota girerà di nuovo."
    max_usi: 1
  - id: nar_chiusura_mulino
    chi: narratore
    tipo: chiusura
    quando: "il master chiude la serata al mulino"
    temi: [mulino, macine]
    scena: scena_mulino
    testo:
      - "[narratore] Nel mulino la farina si posa piano sulle macine ferme."
      - "[narratore] La ruota aspetta sopra la gora, e mezzanotte non è lontana."
    max_usi: 1
  - id: nar_chiusura_ruota
    chi: narratore
    tipo: chiusura
    quando: "il master chiude la serata nel cortile del mulino"
    temi: [cortile, muretto]
    scena: scena_ruota
    testo:
      - "[narratore] Le lanterne si allontanano sulla strada del fiume, e il cortile torna buio."
      - "[narratore] San Martino è fra tre giorni, e il conte deciderà del mulino."
    max_usi: 1

  # ---------------------------------------------------------------- stallo (S1, S2, S3 per scena)
  - id: nar_stallo2_aia
    chi: narratore
    tipo: indizio
    stallo: 2
    quando: "nessuno agisce da un po' nell'aia"
    temi: [granaio]
    scena: scena_aia
    testo:
      - "[narratore] Il vento cala, e nell'aia si sente solo il secchio che gocciola nel pozzo."
      - "[narratore] Da dietro la porta del granaio arriva un chiocciare sommesso, poi più niente."
    effetti: {rivela_indizi: [i_chiocciare]}
    max_usi: 1
  - id: nar_stallo1_mulino
    chi: narratore
    tipo: momento
    stallo: 1
    quando: "nessuno agisce da un po' al mulino"
    temi: [ruota]
    scena: scena_mulino
    attori: [png_viola]
    testo:
      - "[narratore] Un colpo di vento spinge la ruota contro il fermo, con un tonfo di legno."
      - "[narratore] Dalla casa una tendina si sposta, e torna giù."
    max_usi: 1
  - id: nar_stallo2_mulino
    chi: narratore
    tipo: indizio
    stallo: 2
    quando: "nessuno agisce da un po' al mulino, e tira vento"
    temi: [piume]
    scena: scena_mulino
    testo:
      - "[narratore] Il vento spinge la ruota di un palmo contro il fermo."
      - "[narratore] Dal lato del muro si stacca una piuma rossiccia, e scende piano nella gora."
      - "[narratore] In fondo ha ancora un filo rosso, legato a un nodo piccolo."
    effetti: {rivela_indizi: [i_piume_pale]}
    max_usi: 1
  - id: nar_stallo2_ruota
    chi: narratore
    tipo: indizio
