      - "[narratore] Il mulino resta giù, piccolo, con una finestra accesa."
    max_usi: 1
  - id: tr_dalla_chiusa
    chi: narratore
    tipo: transizione
    quando: "i PG tornano dalla chiusa giù verso il mulino"
    temi: [ridiscendo, ridiscendiamo, ritorno]
    testo: ["[narratore] Si torna giù lungo l'argine, e la finestra del mulino si fa più grande."]
    max_usi: 1
  - id: tr_cortile
    chi: narratore
    tipo: transizione
    quando: "i PG escono dal mulino nel cortile"
    temi: [cortile, esco, usciamo]
    scena: [scena_mulino, scena_ruota]
    testo: ["[narratore] Nel cortile l'aria è fredda, e sa di fango e di foglie."]
