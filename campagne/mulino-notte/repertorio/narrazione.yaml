      - "[narratore] Ermete guarda dalla soglia, e non si muove."
      - "[narratore] Il paese torna a casa con le facce rosse di fuoco."
      - "[narratore] All'alba la supplica parte per il castello."
    max_usi: 1
  - id: fin_sconfitta_aia
    chi: narratore
    tipo: finale
    sconfitta: true
    quando: "tutto il gruppo è a terra nell'aia"
    temi: [sconfitta]
    scena: scena_aia
    attori: [png_folco]
    richiede: {stati: {png_folco: in_gioco}}
    testo:
